<section id="perf-formula" class="s-content" data-transition="fade">
<div class="head">
<p class="eyebrow">03 業績</p>
<h2 class="title">営業利益の計算式</h2>
</div>
<div class="body body-center" style="gap:48px">
<div class="row items-center enter" style="gap:32px">
<div class="card"><h3 class="card-title-lg">営業利益</h3></div>
<p class="display">=</p>
<div class="card"><h3 class="card-title-lg">売上総利益</h3></div>
<p class="display">−</p>
<div class="card"><h3 class="card-title-lg">販管費</h3></div>
</div>
<div class="row items-center enter d1" style="gap:32px">
<div class="card"><p class="lead">売上総利益(粗利)</p></div>
<p class="title">=</p>
<div class="card"><p class="lead">売上</p></div>
<p class="title">−</p>
<div class="card"><p class="lead">原価</p></div>
</div>
<p class="lead enter d2">比べるのは 2023年9月期 と 2026年9月期</p>
</div>
<aside>ここが、この動画の中心です。利益の計算は、シンプルです。営業利益は、売上総利益から、販売費及び一般管理費、つまり販管費を引いたものです。売上総利益は、売上から原価を引いた、いわゆる粗利です。3年前の2023年9月期と、2026年9月期を比べます。</aside>
</section>
