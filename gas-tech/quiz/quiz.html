自主検査は、検査をする者も目的も同じである。"]], "choices": ["イ", "ロ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 2, "explain": "<ul><li>イ：誤。<\/li><li>ロ：正。<\/li><li>ハ：誤。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.ibaraki.jp/seikatsukankyo/shobo/sangyo/info/sangyohoan/koatsugastebiki/documents/honnbunn-4.pdf\" target=\"_blank\" rel=\"noopener\">茨城県 保安検査<\/a><\/p>"}, {"n": 8, "topic": "認定制度の改正", "stmts": [["イ", "改正前に旧制度の認定を受けていた事業者は、施行日にただちに認定の効力を失った。"], ["ロ", "同じ改正で、認定完成検査実施者と認定保安検査実施者の認定制度は廃止された。"], ["ハ", "令和 5 年 12 月 21 日に施行された改正で、認定高度保安実施者の制度が設けられた。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。有効期間までは効力が続く。施行日から 3 年間（2026 年 12 月 21 日まで）の経過措置期間がある。<\/li><li>ロ・ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/sinnintei/index.html\" target=\"_blank\" rel=\"noopener\">経済産業省 認定高度保安実施者制度<\/a>、<a href=\"https://www.fdma.go.jp/relocation/neuter/topics/fieldList4_16/pdf/r05/01/shiryou4-4.pdf\" target=\"_blank\" rel=\"noopener\">消防庁掲載 新たな認定制度の運用<\/a><\/p>"}, {"n": 9, "topic": "認定高度保安実施者の要件", "stmts": [["イ", "認定高度保安実施者の認定では、経営トップの関与、リスク管理の体制、テクノロジーの活用、サイバーセキュリティへの対応などが求められる。"], ["ロ", "認定高度保安実施者は、都道府県知事が認定する。"], ["ハ", "認定高度保安実施者は、保安主任者・保安企画推進員の選任・解任の届出を要しない特例がある。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。経済産業大臣が認定する。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/sinnintei/index.html\" target=\"_blank\" rel=\"noopener\">経済産業省 認定高度保安実施者制度<\/a>、<a href=\"https://www.meti.go.jp/shingikai/sankoshin/hoan_shohi/koatsu_gas/pdf/026_01_00.pdf\" target=\"_blank\" rel=\"noopener\">経済産業省 審議会資料<\/a>、<a href=\"https://www.japaneselawtranslation.go.jp/ja/laws/view/4555/ja\" target=\"_blank\" rel=\"noopener\">日本法令外国語訳データベース 高圧ガス保安法<\/a><\/p>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "定期自主検査は、第一種製造者にだけ義務がある。"], ["ロ", "指定保安検査機関も指定完成検査機関も、経済産業大臣が指定する。"], ["ハ", "保安検査は外部の者が、定期自主検査は事業者自身が行う。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤（問 4）。<\/li><li>ロ・ハ：正。<\/li><\/ul>"}]}, {"id": "13", "topic": "危険時の措置・事故届・帳簿", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-13.md", "questions": [{"n": 1, "topic": "危険時の措置", "stmts": [["イ", "製造施設などが危険な状態になったときは、その所有者または占有者は、直ちに応急の措置を講じなければならない。"], ["ロ", "危険な状態を発見した者は、事業所の責任者にだけ連絡すればよく、警察や消防に届け出る必要はない。"], ["ハ", "危険な状態を発見した者は、直ちに都道府県知事、警察官、消防吏員、消防団員または海上保安官に届け出なければならない。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（第 36 条第 1 項）。<\/li><li>ロ：誤。<\/li><li>ハ：正（第 36 条第 2 項）。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201809-08.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 14 回（危険時の措置）<\/a>、<a href=\"https://www.pref.ehime.jp/page/10519.html\" target=\"_blank\" rel=\"noopener\">愛媛県 事故発生時の通報及び届出<\/a><\/p>"}, {"n": 2, "topic": "危険時の届出先", "stmts": [["イ", "危険時の届出先は、経済産業大臣に限られる。"], ["ロ", "危険時の届出先には、消防団員が含まれる。"], ["ハ", "危険時の届出先には、海上保安官が含まれる。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。<\/li><li>ロ・ハ：正。届出先は、都道府県知事・警察官・消防吏員・消防団員・海上保安官。事故の現場に一番早く着ける人に届けられるよう、幅広く定めている。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201809-08.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 14 回<\/a><\/p>"}, {"n": 3, "topic": "事故届", "stmts": [["イ", "高圧ガスについて災害が発生したときは、遅滞なく、都道府県知事または警察官に届け出なければならない。"], ["ロ", "事故届は、災害の発生から 30 日以内に経済産業大臣に届け出る。"], ["ハ", "高圧ガスや容器を喪失したとき、または盗まれたときも、遅滞なく届け出なければならない。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正（第 63 条第 1 項）。<\/li><li>ロ：誤。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.mie.lg.jp/SHOBO/HP/HPG_accident.htm\" target=\"_blank\" rel=\"noopener\">三重県 高圧ガスの事故<\/a>、<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/kouatu-jiko.html\" target=\"_blank\" rel=\"noopener\">宮城県 事故届<\/a><\/p>"}, {"n": 4, "topic": "報告の命令", "stmts": [["イ", "経済産業大臣または都道府県知事は、災害が発生した場合に、所有者または占有者に対し、報告を命じることができる。"], ["ロ", "事故の報告は、事業者が任意に行うもので、行政が命じることはできない。"], ["ハ", "事故が起きたら、まず電話などで通報し、その後遅滞なく事故届書を提出するという運用が、自治体で案内されている。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（第 63 条第 2 項）。<\/li><li>ロ：誤。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.aomori.lg.jp/kensei/jyourei/syobunkijyun/gyote_syobunkijyun_442.html\" target=\"_blank\" rel=\"noopener\">青森県 処分基準<\/a>、<a href=\"https://www.city.sendai.jp/hoan/zikotodokenituite.html\" target=\"_blank\" rel=\"noopener\">仙台市 事故届<\/a><\/p>"}, {"n": 5, "topic": "帳簿を備える者", "stmts": [["イ", "第一種製造者は、帳簿を備え、所定の事項を記載し、保存しなければならない。"], ["ロ", "販売業者は、帳簿を備え、所定の事項を記載し、保存しなければならない。"], ["ハ", "第一種貯蔵所・第二種貯蔵所の所有者または占有者は、帳簿を備え、所定の事項を記載し、保存しなければならない。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正（第 60 条第 1 項）。このほか、容器製造業者や容器検査所の登録を受けた者も帳簿を備える。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201810-08_R.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 15 回（帳簿）<\/a>、<a href=\"https://lawzilla.jp/law/326AC0000000204?n=ln60&amp;amp;mode=only\" target=\"_blank\" rel=\"noopener\">Lawzilla 第 60 条<\/a><\/p>"}, {"n": 6, "topic": "帳簿の保存期間：第一種製造者", "stmts": [["イ", "第一種製造者の帳簿は、すべて記載の日から 1 年間保存すればよい。"], ["ロ", "第一種製造者が容器に充てんした高圧ガスの授受について記載した帳簿は、記載の日から 2 年間保存する。"], ["ハ", "第一種製造者は、製造施設に異常があった場合、異常があった年月日とそれに対してとった措置を帳簿に記載し、記載の日から 10 年間保存する。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。<\/li><li>ロ：正。<\/li><li>ハ：正（一般則第 95 条）。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201810-08_R.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 15 回<\/a>、<a href=\"https://lawzilla.jp/law/341M50000400053?n=ln95&amp;amp;mode=only\" target=\"_blank\" rel=\"noopener\">Lawzilla 一般則第 95 条<\/a><\/p>"}, {"n": 7, "topic": "帳簿の保存期間：販売業者・貯蔵所", "stmts": [["イ", "販売業者は、販売所ごとに帳簿を備え、記載の日から 2 年間保存する。"], ["ロ", "販売業者の帳簿の保存期間は 10 年間である。"], ["ハ", "第一種貯蔵所・第二種貯蔵所に異常があった場合の記録は、記載の日から 10 年間保存する。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正。異常の記録を長く残すのは、同じ種類の事故を防ぐ対策や、設備の劣化の傾向を見るのに使えるからである。<\/li><li>ロ：誤。<\/li><\/ul><p>根拠：<a href=\"https://lawzilla.jp/law/341M50000400053?n=ln95.3&amp;amp;mode=only\" target=\"_blank\" rel=\"noopener\">Lawzilla 一般則第 95 条第 3 項<\/a>、<a href=\"https://www.city.sendai.jp/hoan/documents/4-kouatugasu-hannbai.pdf\" target=\"_blank\" rel=\"noopener\">仙台市 高圧ガスの販売<\/a><\/p>"}, {"n": 8, "topic": "期限の言葉", "stmts": [["イ", "危険時の届出は「直ちに」、事故届は「遅滞なく」行う。"], ["ロ", "保安統括者の選任の届出は「遅滞なく」行う。"], ["ハ", "第二種製造者の届出は「製造開始の 20 日前まで」に行う。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正（セット 01・03・10）。<\/li><\/ul>"}, {"n": 9, "topic": "帳簿の根拠", "stmts": [["イ", "帳簿の保存は義務ではなく、事業者の判断に任されている。"], ["ロ", "販売業者の容器授受の帳簿は、法第 20 条の 6 第 1 項と第 60 条第 1 項にもとづくものである。"], ["ハ", "帳簿の記載事項と保存期間は、一般則第 95 条などに定められている。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。<\/li><li>ロ・ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.saitama.lg.jp/documents/179680/tebikihanbai.pdf\" target=\"_blank\" rel=\"noopener\">埼玉県 販売の手引<\/a>、<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201810-08_R.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 15 回<\/a><\/p>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "容器を盗まれたことは、事故届の対象ではない。"], ["ロ", "製造施設に異常があったときの記録は 10 年、容器の授受の記録は 2 年保存する。"], ["ハ", "危険な状態を発見した者は、直ちに届け出る。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 5, "explain": "<ul><li>イ：誤（問 3）。<\/li><li>ロ：正。<\/li><li>ハ：正。<\/li><\/ul>"}]}, {"id": "14", "topic": "製造の技術上の基準 I（一般高圧ガス保安規則）", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-14.md", "questions": [{"n": 1, "topic": "保安物件", "stmts": [["イ", "学校や病院などは、第一種保安物件に当たる。"], ["ロ", "事業所と同じ敷地内にある社宅も、第二種保安物件に当たる。"], ["ハ", "第二種保安物件は、第一種保安物件以外の建築物で、住居の用に供するもの（事業所と同一敷地内にあるものを除く）である。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正（一般則第 2 条）。<\/li><li>ロ：誤。事業所と同一敷地内の住居は除かれる。<\/li><\/ul><p>根拠：<a href=\"https://klchem.co.jp/industry/siryo_8.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル 一般則抜粋<\/a>、<a href=\"https://note.com/lpg_urakata/n/n69b6fcfcd0ee\" target=\"_blank\" rel=\"noopener\">LP ガス裏方 保安距離<\/a><\/p>"}, {"n": 2, "topic": "火気との距離", "stmts": [["イ", "可燃性ガスの製造設備と火気の間に、距離の基準はない。"], ["ロ", "8 m 以上の距離をとれない場合は、漏えいしたガスが火気を取り扱う施設に流れ込むのを防ぐ措置などで代えることができる。"], ["ハ", "可燃性ガスの製造設備は、火気を取り扱う施設から 8 m 以上の距離をとる。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。<\/li><li>ロ・ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.klchem.co.jp/img/industry/pdf/gas_hoan_kisoku_H19-3-2.pdf\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル 一般則（PDF）<\/a>、<a href=\"https://chemical-engineering-review.com/security-regulation-for-general-high-pressure-gas/\" target=\"_blank\" rel=\"noopener\">化学工学レビュワー 一般則の出題内容<\/a><\/p>"}, {"n": 3, "topic": "設備どうしの距離", "stmts": [["イ", "可燃性ガスの製造設備と酸素の製造設備の間は、10 m 以上の距離をとる。"], ["ロ", "可燃性ガスの製造設備と酸素の製造設備の間は、5 m 以上の距離をとればよい。"], ["ハ", "可燃性ガスの製造設備どうしの間は、5 m 以上の距離をとる。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正。<\/li><li>ロ：誤。可燃性ガスと酸素の間は 10 m。<\/li><\/ul><p>根拠：<a href=\"https://www.klchem.co.jp/img/industry/pdf/gas_hoan_kisoku_H19-3-2.pdf\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル 一般則（PDF）<\/a><\/p>"}, {"n": 4, "topic": "貯槽どうしの距離", "stmts": [["イ", "可燃性ガスの貯槽どうしの距離は、両貯槽の直径の和以上でなければならない。"], ["ロ", "直径 6 m と 10 m の可燃性ガスの貯槽の間は、4 m 以上の距離をとる。"], ["ハ", "可燃性ガスの貯槽どうしは、1 m または両貯槽の直径の和の 4 分の 1 のいずれか大きいほう以上の距離をとる。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。<\/li><li>ロ：正。(6 + 10) × 1/4 = 4 m。これは 1 m より大きいので、4 m 以上。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.klchem.co.jp/img/industry/pdf/gas_hoan_kisoku_H19-3-2.pdf\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル 一般則（PDF）<\/a><\/p>"}, {"n": 5, "topic": "防液堤", "stmts": [["イ", "可燃性ガス・酸素の液化ガスの貯槽で、貯蔵能力が 1,000 t 以上のものには防液堤を設ける。"], ["ロ", "毒性ガスの液化ガスの貯槽は、貯蔵能力が 5 t 以上で防液堤の対象になる。"], ["ハ", "防液堤の代わりに、貯槽の底部を地盤面下にピット状に設ける方法などが認められる場合がある。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正。毒性ガスの基準がずっと小さい（5 t）のは、少量でも広がると人への被害が大きいからである。<\/li><\/ul><p>根拠：<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/files/20220328chikujo2_ippansoku.pdf\" target=\"_blank\" rel=\"noopener\">経済産業省 一般則の逐条解説<\/a><\/p>"}, {"n": 6, "topic": "検知と標識", "stmts": [["イ", "可燃性ガス・毒性ガスの製造施設には、ガス漏えい検知警報設備を設ける。"], ["ロ", "ガス漏えい検知警報設備は、酸素の製造施設にだけ設ければよい。"], ["ハ", "事業所には、境界線を明示し、外部から見やすいように警戒標を掲げる。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正。<\/li><li>ロ：誤。検知警報設備の対象は、可燃性ガスと毒性ガスである。<\/li><\/ul><p>根拠：<a href=\"https://klchem.co.jp/industry/siryo_8.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル 一般則抜粋<\/a>、<a href=\"https://klchem.co.jp/img/industry/pdf/gas_reiji.pdf\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル 例示基準 目次<\/a><\/p>"}, {"n": 7, "topic": "耐圧試験", "stmts": [["イ", "耐圧試験は、常用の圧力と同じ圧力で行えばよい。"], ["ロ", "液体を使うことが困難な場合は、常用の圧力の 1.25 倍以上の圧力で、空気などの気体を使って行うことができる。"], ["ハ", "高圧ガス設備の耐圧試験は、常用の圧力の 1.5 倍以上の圧力で、水その他の安全な液体を使って行うのが原則である。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。<\/li><li>ロ・ハ：正。液体を使うのは、液体はほとんど圧縮されず、試験中に破裂しても放出されるエネルギーが小さいからである。気体は圧縮されてエネルギーをためるので、試験の圧力を低くしている。<\/li><\/ul><p>根拠：<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/files/20220328chikujo2_ippansoku.pdf\" target=\"_blank\" rel=\"noopener\">経済産業省 一般則の逐条解説<\/a><\/p>"}, {"n": 8, "topic": "気密試験", "stmts": [["イ", "可燃性ガス・毒性ガス・酸素のガス設備は、気密な構造とする。"], ["ロ", "気密試験は、原則として可燃性ガスそのものを使って行う。"], ["ハ", "気密試験は、常用の圧力以上の圧力で行う。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正。<\/li><li>ロ：誤。気密試験は、原則として空気その他の危険性のない気体で行う。<\/li><\/ul><p>根拠：<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/files/20220328chikujo2_ippansoku.pdf\" target=\"_blank\" rel=\"noopener\">経済産業省 一般則の逐条解説<\/a>、<a href=\"https://www.khk.or.jp/Portals/0/resources/information/law/dl/kinouseikijun.pdf\" target=\"_blank\" rel=\"noopener\">KHK 例示基準<\/a><\/p>"}, {"n": 9, "topic": "性能規定と例示基準", "stmts": [["イ", "例示基準以外の方法は、性能を満たしていても一切認められない。"], ["ロ", "性能規定を満たす具体的な方法の一例は、例示基準に示されている。"], ["ハ", "一般則の技術上の基準は、2001 年の改正で、達成すべき性能を定める「性能規定」に改められた。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。例示基準は方法の一例で、それ以外の方法でも、性能を満たすことを示せれば使える。<\/li><li>ロ・ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://ja.wikipedia.org/wiki/%E4%B8%80%E8%88%AC%E9%AB%98%E5%9C%A7%E3%82%AC%E3%82%B9%E4%BF%9D%E5%AE%89%E8%A6%8F%E5%89%87\" target=\"_blank\" rel=\"noopener\">Wikipedia 一般高圧ガス保安規則<\/a>、<a href=\"https://www.khk.or.jp/Portals/0/resources/information/law/dl/kinouseikijun.pdf\" target=\"_blank\" rel=\"noopener\">KHK 例示基準<\/a><\/p>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "コンビナート等保安規則では、可燃性ガスの貯槽の防液堤の基準が 500 t 以上で、一般則の 1,000 t より厳しい。"], ["ロ", "距離の基準は、可燃性ガスと酸素の組合せのほうが、可燃性ガスどうしより大きい。"], ["ハ", "耐圧試験は気密試験より高い圧力で行う。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ：正（セット 15）。<\/li><li>ロ：正（10 m と 5 m）。<\/li><li>ハ：正（1.5 倍以上と、常用の圧力以上）。<\/li><\/ul><p>根拠：<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/files/20220328chikujo2_ippansoku.pdf\" target=\"_blank\" rel=\"noopener\">経済産業省 一般則の逐条解説<\/a><\/p>"}]}, {"id": "15", "topic": "製造の技術上の基準 II（コンビナート等保安規則）", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-15.md", "questions": [{"n": 1, "topic": "コンビ則の適用", "stmts": [["イ", "コンビナート等保安規則は、特定製造事業所に適用される。"], ["ロ", "コンビナート等保安規則は、すべての第一種製造者に適用される。"], ["ハ", "特定製造事業所には、コンビナート地域内の製造事業所が含まれる。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正。<\/li><li>ロ：誤。コンビ則が適用されるのは特定製造事業所に限られる。それ以外の第一種製造者には一般則などが適用される。<\/li><\/ul><p>根拠：<a href=\"https://klchem.co.jp/blog/2024/05/blog-13030.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル コンビ則の適用を受ける事業所<\/a>、<a href=\"https://www.pref.ibaraki.jp/seikatsukankyo/shobo/sangyo/info/sangyohoan/koatsugastebiki/documents/hpgtebiki-tokutei-00.pdf\" target=\"_blank\" rel=\"noopener\">茨城県 特定製造事業所用の手引<\/a><\/p>"}, {"n": 2, "topic": "製造事業所の定義", "stmts": [["イ", "コンビ則の「製造事業所」には、処理能力の基準はない。"], ["ロ", "処理能力の基準は、第一種製造者の許可の基準と同じ数字になっている。"], ["ハ", "コンビ則でいう「製造事業所」は、処理能力が 100 m³（不活性ガス・空気は 300 m³）以上の処理設備を持つ製造設備を使って高圧ガスを製造する事業所である。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。<\/li><li>ロ：正。100 m³（不活性ガス・空気は 300 m³）は、第一種製造者の許可の基準と同じ（セット 01）。<\/li><li>ハ：正（コンビ則第 2 条）。<\/li><\/ul><p>根拠：<a href=\"https://lawzilla.jp/law/361M50000400088?n=ln5.1&amp;amp;mode=only\" target=\"_blank\" rel=\"noopener\">Lawzilla コンビ則<\/a>、<a href=\"https://legaldoc.jp/elaws/elaws-view?fid=361M50000400088_20240615_506M60000400037&amp;amp;id=361M50000400088\" target=\"_blank\" rel=\"noopener\">legaldoc コンビ則 条文<\/a><\/p>"}, {"n": 3, "topic": "特定製造事業所から除かれるもの", "stmts": [["イ", "コンビナート地域内の製造事業所でも、不活性ガス・空気だけを製造するものは、特定製造事業所から除かれる。"], ["ロ", "コンビナート地域内にあれば、どのような製造事業所も必ず特定製造事業所になる。"], ["ハ", "コンビナート地域内の製造事業所でも、燃料専用で、一定量以上の可燃性ガスの貯槽を持たないものは除かれる。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正。除外の基準は、貯蔵能力 2,000 m³（20 t）以上の可燃性ガスの貯槽を設置していない、などと整理されている。<\/li><li>ロ：誤。<\/li><\/ul><p>根拠：<a href=\"https://klchem.co.jp/blog/2024/05/blog-13030.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル<\/a>、<a href=\"https://legaldoc.jp/elaws/elaws-view?fid=361M50000400088_20240615_506M60000400037&amp;amp;id=361M50000400088\" target=\"_blank\" rel=\"noopener\">legaldoc コンビ則 条文<\/a><\/p>"}, {"n": 4, "topic": "コンビナート地域外", "stmts": [["イ", "コンビナート地域外にある製造事業所は、特定製造事業所になることはない。"], ["ロ", "用途地域（工業専用地域・工業地域を除く）内にあって、保安用不活性ガス以外のガスの処理能力が 50 万 m³ 以上の製造事業所は、特定製造事業所に当たる。"], ["ハ", "コンビナート地域外の特定製造事業所の基準には、保安用不活性ガスの処理能力も含めて計算する。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 2, "explain": "<ul><li>イ：誤。<\/li><li>ロ：正。貯槽を設置して専ら充てんする場合は 100 万 m³ 以上。<\/li><li>ハ：誤。保安用不活性ガスは除いて計算する。<\/li><\/ul><p>根拠：<a href=\"https://klchem.co.jp/blog/2018/08/4613.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル コンビナート地域以外の特定製造事業所<\/a>、<a href=\"https://legaldoc.jp/elaws/elaws-view?fid=361M50000400088_20240615_506M60000400037&amp;amp;id=361M50000400088\" target=\"_blank\" rel=\"noopener\">legaldoc コンビ則 条文<\/a><\/p>"}, {"n": 5, "topic": "防液堤", "stmts": [["イ", "コンビ則のほうが一般則より、防液堤の対象となる貯蔵能力が大きい。"], ["ロ", "一般則では、可燃性ガスの液化ガスの貯槽の防液堤は、貯蔵能力 1,000 t 以上のものが対象である。"], ["ハ", "コンビ則では、可燃性ガスの液化ガスの貯槽の防液堤は、貯蔵能力 500 t 以上のものが対象である。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。コンビ則のほうが小さい貯槽から対象にしていて、そのぶん厳しい。<\/li><li>ロ・ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/files/20220328chikujo2_ippansoku.pdf\" target=\"_blank\" rel=\"noopener\">経済産業省 一般則の逐条解説<\/a><\/p>"}, {"n": 6, "topic": "境界線までの距離", "stmts": [["イ", "コンビ則では、可燃性ガス・毒性ガスの製造設備について、製造施設の外面から特定製造事業所の境界線まで 20 m 以上の距離をとる基準がある。"], ["ロ", "コンビ則には、境界線までの距離の基準はない。"], ["ハ", "境界線までの距離は、隣の事業所へ事故が広がるのを防ぐためのものである。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正。<\/li><li>ロ：誤。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.chiba.lg.jp/hoan/tetsuzuki/shigoto-sangyou/shoukougyou/documents/hpg-1-b1.pdf\" target=\"_blank\" rel=\"noopener\">千葉県 技術上の基準の様式<\/a>、<a href=\"https://legaldoc.jp/elaws/elaws-view?fid=361M50000400088_20240615_506M60000400037&amp;amp;id=361M50000400088\" target=\"_blank\" rel=\"noopener\">legaldoc コンビ則 条文<\/a><\/p>"}, {"n": 7, "topic": "導管", "stmts": [["イ", "コンビ則には、導管に関する基準はない。"], ["ロ", "コンビ則では、相隣接する緊急遮断装置の区間ごとに措置を講じることが定められている。"], ["ハ", "コンビ則では、導管の設置について、周囲の状況に応じて十分な保安距離をとるべきこととされている。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。<\/li><li>ロ：正（コンビ則第 45 条）。<\/li><li>ハ：正（コンビ則第 34 条など）。<\/li><\/ul><p>根拠：<a href=\"https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/080/touh/t080002.htm\" target=\"_blank\" rel=\"noopener\">参議院 質問主意書への答弁<\/a><\/p>"}, {"n": 8, "topic": "保安用不活性ガス", "stmts": [["イ", "特定製造事業所の検査項目には、保安用不活性ガス等に関するものがある。"], ["ロ", "保安用不活性ガスは、緊急時に設備の中の可燃性ガスを置き換えるなど、保安のために使われる。"], ["ハ", "保安用不活性ガスは、特定製造事業所の判定で処理能力に含めて計算する。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。<\/li><li>ロ：正。<\/li><li>ハ：誤（問 4 のハ）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.chiba.lg.jp/hoan/tetsuzuki/shigoto-sangyou/shoukougyou/documents/hpg-4-y4-1-2.pdf\" target=\"_blank\" rel=\"noopener\">千葉県 検査項目<\/a>、<a href=\"https://klchem.co.jp/blog/2018/08/4613.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル<\/a><\/p>"}, {"n": 9, "topic": "運用の改正", "stmts": [["イ", "コンビナート等保安規則の機能性基準の運用の通達は、改正されることがある。"], ["ロ", "コンビ則は制定以来一度も改正されていない。"], ["ハ", "経済産業省は、令和 7 年 11 月にコンビ則関係の運用の通達を改正した。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正。<\/li><li>ロ：誤。<\/li><\/ul><p>根拠：<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/files/koatsu_tsutatsu_251111.pdf\" target=\"_blank\" rel=\"noopener\">経済産業省 運用通達の改正（令和 7 年 11 月 11 日）<\/a><\/p>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "特定製造事業所かどうかは、事業所の場所と、製造するガスの種類・処理能力で決まる。"], ["ロ", "コンビ則は、工場が集まる地域で事故が連鎖することを防ぐため、一般則より厳しい基準を定めている。"], ["ハ", "過去問では、問題文で仮定された事業所が特定製造事業所に当たるかどうかを、最初に確かめる必要がある。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正。<\/li><\/ul><p>根拠：<a href=\"https://chemical-engineering-review.com/security-regulation-for-petrochemical-complex/\" target=\"_blank\" rel=\"noopener\">化学工学レビュワー コンビ則の出題内容<\/a><\/p>"}]}, {"id": "16", "topic": "総合模試", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-16.md", "questions": [{"n": 1, "topic": "定義", "stmts": [["イ", "温度 35 ℃において圧力が 1 MPa 以上となる圧縮ガス（圧縮アセチレンガスを除く）は、高圧ガスである。"], ["ロ", "常用の温度において圧力が 0.2 MPa 以上となる液化ガスで、現にその圧力が 0.2 MPa 以上であるものは、高圧ガスである。"], ["ハ", "圧縮アセチレンガスの温度の基準は 35 ℃である。"]], "choices": ["イ", "ロ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ロ：正（第 2 条）。<\/li><li>ハ：誤。圧縮アセチレンの温度の基準は 15 ℃（基準圧は 0.2 MPa）。<\/li><\/ul><p>詳しくはセット 01・02。根拠：<a href=\"https://ja.wikibooks.org/wiki/%E9%AB%98%E5%9C%A7%E3%82%AC%E3%82%B9%E4%BF%9D%E5%AE%89%E6%B3%95%E7%AC%AC2%E6%9D%A1\" target=\"_blank\" rel=\"noopener\">Wikibooks 第 2 条<\/a><\/p>"}, {"n": 2, "topic": "適用除外", "stmts": [["イ", "高圧ボイラーとその導管内における高圧蒸気には、高圧ガス保安法は適用されない。"], ["ロ", "内容積 1 デシリットル以下の容器に入った高圧ガスには、高圧ガス保安法のすべての規定が適用されない。"], ["ハ", "原子炉とその附属施設内における高圧ガスには、高圧ガス保安法は適用されない。"]], "choices": ["イ", "ハ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。外れるのは、容器・帳簿・事故届などの一部の規定だけである。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://lawzilla.jp/law/326AC0000000204?n=ln3&amp;amp;mode=only\" target=\"_blank\" rel=\"noopener\">Lawzilla 第 3 条<\/a>、<a href=\"https://www.meti.go.jp/shingikai/sankoshin/hoan_shohi/koatsu_gas/pdf/008_02_00.pdf\" target=\"_blank\" rel=\"noopener\">経済産業省 資料<\/a>、<a href=\"https://www2.nra.go.jp/data/000464966.pdf\" target=\"_blank\" rel=\"noopener\">原子力規制庁 資料<\/a><\/p>"}, {"n": 3, "topic": "製造の許可・届出", "stmts": [["イ", "1 日の処理容積が 100 m³ 以上（不活性ガス・空気を除く）の設備で高圧ガスを製造しようとする者は、都道府県知事の許可を受けなければならない。"], ["ロ", "第二種製造者は、製造開始の日の 20 日前までに、都道府県知事に届け出なければならない。"], ["ハ", "第一種製造者の許可を取り消された者は、取消しの日から 1 年を経過すれば、再び許可を受けることができる。"]], "choices": ["イ、ロ", "イ、ハ", "ロ、ハ", "イ", "イ、ロ、ハ"], "answer": 1, "explain": "<ul><li>イ・ロ：正（第 5 条）。<\/li><li>ハ：誤。欠格の期間は 2 年（第 7 条）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/2seizou-seizoujigyou.html\" target=\"_blank\" rel=\"noopener\">宮城県 第二種製造事業届<\/a>、<a href=\"https://www.pref.aomori.lg.jp/kensei/jyourei/shinsakijyun/gyote_shinsakijyun_1497.html\" target=\"_blank\" rel=\"noopener\">青森県 審査基準<\/a><\/p>"}, {"n": 4, "topic": "承継", "stmts": [["イ", "第一種製造者から製造施設を譲り受けた者は、届出をするだけで第一種製造者の地位を承継する。"], ["ロ", "第二種製造者の事業の全部を譲り受けた者は、第二種製造者の地位を承継する。"], ["ハ", "相続により第一種製造者の地位を承継した者は、遅滞なく、都道府県知事に届け出なければならない。"]], "choices": ["ロ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。第一種製造者の承継は相続・合併・分割に限られ、譲渡では新たな許可が必要になる。<\/li><li>ロ・ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-shoukei.html\" target=\"_blank\" rel=\"noopener\">宮城県 承継届<\/a>、<a href=\"https://www.city.hamamatsu.shizuoka.jp/hfdyobo/20231004dainisyuseizoujigyousyoukei-ipankouatugasu.html\" target=\"_blank\" rel=\"noopener\">浜松市 第二種製造事業承継届<\/a><\/p>"}, {"n": 5, "topic": "変更", "stmts": [["イ", "第一種製造者が軽微な変更の工事をしたときは、その完成後遅滞なく都道府県知事に届け出なければならない。"], ["ロ", "軽微な変更の工事は、事前に変更の許可を受けなければならない。"], ["ハ", "軽微な変更の工事をしたのに届け出なかった場合は、罰金の対象となる。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（第 14 条第 2 項）。<\/li><li>ロ：誤。<\/li><li>ハ：正（第 83 条）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.gunma.jp/site/shinsei/12540.html\" target=\"_blank\" rel=\"noopener\">群馬県 軽微変更届<\/a>、<a href=\"https://www.kankyo.metro.tokyo.lg.jp/documents/d/kankyo/about-notification-files-safetygas_notice_procedure\" target=\"_blank\" rel=\"noopener\">東京都 届出の注意<\/a><\/p>"}, {"n": 6, "topic": "完成検査", "stmts": [["イ", "高圧ガス保安協会が行う完成検査を受け、技術上の基準に適合していると認められ、その旨を都道府県知事に届け出た場合は、知事の完成検査を受けなくてよい。"], ["ロ", "完成検査は、施設の使用を始めてから 1 年以内に受ければよい。"], ["ハ", "第二種貯蔵所にも、第一種貯蔵所と同じく完成検査が義務づけられている。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正（第 20 条第 1 項ただし書）。<\/li><li>ロ：誤。使用を始める前に受ける。<\/li><li>ハ：誤。完成検査は許可制の第一種貯蔵所に課される。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-kankenjyuken.html\" target=\"_blank\" rel=\"noopener\">宮城県 完成検査受検届<\/a><\/p>"}, {"n": 7, "topic": "貯蔵", "stmts": [["イ", "貯蔵所の区分を判断するとき、液化ガスは質量 10 kg をもって容積 1 m³ とみなす。"], ["ロ", "充てん容器等は、常に温度 40 ℃以下に保たなければならない。"], ["ハ", "容器置場の周囲 2 m 以内では、火気の使用が制限される。"]], "choices": ["イ", "イ、ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正（法第 16 条第 3 項、一般則第 18 条）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.ibaraki.jp/seikatsukankyo/shobo/sangyo/info/sangyohoan/koatsugastyozo/documents/tebiki-tyozou.pdf\" target=\"_blank\" rel=\"noopener\">茨城県 貯蔵の手引き<\/a>、<a href=\"https://klchem.co.jp/industry/siryo_8.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル 一般則抜粋<\/a><\/p>"}, {"n": 8, "topic": "販売", "stmts": [["イ", "高圧ガスの販売の事業を営もうとする者は、販売所ごとに、事業開始の日の 20 日前までに都道府県知事に届け出なければならない。"], ["ロ", "販売主任者は、事業者ごとに 1 人選任すれば、すべての販売所を受け持てる。"], ["ハ", "周知は、災害の発生の防止に必要な事項を記載した書面を配布して行う。"]], "choices": ["イ", "ハ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正（第 20 条の 4）。<\/li><li>ロ：誤。販売主任者は販売所ごとに選任する。<\/li><li>ハ：正（第 20 条の 5）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.yamaguchi.lg.jp/soshiki/7/14231.html\" target=\"_blank\" rel=\"noopener\">山口県 販売の手続き<\/a>、<a href=\"https://www.city.sakai.lg.jp/kurashi/bosai/shobo/shinsei/kouatsu/kouatsukisoku/20hanbai.html\" target=\"_blank\" rel=\"noopener\">堺市 高圧ガスの販売<\/a><\/p>"}, {"n": 9, "topic": "移動", "stmts": [["イ", "充てん容器等を車両に積載して移動するときは、原則として、その車両の見やすい箇所に警戒標を掲げる。"], ["ロ", "可燃性ガスの充てん容器と酸素の充てん容器を同一の車両に積載するときは、バルブが互いに向き合わないようにする。"], ["ハ", "災害の発生の防止のための注意事項を記載した書面は、事業所に保管しておけばよく、運転者に携帯させる必要はない。"]], "choices": ["イ", "ロ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ロ：正（一般則第 50 条など）。<\/li><li>ハ：誤。書面は運転者に交付し、移動中携帯させる。<\/li><\/ul><p>根拠：<a href=\"https://www.kankyo.metro.tokyo.lg.jp/documents/d/kankyo/gas-300400a20180814141108681-files-idoukijyunn\" target=\"_blank\" rel=\"noopener\">東京都 移動基準<\/a>、<a href=\"https://www.pref.mie.lg.jp/common/content/001220632.pdf\" target=\"_blank\" rel=\"noopener\">三重県 輸送防災講習会資料<\/a><\/p>"}, {"n": 10, "topic": "消費と廃棄", "stmts": [["イ", "特定高圧ガスを消費する者は、事業所ごとに、消費開始の日の 20 日前までに都道府県知事に届け出なければならない。"], ["ロ", "特定高圧ガスを消費する者は、都道府県知事の許可を受けなければならない。"], ["ハ", "高圧ガスの廃棄は、容器とともに行ってはならない。"]], "choices": ["イ、ハ", "イ", "ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正（第 24 条の 2）。<\/li><li>ロ：誤。届出制である。<\/li><li>ハ：正（一般則第 62 条など）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.mie.lg.jp/SHOBO/HP/HPG_consumer.htm\" target=\"_blank\" rel=\"noopener\">三重県 消費にかかる規制<\/a>、<a href=\"https://www.meti.go.jp/shingikai/sankoshin/hoan_shohi/koatsu_gas/pdf/029_02_00.pdf\" target=\"_blank\" rel=\"noopener\">経済産業省 注意喚起<\/a><\/p>"}, {"n": 11, "topic": "容器 I", "stmts": [["イ", "容器検査に合格し、刻印または標章の掲示がされている容器でなければ、譲渡し、または引き渡してはならない。"], ["ロ", "アセチレンガスの容器の塗色は、ねずみ色である。"], ["ハ", "溶接容器の容器再検査の期間は、製造後の経過年数が 20 年以上のものは 2 年である。"]], "choices": ["イ", "ハ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正（第 44 条）。<\/li><li>ロ：誤。アセチレンの容器はかっ色。<\/li><li>ハ：正（容器保安規則第 24 条）。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201804-08.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 9 回<\/a>、<a href=\"https://klchem.co.jp/industry/siryo_2.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル 塗色<\/a>、<a href=\"http://www.echoland-plus.com/gashou/youki/youki-24.html\" target=\"_blank\" rel=\"noopener\">echoland-plus 容器保安規則第 24 条<\/a><\/p>"}, {"n": 12, "topic": "容器 II", "stmts": [["イ", "容器再検査の期間を過ぎた容器には、容器再検査に合格し、所定の刻印等がされるまで、高圧ガスを充てんしてはならない。"], ["ロ", "くず化その他容器として使用できないように処分すべきことの命令は、容器の所有者に対して出される。"], ["ハ", "液化酸素の容器の塗色は、圧縮の酸素と同じ黒色である。"]], "choices": ["イ", "ハ", "ロ、ハ", "イ、ロ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正。<\/li><li>ロ：正（第 56 条）。<\/li><li>ハ：誤。液化酸素の容器はねずみ色。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201804-08.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 9 回<\/a>、<a href=\"https://www.pref.saga.lg.jp/kiji0039977/3_9977_199472_up_40gskqkt.pdf\" target=\"_blank\" rel=\"noopener\">佐賀県 処分基準<\/a>、<a href=\"https://www.tps.sci.waseda.ac.jp/safety-gas/\" target=\"_blank\" rel=\"noopener\">早稲田大学 高圧ガスの基礎知識<\/a><\/p>"}, {"n": 13, "topic": "保安管理体制", "stmts": [["イ", "保安統括者は、その事業所で事業の実施を統括管理する者をもって充て、製造保安責任者免状は要らない。"], ["ロ", "保安技術管理者は、乙種機械責任者免状を持つ者からも選任できる。"], ["ハ", "保安係員は、製造のための施設の区分ごとに選任する。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。保安技術管理者は、甲種化学・甲種機械の免状を持つ者から選任する。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.aichi.jp/site/koatsugas/seizou-hoankanri.html\" target=\"_blank\" rel=\"noopener\">愛知県 保安統括者等<\/a>、<a href=\"https://www.pref.gunma.jp/site/shinsei/12547.html\" target=\"_blank\" rel=\"noopener\">群馬県 保安技術管理者等届<\/a><\/p>"}, {"n": 14, "topic": "講習と届出", "stmts": [["イ", "保安係員には、製造保安責任者免状の交付を受けた日の属する年度の翌年度の開始の日から 3 年以内に、第 1 回の講習を受けさせる。"], ["ロ", "保安係員の第 2 回の講習は、第 1 回の講習を受けた日の属する年度の翌年度の開始の日から 5 年以内に受けさせる。"], ["ハ", "保安統括者の選任・解任の届出は、年に 1 回まとめて行えばよい。"]], "choices": ["イ、ロ", "イ、ハ", "ロ、ハ", "ロ", "イ、ロ、ハ"], "answer": 1, "explain": "<ul><li>イ・ロ：正（第 27 条の 2 第 7 項）。<\/li><li>ハ：誤。保安統括者は、選任・解任のつど遅滞なく届け出る。年 1 回まとめるのは、保安技術管理者・保安係員などである。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/qualification/examination_course/course_duty/system.html\" target=\"_blank\" rel=\"noopener\">KHK 法定義務講習<\/a>、<a href=\"https://www.khk.or.jp/administration/high_pressure_gas/procedure01.html\" target=\"_blank\" rel=\"noopener\">KHK 製造の申請手続き<\/a><\/p>"}, {"n": 15, "topic": "危害予防規程・保安教育", "stmts": [["イ", "第一種製造者は、危害予防規程を定めて都道府県知事に届け出なければならず、変更したときも届け出る。"], ["ロ", "第一種製造者は、保安教育計画を都道府県知事に届け出なければならない。"], ["ハ", "第二種製造者は、その従業者に保安教育を施さなければならない。"]], "choices": ["イ", "ハ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正（第 26 条）。<\/li><li>ロ：誤。保安教育計画の届出は、平成 12 年の改正で廃止された。<\/li><li>ハ：正（第 27 条第 4 項）。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201711-14.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 4 回<\/a>、<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-kitei.html\" target=\"_blank\" rel=\"noopener\">宮城県 危害予防規程届<\/a><\/p>"}, {"n": 16, "topic": "保安検査・定期自主検査", "stmts": [["イ", "保安検査は、原則として、前回の保安検査の日から 1 年を超えない日までに受ける。"], ["ロ", "定期自主検査は 1 年（大臣が定める設備は大臣の定める期間）に 1 回以上行い、検査記録を作成し保存する。"], ["ハ", "特定高圧ガス消費者には、定期自主検査の義務はない。"]], "choices": ["イ", "ロ", "ハ", "イ、ロ", "ロ、ハ"], "answer": 4, "explain": "<ul><li>イ・ロ：正（第 35 条・第 35 条の 2、一般則第 83 条）。<\/li><li>ハ：誤。特定高圧ガス消費者も定期自主検査の対象である。<\/li><\/ul><p>根拠：<a href=\"https://www.city.nagoya.jp/bousai/shoubou/1013208/1011202/1011266/1033942/1011279.html\" target=\"_blank\" rel=\"noopener\">名古屋市 保安検査<\/a>、<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201806-10.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 11 回<\/a><\/p>"}, {"n": 17, "topic": "認定制度", "stmts": [["イ", "令和 5 年 12 月 21 日に施行された改正で、認定完成検査実施者と認定保安検査実施者の認定制度は廃止された。"], ["ロ", "認定高度保安実施者は、経済産業大臣が認定する。"], ["ハ", "改正前に旧制度の認定を受けていた事業者は、施行日にただちに認定の効力を失った。"]], "choices": ["イ", "イ、ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 2, "explain": "<ul><li>イ・ロ：正。<\/li><li>ハ：誤。有効期間までは効力が続く。<\/li><\/ul><p>根拠：<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/sinnintei/index.html\" target=\"_blank\" rel=\"noopener\">経済産業省 認定高度保安実施者制度<\/a><\/p>"}, {"n": 18, "topic": "危険時の措置・事故届", "stmts": [["イ", "危険な状態を発見した者は、直ちに、都道府県知事、警察官、消防吏員、消防団員または海上保安官に届け出なければならない。"], ["ロ", "高圧ガスや容器を盗まれたときは、遅滞なく、都道府県知事または警察官に届け出なければならない。"], ["ハ", "事故届は、災害の発生から 30 日以内に経済産業大臣に届け出る。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（第 36 条第 2 項）。<\/li><li>ロ：正（第 63 条第 1 項）。<\/li><li>ハ：誤。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201809-08.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 14 回<\/a>、<a href=\"https://www.pref.mie.lg.jp/SHOBO/HP/HPG_accident.htm\" target=\"_blank\" rel=\"noopener\">三重県 高圧ガスの事故<\/a><\/p>"}, {"n": 19, "topic": "帳簿", "stmts": [["イ", "第一種製造者は、製造施設に異常があった場合、その年月日とそれに対してとった措置を帳簿に記載し、記載の日から 10 年間保存する。"], ["ロ", "販売業者は、販売所ごとに帳簿を備え、記載の日から 2 年間保存する。"], ["ハ", "第一種貯蔵所・第二種貯蔵所に異常があった場合の記録は、記載の日から 2 年間保存すればよい。"]], "choices": ["イ、ロ", "ロ、ハ", "イ", "ハ", "イ、ロ、ハ"], "answer": 1, "explain": "<ul><li>イ・ロ：正（一般則第 95 条）。<\/li><li>ハ：誤。貯蔵所の異常の記録も 10 年。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201810-08_R.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 15 回<\/a>、<a href=\"https://lawzilla.jp/law/341M50000400053?n=ln95&amp;amp;mode=only\" target=\"_blank\" rel=\"noopener\">Lawzilla 一般則第 95 条<\/a><\/p>"}, {"n": 20, "topic": "技術上の基準", "stmts": [["イ", "可燃性ガスの製造設備と酸素の製造設備の間は、10 m 以上の距離をとる。"], ["ロ", "高圧ガス設備の耐圧試験は、常用の圧力の 1.5 倍以上の圧力で、水その他の安全な液体を使って行うのが原則である。"], ["ハ", "コンビナート等保安規則では、可燃性ガスの液化ガスの貯槽で、貯蔵能力 500 t 以上のものに防液堤を設ける。"]], "choices": ["イ", "ロ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正（一般則第 6 条、コンビ則）。<\/li><\/ul><p>根拠：<a href=\"https://www.klchem.co.jp/img/industry/pdf/gas_hoan_kisoku_H19-3-2.pdf\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル 一般則（PDF）<\/a>、<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/files/20220328chikujo2_ippansoku.pdf\" target=\"_blank\" rel=\"noopener\">経済産業省 一般則の逐条解説<\/a><\/p>"}]}];
const KEY = 'koki-quiz-v1';
const KANA_DONE = '○';

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save(r) { try { localStorage.setItem(KEY, JSON.stringify(r)); } catch (e) {} }
let record = load();

const all = SETS.flatMap(s => s.questions.map(q => ({ ...q, set: s.id, setTopic: s.topic, setUrl: s.url, id: s.id + '-' + q.n })));
const byId = Object.fromEntries(all.map(q => [q.id, q]));

let state = null;   // { key, label, order: [ids], idx, picked: {id: n}, done: bool }

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function missedIds() { return all.filter(q => record[q.id] && record[q.id].ok === false).map(q => q.id); }

function start(key) {
  let order, label;
  if (key === 'missed') { order = shuffle(missedIds()); label = 'まちがえた問題'; }
  else if (key === 'mix') { order = shuffle(all.map(q => q.id)).slice(0, 10); label = '全セットから 10 問'; }
  else { const s = SETS.find(x => x.id === key); order = s.questions.map(q => s.id + '-' + q.n); label = 'セット ' + s.id + '　' + s.topic; }
  state = { key, label, order, idx: 0, picked: {}, done: false };
  try { sessionStorage.setItem(KEY + '-set', key); } catch (e) {}
  render();
}

function setScore(s) {
  const ids = s.questions.map(q => s.id + '-' + q.n);
  const tried = ids.filter(id => record[id]);
  return tried.length ? tried.filter(id => record[id].ok).length + '/' + ids.length : '';
}

function renderSets() {
  const nav = document.getElementById('sets');
  nav.innerHTML = '';
  const add = (key, no, text, sc, disabled) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.id = 'chip-' + key;
    b.setAttribute('aria-pressed', state && state.key === key ? 'true' : 'false');
    b.disabled = !!disabled;
    b.innerHTML = (no ? '<span class="no">' + no + '</span>' : '') + '<span>' + text + '</span>' + (sc ? '<span class="sc">' + sc + '</span>' : '');
    b.addEventListener('click', () => start(key));
    nav.appendChild(b);
  };
  SETS.forEach(s => add(s.id, s.id, s.topic, setScore(s)));
  add('mix', '', '全セットから 10 問', '');
  const m = missedIds().length;
  add('missed', '', 'まちがえた問題', m ? m + ' 問' : '', m === 0);
}

function renderBar() {
  const total = state.order.length;
  const answered = Object.keys(state.picked).length;
  document.getElementById('mode').textContent = state.label;
  document.getElementById('count').textContent = state.done ? '結果' : (Math.min(state.idx + 1, total) + ' / ' + total);
  document.getElementById('meter').style.width = (total ? answered / total * 100 : 0) + '%';
}

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

function renderQuestion() {
  const id = state.order[state.idx];
  const q = byId[id];
  const picked = state.picked[id];
  const card = el('section', 'card');
  card.setAttribute('aria-labelledby', 'qno');

  const head = el('div', 'qhead');
  head.appendChild(el('span', 'qno', '問 ' + q.n)).id = 'qno';
  head.appendChild(el('span', 'qtopic', q.topic));
  head.appendChild(el('a', 'qsrc', 'セット ' + q.set)).setAttribute('href', q.setUrl);
  head.lastChild.target = '_blank'; head.lastChild.rel = 'noopener';
  card.appendChild(head);

  card.appendChild(el('p', 'ask', '次のイ、ロ、ハの記述のうち、正しいものはどれか。'));
  const ul = el('ul', 'stmts');
  q.stmts.forEach(([k, t]) => { const li = el('li'); li.appendChild(el('span', 'kana', k)); li.appendChild(el('span', 'txt', t)); ul.appendChild(li); });
  card.appendChild(ul);

  const ch = el('div', 'choices');
  ch.setAttribute('role', 'group'); ch.setAttribute('aria-label', '選択肢');
  q.choices.forEach((c, i) => {
    const n = i + 1;
    const b = el('button', 'opt', '<span class="n">(' + n + ')</span><span class="c">' + c + '</span>');
    b.type = 'button'; b.id = 'opt-' + n;
    if (picked) {
      b.disabled = true;
      if (n === q.answer) b.classList.add('right');
      else if (n === picked) b.classList.add('wrong');
      else b.classList.add('dim');
    } else {
      b.addEventListener('click', () => answer(id, n));
    }
    ch.appendChild(b);
  });
  card.appendChild(ch);

  if (picked) {
    const ok = picked === q.answer;
    const v = el('div', 'verdict ' + (ok ? 'ok' : 'ng'), '<span class="mark" aria-hidden="true">' + (ok ? KANA_DONE : '×') + '</span>' + (ok ? '正解' : '不正解　正解は (' + q.answer + ') ' + q.choices[q.answer - 1]));
    v.setAttribute('role', 'status');
    card.appendChild(v);
    card.appendChild(el('div', 'explain', q.explain));
    const act = el('div', 'actions');
    const last = state.idx === state.order.length - 1;
    const nx = el('button', 'btn', last ? '結果を見る' : '次の問題');
    nx.type = 'button'; nx.id = 'next';
    nx.addEventListener('click', () => { if (last) state.done = true; else state.idx++; render(); nx.blur(); });
    act.appendChild(nx);
    card.appendChild(act);
  }
  return card;
}

function renderResult() {
  const ids = state.order;
  const right = ids.filter(id => state.picked[id] === byId[id].answer).length;
  const card = el('section', 'card result');
  card.appendChild(el('div', 'score', right + '<small> / ' + ids.length + ' 問</small>'));
  const rate = ids.length ? right / ids.length : 0;
  card.appendChild(el('p', 'pass', '正答率 ' + Math.round(rate * 100) + '%'));
  const miss = ids.filter(id => state.picked[id] !== byId[id].answer);
  if (miss.length) {
    const ul = el('ul', 'missed');
    miss.forEach(id => { const q = byId[id]; ul.appendChild(el('li', '', '<span class="k">セット' + q.set + ' 問' + q.n + '</span>' + q.topic + '　正解 (' + q.answer + ') ' + q.choices[q.answer - 1])); });
    card.appendChild(ul);
  }
  const act = el('div', 'actions');
  act.style.justifyContent = 'center';
  const again = el('button', 'btn ghost', 'もう一度');
  again.type = 'button'; again.addEventListener('click', () => start(state.key));
  act.appendChild(again);
  if (missedIds().length) {
    const mb = el('button', 'btn', 'まちがえた問題を解く');
    mb.type = 'button'; mb.addEventListener('click', () => start('missed'));
    act.appendChild(mb);
  }
  card.appendChild(act);
  return card;
}

function answer(id, n) {
  state.picked[id] = n;
  record[id] = { ok: n === byId[id].answer, at: Date.now() };
  save(record);
  render();
}

function render() {
  renderSets();
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  if (!state.order.length) {
    stage.appendChild(el('section', 'card', '<p class="ask">まちがえた問題はありません。セットを選んで解いてください。</p>'));
  } else {
    stage.appendChild(state.done ? renderResult() : renderQuestion());
  }
  renderBar();
}

document.getElementById('reset').addEventListener('click', () => {
  record = {}; save(record);
  document.getElementById('resetMsg').textContent = '成績を消しました';
  render();
});

let first = SETS.length ? SETS[SETS.length - 1].id : null;
try { const k = sessionStorage.getItem(KEY + '-set'); if (k && (k === 'mix' || SETS.some(s => s.id === k))) first = k; } catch (e) {}
if (first) start(first);
</script>
