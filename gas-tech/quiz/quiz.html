@media (max-width: 520px) { .choices { grid-template-columns: 1fr 1fr; } .choices .opt:last-child { grid-column: 1 / -1; } }

.missed li { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; }

<script>
const SETS = [{"id": "01", "topic": "総論", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-01.md", "questions": [{"n": 1, "topic": "法の目的", "stmts": [["イ", "この法律は、高圧ガスによる災害を防止するため、高圧ガスの製造、貯蔵、販売などを規制することを定めている。"], ["ロ", "この法律は、民間事業者と高圧ガス保安協会による、高圧ガスの保安に関する自主的な活動を促進することも定めている。"], ["ハ", "この法律の目的は、高圧ガス事業の健全な発達を図ることだけであり、公共の安全の確保は目的に含まれていない。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ロ：正。第 1 条の目的は「規制」と「自主的な活動の促進」の 2 本立て（<a href=\"https://www.toyama-kak.jp/toyama-kak.jp/wp-content/uploads/2025/03/06_%E9%AB%98%E5%9C%A7%E3%82%AC%E3%82%B9%E4%BF%9D%E5%AE%89%E6%B3%95%E3%81%AE%E6%A6%82%E8%A6%81.pdf\" target=\"_blank\" rel=\"noopener\">富山県 概要<\/a>、<a href=\"https://www.bousai.go.jp/jishin/nankai/taio_wg/pdf/h290324sanko02.pdf\" target=\"_blank\" rel=\"noopener\">内閣府資料<\/a>）。<\/li><li>ハ：誤。「事業の健全な発達」はガス事業法の目的の言い回しで、高圧ガス保安法の目的は「公共の安全の確保」。2 つの法律の目的を入れ替えた選択肢に注意する。<\/li><\/ul>"}, {"n": 2, "topic": "圧縮ガスの定義", "stmts": [["イ", "常用の温度において圧力が 1 MPa 以上となる圧縮ガスで、現にその圧力が 1 MPa 以上であるものは、高圧ガスである。"], ["ロ", "温度 35 ℃において圧力が 1 MPa 未満である圧縮ガス（圧縮アセチレンガスを除く）は、高圧ガスではない。"], ["ハ", "「常用の温度」とは常温（おおむね 20 ℃）のことである。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正（第 2 条第 1 号の前段）。<\/li><li>ロ：誤。35 ℃で 1 MPa 未満でも、常用の温度で 1 MPa 以上になり、現に 1 MPa 以上であれば高圧ガスである。第 1 号は「A <strong>又は<\/strong> B」の構造で、どちらか一方を満たせば高圧ガスになる。<\/li><li>ハ：誤。「常用の温度」は常温ではなく、そのガスを取り扱う過程で通常なり得る最高の温度を指す。<\/li><\/ul><p>根拠：<a href=\"https://chemical-engineering-review.com/high-pressure-gas-safety-act-2/\" target=\"_blank\" rel=\"noopener\">化学工学レビュワー<\/a>、<a href=\"https://note.com/303geos/n/n5fbbb85d7a38\" target=\"_blank\" rel=\"noopener\">303geos（note）<\/a>、<a href=\"https://kako-mon.com/re-3/preparation/purpose-and-definitions/\" target=\"_blank\" rel=\"noopener\">kako-mon.com「目的と定義」<\/a>、<a href=\"https://chemhobby.com/chemistry/chemicalengineering/high_pressure_gas/\" target=\"_blank\" rel=\"noopener\">chemhobby 定義フローチャート<\/a><\/p>"}, {"n": 3, "topic": "圧縮アセチレンガス・液化ガスの定義", "stmts": [["イ", "温度 15 ℃において圧力が 0.2 MPa 以上となる圧縮アセチレンガスは、高圧ガスである。"], ["ロ", "圧力が 0.2 MPa となる場合の温度が 35 ℃を超える液化ガスは、常用の温度において圧力が 0.2 MPa 以上で、現にその圧力が 0.2 MPa 以上であっても、高圧ガスではない。"], ["ハ", "温度 35 ℃において圧力が 0 Pa を超える液化ガスのうち、液化シアン化水素、液化ブロムメチルなど政令で定めるものは、高圧ガスである。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（第 2 条第 2 号）。アセチレンは分解爆発を起こしやすいので、圧縮ガスより低い 0.2 MPa・15 ℃が基準になっている。<\/li><li>ロ：誤。第 3 号も「常用の温度で 0.2 MPa 以上かつ現に 0.2 MPa 以上」<strong>又は<\/strong>「0.2 MPa になる温度が 35 ℃以下」の構造。前段を満たせば高圧ガスである。<\/li><li>ハ：正（第 2 条第 4 号）。毒性などが特に強いものは、圧力が低くても対象にしている。<\/li><\/ul><p>根拠：<a href=\"https://ja.wikibooks.org/wiki/%E9%AB%98%E5%9C%A7%E3%82%AC%E3%82%B9%E4%BF%9D%E5%AE%89%E6%B3%95%E7%AC%AC2%E6%9D%A1\" target=\"_blank\" rel=\"noopener\">Wikibooks 高圧ガス保安法第 2 条<\/a>、<a href=\"https://www.mlsrc.saitama-u.ac.jp/anzen/doc/hoankosyu_2025.pdf\" target=\"_blank\" rel=\"noopener\">埼玉大学 保安講習資料<\/a><\/p>"}, {"n": 4, "topic": "製造の許可・届出", "stmts": [["イ", "1 日の処理容積が 100 m³ 以上（不活性ガス・空気を除く）の設備で高圧ガスを製造しようとする者は、都道府県知事に届け出れば足りる。"], ["ロ", "不活性ガスだけを製造する場合、1 日の処理容積が 300 m³ 未満の設備であれば、第二種製造者として届出の対象となる。"], ["ハ", "第二種製造者は、製造を始めた後、遅滞なく都道府県知事に届け出ればよい。"]], "choices": ["イ", "ロ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 2, "explain": "<ul><li>イ：誤。100 m³/日以上は<strong>許可<\/strong>（第 5 条第 1 項、第一種製造者）。<\/li><li>ロ：正。不活性ガス・空気は危険が小さいので、境目が 300 m³ に緩められている。<\/li><li>ハ：誤。第二種製造者は、製造を始める日の <strong>20 日前まで<\/strong>に届け出る（第 5 条第 2 項）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/2seizou-seizoujigyou.html\" target=\"_blank\" rel=\"noopener\">宮城県 第二種製造者 製造事業届<\/a>、<a href=\"https://www.bousai.go.jp/jishin/nankai/taio_wg/pdf/h290324sanko02.pdf\" target=\"_blank\" rel=\"noopener\">内閣府資料<\/a>、<a href=\"https://www.pref.osaka.lg.jp/menkyo/o020100/0000042.html\" target=\"_blank\" rel=\"noopener\">大阪府 高圧ガスの製造に関する手続き<\/a><\/p>"}, {"n": 5, "topic": "貯蔵所", "stmts": [["イ", "第一種ガスだけを容積 3,000 m³ 以上貯蔵するときは、都道府県知事の許可を受けた第一種貯蔵所で貯蔵する必要がある。"], ["ロ", "第二種ガスだけを容積 1,000 m³ 以上貯蔵するときは、第一種貯蔵所で貯蔵する必要がある。"], ["ハ", "容積 300 m³ 以上で、第一種貯蔵所の基準に満たない貯蔵所は、第二種貯蔵所として届出の対象となる。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正（第 16 条・第 17 条の 2）。<\/li><li>第一種ガスは比較的危険の小さいガス（不活性ガスなど）なので、基準の容積が大きく（3,000 m³）なっている。<\/li><li>第一種ガスと第二種ガスを一緒に貯蔵する場合は、換算式で判定する。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.fukushima.lg.jp/sec/16025a/gaspage2.html\" target=\"_blank\" rel=\"noopener\">福島県 高圧ガス（貯蔵）<\/a>、<a href=\"https://www.pref.ibaraki.jp/seikatsukankyo/shobo/sangyo/info/sangyohoan/koatsugastyozo/documents/tebiki-tyozou.pdf\" target=\"_blank\" rel=\"noopener\">茨城県 貯蔵の手引き<\/a><\/p>"}, {"n": 6, "topic": "危害予防規程・保安教育", "stmts": [["イ", "第一種製造者は危害予防規程を定め、都道府県知事に届け出なければならない。"], ["ロ", "第一種製造者が危害予防規程を変更したときは、届け出る必要はない。"], ["ハ", "第一種製造者は、従業者に対する保安教育計画を定めなければならない。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正（第 26 条第 1 項）。<\/li><li>ロ：誤。変更したときも届出が必要である。<\/li><li>ハ：正（第 27 条）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.okinawa.jp/site/shoko/seisaku/kiban/kibaiyoboukitei.html\" target=\"_blank\" rel=\"noopener\">沖縄県 危害予防規程<\/a>、<a href=\"https://www.uec.ac.jp/about/facilities/safetymanagement/pdf/security_education_plan.pdf\" target=\"_blank\" rel=\"noopener\">電気通信大学 保安教育計画（第 27 条に基づく）<\/a><\/p>"}, {"n": 7, "topic": "保安検査・定期自主検査", "stmts": [["イ", "保安検査は、前回の保安検査の日から 1 年（告示で定める施設は、告示で定める期間）を超えない日までに受けなければならない。"], ["ロ", "定期自主検査は法第 35 条の 2 に定められた義務で、第一種製造者などが行わなければならない。"], ["ハ", "保安検査を受けた施設は、定期自主検査を行う必要がない。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（第 35 条）。<\/li><li>ロ：正（第 35 条の 2）。<\/li><li>ハ：誤。保安検査は行政（知事や KHK など）が行う検査で、定期自主検査は事業者が自分で行う検査。目的も主体も違うので、両方とも必要である。<\/li><\/ul><p>根拠：<a href=\"https://www.city.nagoya.jp/bousai/shoubou/1013208/1011202/1011266/1033942/1011279.html\" target=\"_blank\" rel=\"noopener\">名古屋市 保安検査<\/a>、<a href=\"https://www.city.hiroshima.lg.jp/uploaded/attachment/182167.pdf\" target=\"_blank\" rel=\"noopener\">広島市資料（定期自主検査）<\/a><\/p>"}, {"n": 8, "topic": "保安統括者・保安技術管理者・保安係員", "stmts": [["イ", "第一種製造者は、保安統括者を選任または解任したときは、遅滞なく都道府県知事に届け出なければならない。"], ["ロ", "保安技術管理者は、乙種機械責任者免状を持つ者からも選任できる。"], ["ハ", "保安技術管理者と保安係員の選任・解任は、前年 8 月 1 日から当年 7 月 31 日までの分をまとめて、期間が終わった後に遅滞なく届け出る。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正（第 27 条の 2 第 5 項）。<\/li><li>ロ：誤。保安技術管理者に必要な免状は<strong>甲種化学・甲種機械<\/strong>。乙種機械で選任できるのは保安係員である。<\/li><li>ハ：正。届出の様式は一般高圧ガス保安規則の様式第 33 の 2。<\/li><\/ul><p>根拠：<a href=\"https://www.city.nagoya.jp/bousai/shoubou/1013208/1011202/1011266/1033942/1011275.html\" target=\"_blank\" rel=\"noopener\">名古屋市 保安統括者等<\/a>、<a href=\"https://www.city.sendai.jp/hoan/download/bunyabetsu/koatsugas/sezojigyo/kanri.html\" target=\"_blank\" rel=\"noopener\">仙台市 保安管理体制<\/a>、<a href=\"https://www.pref.gunma.jp/site/shinsei/12547.html\" target=\"_blank\" rel=\"noopener\">群馬県 保安技術管理者等届<\/a><\/p>"}, {"n": 9, "topic": "事故届", "stmts": [["イ", "高圧ガスについて災害が発生したときは、遅滞なく都道府県知事または警察官に届け出なければならない。"], ["ロ", "容器を盗まれた場合は、中に高圧ガスが入っていても届出の対象ではない。"], ["ハ", "高圧ガスを喪失したときも、遅滞なく都道府県知事または警察官に届け出なければならない。"]], "choices": ["イ", "ハ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ・ハ：正（第 63 条第 1 項）。災害の発生のほか、高圧ガスや容器を<strong>喪失したとき・盗まれたとき<\/strong>も届出の対象になる。<\/li><li>ロ：誤。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.mie.lg.jp/SHOBO/HP/HPG_accident.htm\" target=\"_blank\" rel=\"noopener\">三重県 高圧ガスの事故<\/a>、<a href=\"https://www.city.sendai.jp/hoan/zikotodokenituite.html\" target=\"_blank\" rel=\"noopener\">仙台市 事故届<\/a><\/p>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "第二種製造者は、製造を始めた日から 20 日以内に届け出なければならない。"], ["ロ", "第一種製造者の危害予防規程は、都道府県知事への届出の対象である。"], ["ハ", "容積 300 m³ 以上の高圧ガスを貯蔵する場合、第一種貯蔵所の基準に満たなければ、第二種貯蔵所の届出の対象となる。"]], "choices": ["イ", "ロ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。製造を始める日の「20 日<strong>前<\/strong>まで」に届け出る。「後」と「前」を入れ替えた選択肢に注意する。<\/li><li>ロ：正（第 26 条）。<\/li><li>ハ：正（第 17 条の 2）。<\/li><\/ul><p>根拠：問 4・問 5・問 6 と同じ。<\/p>"}]}, {"id": "02", "topic": "適用除外と定義の応用", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-02.md", "questions": [{"n": 1, "topic": "圧縮ガスの定義の応用", "stmts": [["イ", "常用の温度における圧力が 0.9 MPa（現在も 0.9 MPa）だが、温度 35 ℃では 1.1 MPa になる圧縮窒素は、高圧ガスである。"], ["ロ", "常用の温度では 1.2 MPa になるが、現在の圧力は 0.8 MPa で、温度 35 ℃でも 0.9 MPa にしかならない圧縮空気は、高圧ガスではない。"], ["ハ", "温度 35 ℃において 1 MPa 以上となる圧縮ガスでも、現在の圧力が 1 MPa 未満であれば、高圧ガスではない。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。A（常用の温度で 1 MPa 以上）は満たさないが、B（35 ℃で 1 MPa 以上）を満たす（第 2 条第 1 号）。<\/li><li>ロ：正。A は「常用の温度で 1 MPa 以上」<strong>かつ<\/strong>「現に 1 MPa 以上」なので、現在の圧力が 0.8 MPa では満たさない。B も満たさない。<\/li><li>ハ：誤。B を満たせば、現在の圧力に関係なく高圧ガスである。<\/li><\/ul><p>根拠：<a href=\"https://ja.wikibooks.org/wiki/%E9%AB%98%E5%9C%A7%E3%82%AC%E3%82%B9%E4%BF%9D%E5%AE%89%E6%B3%95%E7%AC%AC2%E6%9D%A1\" target=\"_blank\" rel=\"noopener\">Wikibooks 第 2 条<\/a>、<a href=\"https://note.com/303geos/n/n5fbbb85d7a38\" target=\"_blank\" rel=\"noopener\">303geos（note）<\/a>、<a href=\"https://chemhobby.com/chemistry/chemicalengineering/high_pressure_gas/\" target=\"_blank\" rel=\"noopener\">chemhobby 定義フローチャート<\/a><\/p>"}, {"n": 2, "topic": "圧縮アセチレンガス", "stmts": [["イ", "常用の温度において 0.25 MPa で、現在も 0.25 MPa である圧縮アセチレンガスは、高圧ガスである。"], ["ロ", "温度 15 ℃では 0.15 MPa だが、常用の温度では 0.25 MPa で、現在も 0.25 MPa である圧縮アセチレンガスは、15 ℃の条件を満たさないので高圧ガスではない。"], ["ハ", "温度 15 ℃において 0.2 MPa 以上となる圧縮アセチレンガスは、現在の圧力が 0.1 MPa であっても、高圧ガスである。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正。A を満たす（第 2 条第 2 号）。<\/li><li>ロ：誤。15 ℃の条件（B）を満たさなくても、A を満たせば高圧ガスである。<\/li><li>ハ：正。B を満たす。<\/li><\/ul><p>根拠：<a href=\"https://ja.wikibooks.org/wiki/%E9%AB%98%E5%9C%A7%E3%82%AC%E3%82%B9%E4%BF%9D%E5%AE%89%E6%B3%95%E7%AC%AC2%E6%9D%A1\" target=\"_blank\" rel=\"noopener\">Wikibooks 第 2 条<\/a><\/p>"}, {"n": 3, "topic": "液化ガス", "stmts": [["イ", "圧力が 0.2 MPa となる場合の温度が 30 ℃である液化ガスは、高圧ガスである。"], ["ロ", "圧力が 0.2 MPa となる場合の温度が 40 ℃で、常用の温度における圧力が 0.15 MPa である液化ガスは、高圧ガスではない。"], ["ハ", "液化ガスは、温度 35 ℃において圧力が 1 MPa 以上となるものに限り、高圧ガスとなる。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。0.2 MPa になる温度が 35 ℃以下なので、B を満たす（第 2 条第 3 号）。<\/li><li>ロ：正。A（常用の温度で 0.2 MPa 以上）も B（35 ℃以下で 0.2 MPa になる）も満たさない。<\/li><li>ハ：誤。液化ガスの基準圧は 0.2 MPa。1 MPa は圧縮ガスの基準である。<\/li><\/ul><p>根拠：<a href=\"https://ja.wikibooks.org/wiki/%E9%AB%98%E5%9C%A7%E3%82%AC%E3%82%B9%E4%BF%9D%E5%AE%89%E6%B3%95%E7%AC%AC2%E6%9D%A1\" target=\"_blank\" rel=\"noopener\">Wikibooks 第 2 条<\/a>、<a href=\"https://www.meti.go.jp/shingikai/sankoshin/hoan_shohi/koatsu_gas/pdf/008_02_00.pdf\" target=\"_blank\" rel=\"noopener\">経済産業省 資料<\/a><\/p>"}, {"n": 4, "topic": "第 4 号の液化ガス", "stmts": [["イ", "温度 35 ℃において圧力が 0 Pa を超える液化ガスは、種類を問わずすべて高圧ガスである。"], ["ロ", "温度 35 ℃において圧力が 0 Pa を超える液化ガスのうち、液化シアン化水素など政令で定めるものは、高圧ガスである。"], ["ハ", "液化ブロムメチルは、政令で定める液化ガスに含まれる。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。第 4 号の対象は、政令で定める液化ガスに限られる。<\/li><li>ロ・ハ：正。毒性などが強いものは、圧力が低くても対象にしている。<\/li><\/ul><p>根拠：<a href=\"https://ja.wikibooks.org/wiki/%E9%AB%98%E5%9C%A7%E3%82%AC%E3%82%B9%E4%BF%9D%E5%AE%89%E6%B3%95%E7%AC%AC2%E6%9D%A1\" target=\"_blank\" rel=\"noopener\">Wikibooks 第 2 条<\/a>、<a href=\"https://www.mlsrc.saitama-u.ac.jp/anzen/doc/hoankosyu_2025.pdf\" target=\"_blank\" rel=\"noopener\">埼玉大学 保安講習資料<\/a><\/p>"}, {"n": 5, "topic": "用語の意味", "stmts": [["イ", "「常用の温度」とは、そのガスを取り扱う過程で通常なり得る最高の温度をいう。"], ["ロ", "「常用の温度」とは、常温（おおむね 20 ℃）をいう。"], ["ハ", "「現にその圧力が 1 MPa 以上であるもの」とは、現在の圧力が 1 MPa 以上であるものをいう。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。「常用の温度」は常温ではない。<\/li><li>ハ：正。「現に」と「常用の温度において」の違いが、定義の 2 つの条件の違いになっている。<\/li><\/ul><p>根拠：<a href=\"https://chemical-engineering-review.com/high-pressure-gas-safety-act-2/\" target=\"_blank\" rel=\"noopener\">化学工学レビュワー<\/a>、<a href=\"https://kako-mon.com/re-3/preparation/purpose-and-definitions/\" target=\"_blank\" rel=\"noopener\">kako-mon.com「目的と定義」<\/a><\/p>"}, {"n": 6, "topic": "適用除外 I", "stmts": [["イ", "高圧ボイラーとその導管内における高圧蒸気には、高圧ガス保安法は適用されない。"], ["ロ", "鉄道車両のエアコンディショナー内における高圧ガスには、高圧ガス保安法は適用されない。"], ["ハ", "船舶安全法の適用を受ける船舶内の高圧ガスにも、高圧ガス保安法のすべての規定が適用される。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ロ：正（第 3 条第 1 項）。<\/li><li>ハ：誤。船舶安全法の適用を受ける船舶は、適用除外として挙げられている。船の安全は船舶安全法の仕組みで確保されているため。<\/li><\/ul><p>根拠：<a href=\"https://lawzilla.jp/law/326AC0000000204?n=ln3&amp;amp;mode=only\" target=\"_blank\" rel=\"noopener\">Lawzilla 第 3 条<\/a>、<a href=\"https://www.echoland-plus.com/gashou/hoan/hoan-03.html\" target=\"_blank\" rel=\"noopener\">echoland-plus 第 3 条<\/a>、<a href=\"https://klchem.co.jp/blog/2007/06/post-448.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル「法の適用除外」<\/a><\/p>"}, {"n": 7, "topic": "適用除外 II", "stmts": [["イ", "鉱山の設備内における高圧ガスは、適用除外とされるものがある。"], ["ロ", "原子炉とその附属施設内における高圧ガスは、適用除外とされている。"], ["ハ", "その他災害の発生のおそれがない高圧ガスで、政令で定めるものは、適用除外とされている。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ：正。鉱山の設備内の高圧ガスは、鉱山保安法の仕組みで安全が確保されている。<\/li><li>ロ：正。原子炉の安全は原子力関係の法律で確保されている（<a href=\"https://www2.nra.go.jp/data/000464966.pdf\" target=\"_blank\" rel=\"noopener\">原子力規制庁 資料<\/a>）。<\/li><li>ハ：正。具体的な範囲は政令（施行令第 2 条第 3 項）で決められている。<\/li><\/ul><p>根拠：<a href=\"https://lawzilla.jp/law/326AC0000000204?n=ln3&amp;amp;mode=only\" target=\"_blank\" rel=\"noopener\">Lawzilla 第 3 条<\/a>、<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/oshirase/2025/03/20250328_kouatsu_1.html\" target=\"_blank\" rel=\"noopener\">経済産業省 告示改正のお知らせ<\/a><\/p>"}, {"n": 8, "topic": "小さな容器", "stmts": [["イ", "内容積 1 デシリットル以下の容器には、容器や事故届に関する規定など、法の一部の規定が適用されない。"], ["ロ", "密閉しないで用いられる容器には、容器に関する規定がすべて適用される。"], ["ハ", "内容積 1 デシリットル以下の容器に入った高圧ガスには、高圧ガス保安法のすべての規定が適用されない。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。密閉しないで用いられる容器も、内容積 1 デシリットル以下の容器と同じく、第 40 条〜第 56 条の 2 の 2 と第 60 条〜第 63 条が適用されない。<\/li><li>ハ：誤。外れるのは一部の規定だけである。<\/li><\/ul><p>根拠：<a href=\"https://www.meti.go.jp/shingikai/sankoshin/hoan_shohi/koatsu_gas/pdf/008_02_00.pdf\" target=\"_blank\" rel=\"noopener\">経済産業省 審議会資料<\/a><\/p>"}, {"n": 9, "topic": "政令・告示による適用除外", "stmts": [["イ", "政令で定める適用除外は、法第 3 条とは関係なく、都道府県知事がそれぞれ定めている。"], ["ロ", "設備内のガスの容積が 0.15 m³ 以下のもののうち、経済産業大臣が定めるものは、規制の対象から除外されている。"], ["ハ", "告示で定める適用除外の範囲は、一度定められると改正されることはない。"]], "choices": ["イ", "ロ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 2, "explain": "<ul><li>イ：誤。政令による適用除外は、法第 3 条の「政令で定めるもの」を受けて国が定める。<\/li><li>ロ：正。<\/li><li>ハ：誤。2025 年 3 月にも、安全性が確認された設備内のガスが除外の対象に加えられた。<\/li><\/ul><p>根拠：<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/oshirase/2025/03/20250328_kouatsu_1.html\" target=\"_blank\" rel=\"noopener\">経済産業省 告示改正のお知らせ（2025 年 3 月）<\/a><\/p>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "自動車の装置内の高圧ガスには、法が適用されないものがある。"], ["ロ", "高圧ガスの定義に当たるガスには、適用除外に当たるかどうかにかかわらず、法のすべての規定が適用される。"], ["ハ", "鉄道車両のエアコンディショナー内の高圧ガスは、適用除外とはならない。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正。自動車の装置内の高圧ガスには法が適用されない。その自動車の種類は、令和 7 年 8 月 1 日施行の容器保安規則の改正で規定された（<a href=\"https://www.e-jemai.jp/jemai_club/act_amendment/lex_6/cat119/\" target=\"_blank\" rel=\"noopener\">JEMAI CLUB 法改正情報<\/a>）。<\/li><li>ロ：誤。適用除外に当たれば、法は適用されない。<\/li><li>ハ：誤（問 6 のロ）。<\/li><\/ul>"}]}, {"id": "03", "topic": "製造の許可・変更の許可・軽微な変更・承継", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-03.md", "questions": [{"n": 1, "topic": "製造の許可と欠格事由", "stmts": [["イ", "第一種製造者になろうとする者は、都道府県知事の許可を受けなければならない。"], ["ロ", "第一種製造者の許可を取り消され、取消しの日から 2 年を経過しない者は、製造の許可を受けることができない。"], ["ハ", "第一種製造者の許可を取り消された者でも、取消しの日から 1 年を経過すれば、製造の許可を受けることができる。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（第 5 条第 1 項）。<\/li><li>ロ：正（第 7 条第 1 号）。<\/li><li>ハ：誤。期間は 2 年である。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.aomori.lg.jp/kensei/jyourei/shinsakijyun/gyote_shinsakijyun_1497.html\" target=\"_blank\" rel=\"noopener\">青森県 審査基準（高圧ガス保安法）<\/a>、<a href=\"https://www.pref.saga.lg.jp/kiji00310078/3_10078_200272_up_yu5eixkx.pdf\" target=\"_blank\" rel=\"noopener\">佐賀県 審査基準<\/a><\/p>"}, {"n": 2, "topic": "許可の審査", "stmts": [["イ", "製造の許可の審査では、製造施設が一般高圧ガス保安規則などで定める技術上の基準に適合しているかが審査される。"], ["ロ", "製造施設が技術上の基準に適合していれば、申請者が欠格事由に当たっていても許可される。"], ["ハ", "都道府県は、製造の許可などについて審査基準や標準処理期間を定めて公表している。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正。第 8 条（許可の基準）の審査で、一般則第 5 条などの技術上の基準への適合が見られる。<\/li><li>ロ：誤。施設が基準に適合していることに加えて、申請者が第 7 条の欠格事由に当たらないことも必要である。「施設」と「人」の両方を審査する。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.saga.lg.jp/kiji00310078/3_10078_200272_up_yu5eixkx.pdf\" target=\"_blank\" rel=\"noopener\">佐賀県 審査基準<\/a>、<a href=\"https://www.pref.aomori.lg.jp/kensei/jyourei/shinsakijyun/gyote_shinsakijyun_1497.html\" target=\"_blank\" rel=\"noopener\">青森県 審査基準・標準処理期間<\/a><\/p>"}, {"n": 3, "topic": "第一種製造者の承継", "stmts": [["イ", "第一種製造者について相続・合併・分割があり、許可に係る事業所を承継した者は、第一種製造者の地位を承継する。"], ["ロ", "イの場合、第一種製造者の地位を承継した者は、遅滞なく、その事実を証する書面を添えて都道府県知事に届け出なければならない。"], ["ハ", "第一種製造者から製造施設を譲り受けた者は、届出をするだけで第一種製造者の地位を承継する。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ロ：正（第 10 条第 1 項・第 2 項）。相続の場合は、戸籍謄本など相続の事実を示す書面を添える。<\/li><li>ハ：誤。第一種製造者の承継は、相続・合併・分割に限られる。製造施設を譲り受けて製造する場合は、新たに許可を受ける必要がある。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-shoukei.html\" target=\"_blank\" rel=\"noopener\">宮城県 第一種製造事業承継届<\/a>、<a href=\"https://www.pref.niigata.lg.jp/sec/shobo/1203267657908.html\" target=\"_blank\" rel=\"noopener\">新潟県 承継届<\/a>、<a href=\"https://www.city.nagoya.jp/bousai/shoubou/1013208/1011202/1011266/1033942/1011271.html\" target=\"_blank\" rel=\"noopener\">名古屋市 承継<\/a><\/p>"}, {"n": 4, "topic": "第二種製造者の承継", "stmts": [["イ", "第二種製造者が事業の全部を譲り渡したときは、譲り受けた者が第二種製造者の地位を承継する。"], ["ロ", "第二種製造者が事業の一部を譲り渡したときも、譲り受けた者は第二種製造者の地位を承継する。"], ["ハ", "第二種製造者である株式会社が組織を変更した場合は、承継届を出さなければならない。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正（第 10 条の 2）。届出制の第二種製造者は、事業の全部の譲渡でも地位を承継する。<\/li><li>ロ：誤。一部の譲渡は対象外である。<\/li><li>ハ：誤。会社法上の組織変更は、事業者そのものが変わらないので、承継届の対象外とされている。<\/li><\/ul><p>根拠：<a href=\"https://www.city.hamamatsu.shizuoka.jp/hfdyobo/20231004dainisyuseizoujigyousyoukei-ipankouatugasu.html\" target=\"_blank\" rel=\"noopener\">浜松市 第二種製造事業承継届<\/a>、<a href=\"https://www.pref.niigata.lg.jp/sec/shobo/1203267662019.html\" target=\"_blank\" rel=\"noopener\">新潟県 承継届<\/a><\/p>"}, {"n": 5, "topic": "変更の許可", "stmts": [["イ", "第一種製造者は、製造のための施設の位置・構造・設備を変更する工事をするときは、原則として都道府県知事の許可を受けなければならない。"], ["ロ", "第一種製造者が、製造をする高圧ガスの種類や製造の方法を変更するときも、変更の許可の対象となる。"], ["ハ", "許可を要しない「軽微な変更」の範囲は、経済産業省令で定められている。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ：正（第 14 条第 1 項本文）。<\/li><li>ロ：正。変更許可の申請では、製造するガスの種類や製造の方法も記載・審査の対象になる。<\/li><li>ハ：正（第 14 条第 1 項ただし書）。<\/li><\/ul><p>根拠：<a href=\"https://www.city.nagoya.jp/bousai/shoubou/1013208/1011202/1011266/1033942/1011268.html\" target=\"_blank\" rel=\"noopener\">名古屋市 変更許可<\/a>、<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-henkoukyoka.html\" target=\"_blank\" rel=\"noopener\">宮城県 変更許可申請<\/a>、<a href=\"https://www.city.kobe.lg.jp/documents/14143/seizou_tenpushorui.pdf\" target=\"_blank\" rel=\"noopener\">神戸市 製造の添付書類<\/a>、<a href=\"https://www.pref.mie.lg.jp/GYOHSEI/000070898.htm\" target=\"_blank\" rel=\"noopener\">三重県 審査基準<\/a><\/p>"}, {"n": 6, "topic": "軽微な変更", "stmts": [["イ", "第一種製造者が軽微な変更の工事をしたときは、その完成後遅滞なく、都道府県知事に届け出なければならない。"], ["ロ", "軽微な変更の工事は、工事を始める日の 20 日前までに届け出なければならない。"], ["ハ", "軽微な変更の工事をしたのに届け出なかった場合は、罰金の対象となる。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正（第 14 条第 2 項）。届出の様式は一般則第 15 条による。<\/li><li>ロ：誤。軽微な変更は<strong>事後<\/strong>の届出である。「20 日前まで」は、第二種製造者の製造の届出の期限（セット 01）と混同させるひっかけ。<\/li><li>ハ：正。届出義務の違反は、第 83 条の罰金（30 万円以下）の対象になる。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.gunma.jp/site/shinsei/12540.html\" target=\"_blank\" rel=\"noopener\">群馬県 軽微変更届<\/a>、<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-keibihenkou.html\" target=\"_blank\" rel=\"noopener\">宮城県 軽微変更届<\/a>、<a href=\"https://www.kankyo.metro.tokyo.lg.jp/documents/d/kankyo/about-notification-files-safetygas_notice_procedure\" target=\"_blank\" rel=\"noopener\">東京都 届出の注意<\/a><\/p>"}, {"n": 7, "topic": "製造の開始・廃止", "stmts": [["イ", "第一種製造者は、高圧ガスの製造を開始したときは、届け出なければならない。"], ["ロ", "第二種製造者は、高圧ガスの製造を廃止しても、届け出る必要はない。"], ["ハ", "第一種製造者は、高圧ガスの製造を廃止しようとするときは、30 日前までに都道府県知事の許可を受けなければならない。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正（第 21 条）。<\/li><li>ロ：誤。第一種製造者・第二種製造者のどちらも、製造を廃止したときは遅滞なく届け出る。<\/li><li>ハ：誤。廃止は事後の届出で、許可は要らない。<\/li><\/ul><p>根拠：<a href=\"https://www.city.hamamatsu.shizuoka.jp/hfdyobo/20220222kouatuseizoukaisi.html\" target=\"_blank\" rel=\"noopener\">浜松市 製造開始届<\/a>、<a href=\"https://www.city.nagoya.jp/bousai/shoubou/1013208/1011202/1011266/1033942/1011284.html\" target=\"_blank\" rel=\"noopener\">名古屋市 製造廃止届<\/a>、<a href=\"https://www.pref.niigata.lg.jp/sec/shobo/1203267662588.html\" target=\"_blank\" rel=\"noopener\">新潟県 廃止届<\/a><\/p>"}, {"n": 8, "topic": "許可・届出の窓口", "stmts": [["イ", "事業所の所在地によっては、許可の申請や届出の宛先が都道府県知事ではなく市長になることがある。"], ["ロ", "第一種製造者の許可や届出の窓口は、すべて経済産業大臣である。"], ["ハ", "高圧ガス保安法の所管は経済産業省だが、許認可の実務は主に都道府県が担っている。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正。名古屋市などでは、権限の移譲によって届出先が市長になっている。<\/li><li>ロ：誤。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.city.nagoya.jp/bousai/shoubou/1013208/1011202/1011266/1033942/1011284.html\" target=\"_blank\" rel=\"noopener\">名古屋市 製造廃止届（宛先：市長）<\/a>、<a href=\"https://www.bousai.go.jp/jishin/nankai/taio_wg/pdf/h290324sanko02.pdf\" target=\"_blank\" rel=\"noopener\">内閣府 防災資料<\/a><\/p><p>試験では「都道府県知事」と書かれるのが普通である。<\/p>"}, {"n": 9, "topic": "期限の整理", "stmts": [["イ", "第二種製造者は、製造を始める日の 20 日前までに届け出なければならない。"], ["ロ", "相続・合併・分割で第一種製造者の地位を承継した者は、遅滞なく届け出なければならない。"], ["ハ", "第一種製造者は、軽微な変更の工事が完成した後、遅滞なく届け出なければならない。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ：正（第 5 条第 2 項）。<\/li><li>ロ：正（第 10 条第 2 項）。<\/li><li>ハ：正（第 14 条第 2 項）。<\/li><\/ul><p>期限は「20 日前（第二種の製造）」以外は、ここで扱ったものはすべて「遅滞なく（事後）」と覚えるとよい。<\/p><p>根拠：<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/2seizou-seizoujigyou.html\" target=\"_blank\" rel=\"noopener\">宮城県 第二種製造事業届<\/a>、問 3・問 6 と同じ。<\/p>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "第一種製造者は、軽微な変更に当たらない変更の工事であっても、工事の後に届け出れば許可は不要である。"], ["ロ", "第一種製造者の事業の全部を譲り受けた者は、第一種製造者の地位を承継する。"], ["ハ", "第二種製造者の事業の全部を譲り受けた者は、第二種製造者の地位を承継する。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 2, "explain": "<ul><li>イ：誤。軽微な変更以外は、事前に変更の許可が必要である。<\/li><li>ロ：誤。第一種製造者は、譲渡では地位を承継しない（問 3 のハ）。<\/li><li>ハ：正（問 4 のイ）。<\/li><\/ul>"}]}, {"id": "04", "topic": "完成検査", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-04.md", "questions": [{"n": 1, "topic": "完成検査の原則", "stmts": [["イ", "第一種製造者は、製造のための施設の設置の工事を完成したときは、都道府県知事が行う完成検査を受け、技術上の基準に適合していると認められた後でなければ、その施設を使用してはならない。"], ["ロ", "完成検査は、製造を開始してから 1 年以内に受ければよい。"], ["ハ", "完成検査では、製造のための施設が技術上の基準に適合しているかどうかが確かめられる。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正（第 20 条第 1 項）。<\/li><li>ロ：誤。完成検査は、使用を始める<strong>前<\/strong>に受ける。「認められた後でなければ使用してはならない」がポイント。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-kanseikensa.html\" target=\"_blank\" rel=\"noopener\">宮城県 製造施設完成検査申請<\/a>、<a href=\"https://www.pref.ehime.jp/uploaded/attachment/39850.pdf\" target=\"_blank\" rel=\"noopener\">愛媛県 資料<\/a><\/p>"}, {"n": 2, "topic": "KHK・指定完成検査機関による検査", "stmts": [["イ", "高圧ガス保安協会が行う完成検査を受け、技術上の基準に適合していると認められ、その旨を都道府県知事に届け出た場合は、知事の完成検査を受けなくてよい。"], ["ロ", "経済産業大臣が指定する者（指定完成検査機関）が行う完成検査を受けた場合も、イと同じ扱いになる。"], ["ハ", "高圧ガス保安協会の完成検査で基準に適合すると認められた場合は、都道府県知事への届出も不要である。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ロ：正（第 20 条第 1 項ただし書）。<\/li><li>ハ：誤。KHK や指定完成検査機関で検査を受けたときも、その旨を知事に届け出る（<strong>完成検査受検届<\/strong>）。知事がその施設を把握するためである。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-kankenjyuken.html\" target=\"_blank\" rel=\"noopener\">宮城県 完成検査受検届<\/a>、<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/shiteikikan/index.html\" target=\"_blank\" rel=\"noopener\">経済産業省 指定完成検査機関等<\/a><\/p>"}, {"n": 3, "topic": "指定・認定の主体", "stmts": [["イ", "指定完成検査機関を指定するのは、経済産業大臣である。"], ["ロ", "認定完成検査実施者は、都道府県知事の認定を受けた者である。"], ["ハ", "指定完成検査機関の完成検査を受けて届け出た場合でも、その後改めて都道府県知事の完成検査を受けなければならない。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。認定完成検査実施者を認定するのは経済産業大臣である。<\/li><li>ハ：誤。届け出れば、知事の完成検査は受けなくてよい。<\/li><\/ul><p>根拠：<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/shiteikikan/index.html\" target=\"_blank\" rel=\"noopener\">経済産業省 指定完成検査機関等<\/a>、<a href=\"https://www.fdma.go.jp/singi_kento/kento/items/kento079_09_1-5-1.pdf\" target=\"_blank\" rel=\"noopener\">消防庁 資料<\/a><\/p><p>注意：都道府県の審査基準のページには、指定を知事の権限として書いているものもある。試験対策では、条文に従って「経済産業大臣が指定する者」と覚える。<\/p>"}, {"n": 4, "topic": "認定完成検査実施者", "stmts": [["イ", "認定完成検査実施者は、認定を受けた特定変更工事について、自ら完成検査を行うことができる。"], ["ロ", "認定完成検査実施者が自ら完成検査を行ったときは、その検査の記録を都道府県知事に届け出る。"], ["ハ", "認定完成検査実施者は、新たな製造施設の設置の工事についても、自ら完成検査を行うことができる。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。<\/li><li>ロ：正。届出は<strong>完成検査記録届<\/strong>による。<\/li><li>ハ：誤。認定完成検査実施者が自分で検査できるのは、<strong>変更の工事（特定変更工事）に限られる<\/strong>。<\/li><\/ul><p>根拠：<a href=\"https://www.fdma.go.jp/singi_kento/kento/items/kento079_09_1-5-1.pdf\" target=\"_blank\" rel=\"noopener\">消防庁 資料（「③は変更の工事に限る」）<\/a>、<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/hourei/18032305.pdf\" target=\"_blank\" rel=\"noopener\">経済産業省 通達<\/a>、<a href=\"https://www.city.matsuyama.ehime.jp/kurashi/tetsuzuki/kijunkikan/sbkouhou/yoboukijun.files/kouatugasuseizouchozousyokanseikensa.pdf\" target=\"_blank\" rel=\"noopener\">松山市 審査基準<\/a><\/p>"}, {"n": 5, "topic": "変更の工事と完成検査", "stmts": [["イ", "変更の許可を受けた変更の工事は、すべて完成検査を受けなくてよい。"], ["ロ", "軽微な変更の工事は、完成検査を受ける工事とは別の扱いとされている。"], ["ハ", "特定変更工事についても、高圧ガス保安協会の完成検査を受けて基準に適合すると認められ、その旨を届け出れば、都道府県知事の完成検査を受けなくてよい。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 5, "explain": "<ul><li>イ：誤。変更の工事のうち特定変更工事は、完成検査の対象になる（第 20 条第 3 項）。<\/li><li>ロ：正。軽微な変更は、変更の許可も完成検査も要らず、工事後の届出と事業者の自主的な検査で扱われる。<\/li><li>ハ：正（第 20 条第 3 項ただし書）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.chiba.lg.jp/hoan/tetsuzuki/shigoto-sangyou/shoukougyou/documents/r5-1.pdf\" target=\"_blank\" rel=\"noopener\">千葉県 手続きの流れ（完成検査を要しない工事・軽微変更）<\/a>、<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-kankenjyuken.html\" target=\"_blank\" rel=\"noopener\">宮城県 完成検査受検届<\/a><\/p>"}, {"n": 6, "topic": "第一種貯蔵所", "stmts": [["イ", "第一種貯蔵所の所有者または占有者は、その工事を完成したときは、都道府県知事の完成検査を受け、技術上の基準に適合していると認められた後でなければ、高圧ガスの貯蔵を行ってはならない。"], ["ロ", "第一種貯蔵所の完成検査も、高圧ガス保安協会または指定完成検査機関の完成検査を受けて届け出れば、都道府県知事の完成検査を受けなくてよい。"], ["ハ", "第一種貯蔵所の完成検査で確かめるのは、法第 16 条第 2 項の技術上の基準への適合である。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正。<\/li><li>第一種貯蔵所でも、製造施設と同じ仕組みになっている。KHK・指定完成検査機関・認定完成検査実施者による例外もある。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.aichi.jp/site/koatsugas/tyozou-kanseikensa.html\" target=\"_blank\" rel=\"noopener\">愛知県 第一種貯蔵所 完成検査<\/a>、<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1chozou-kankenjyuken.html\" target=\"_blank\" rel=\"noopener\">宮城県 第一種貯蔵所 完成検査受検届<\/a><\/p>"}, {"n": 7, "topic": "完成検査と保安検査の違い", "stmts": [["イ", "第一種製造者は、許可を受け、工事をし、完成検査で基準に適合すると認められてから、施設を使用する。"], ["ロ", "完成検査に合格した施設は、その後の保安検査を受ける必要がない。"], ["ハ", "完成検査は使い始める前に受ける検査で、保安検査は使い始めた後に定期的に受ける検査である。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。保安検査は、使用を始めた後、前回の検査から 1 年（告示で定める施設は告示の期間）を超えない日までに、定期的に受ける（第 35 条、セット 01）。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.city.nagoya.jp/bousai/shoubou/1013208/1011202/1011266/1033942/1011279.html\" target=\"_blank\" rel=\"noopener\">名古屋市 保安検査<\/a>、<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-kanseikensa.html\" target=\"_blank\" rel=\"noopener\">宮城県 完成検査申請<\/a><\/p>"}, {"n": 8, "topic": "届出の種類", "stmts": [["イ", "高圧ガス保安協会や指定完成検査機関で完成検査を受けた後に、都道府県知事に出す届出は、完成検査受検届である。"], ["ロ", "認定完成検査実施者が自ら完成検査を行ったときに出す届出は、完成検査記録届である。"], ["ハ", "完成検査受検届は、工事に着手する前に出さなければならない。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。<\/li><li>ロ：正。<\/li><li>ハ：誤。完成検査受検届は、KHK などで検査を受けて基準に適合すると認められた<strong>後<\/strong>に出す。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-kankenjyuken.html\" target=\"_blank\" rel=\"noopener\">宮城県 完成検査受検届<\/a>、<a href=\"https://www.pref.aichi.jp/site/koatsugas/tyozou-kanseikensa.html\" target=\"_blank\" rel=\"noopener\">愛知県 第一種貯蔵所 完成検査<\/a><\/p>"}, {"n": 9, "topic": "使用の時期", "stmts": [["イ", "完成検査で技術上の基準に適合していると認められなかった施設は、使用することができない。"], ["ロ", "都道府県知事の完成検査で基準に適合しないとされても、その旨を届け出れば使用することができる。"], ["ハ", "完成検査は、施設の使用を始めた後に受けてもよい。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。基準に適合すると認められなければ、使用できない。<\/li><li>ハ：誤。<\/li><\/ul>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "指定完成検査機関を指定するのは経済産業大臣である。"], ["ロ", "第一種製造者は、軽微な変更の工事をしたときは、その完成後遅滞なく都道府県知事に届け出なければならない。"], ["ハ", "認定完成検査実施者が自ら完成検査を行えるのは、変更の工事に限られる。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ：正（問 3）。<\/li><li>ロ：正（セット 03 問 6）。<\/li><li>ハ：正（問 4）。<\/li><\/ul>"}]}];
const KEY = 'koki-quiz-v1';
const KANA_DONE = '○';

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save(r) { try { localStorage.setItem(KEY, JSON.stringify(r)); } catch (e) {} }
let record = load();

const all = SETS.flatMap(s => s.questions.map(q => ({ ...q, set: s.id, setTopic: s.topic, setUrl: s.url, id: s.id + '-' + q.n })));
const byId = Object.fromEntries(all.map(q => [q.id, q]));

let state = null;   // { key, label, order: [ids], idx, picked: {id: n}, done: bool }

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function missedIds() { return all.filter(q => record[q.id] && record[q.id].ok === false).map(q => q.id); }

function start(key) {
  let order, label;
  if (key === 'missed') { order = shuffle(missedIds()); label = 'まちがえた問題'; }
  else if (key === 'mix') { order = shuffle(all.map(q => q.id)).slice(0, 10); label = '全セットから 10 問'; }
  else { const s = SETS.find(x => x.id === key); order = s.questions.map(q => s.id + '-' + q.n); label = 'セット ' + s.id + '　' + s.topic; }
  state = { key, label, order, idx: 0, picked: {}, done: false };
  try { sessionStorage.setItem(KEY + '-set', key); } catch (e) {}
  render();
}

function setScore(s) {
  const ids = s.questions.map(q => s.id + '-' + q.n);
  const tried = ids.filter(id => record[id]);
  return tried.length ? tried.filter(id => record[id].ok).length + '/' + ids.length : '';
}

function renderSets() {
  const nav = document.getElementById('sets');
  nav.innerHTML = '';
  const add = (key, no, text, sc, disabled) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.id = 'chip-' + key;
    b.setAttribute('aria-pressed', state && state.key === key ? 'true' : 'false');
    b.disabled = !!disabled;
    b.innerHTML = (no ? '<span class="no">' + no + '</span>' : '') + '<span>' + text + '</span>' + (sc ? '<span class="sc">' + sc + '</span>' : '');
    b.addEventListener('click', () => start(key));
    nav.appendChild(b);
  };
  SETS.forEach(s => add(s.id, s.id, s.topic, setScore(s)));
  add('mix', '', '全セットから 10 問', '');
  const m = missedIds().length;
  add('missed', '', 'まちがえた問題', m ? m + ' 問' : '', m === 0);
}

function renderBar() {
  const total = state.order.length;
  const answered = Object.keys(state.picked).length;
  document.getElementById('mode').textContent = state.label;
  document.getElementById('count').textContent = state.done ? '結果' : (Math.min(state.idx + 1, total) + ' / ' + total);
  document.getElementById('meter').style.width = (total ? answered / total * 100 : 0) + '%';
}

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

function renderQuestion() {
  const id = state.order[state.idx];
  const q = byId[id];
  const picked = state.picked[id];
  const card = el('section', 'card');
  card.setAttribute('aria-labelledby', 'qno');

  const head = el('div', 'qhead');
  head.appendChild(el('span', 'qno', '問 ' + q.n)).id = 'qno';
  head.appendChild(el('span', 'qtopic', q.topic));
  head.appendChild(el('a', 'qsrc', 'セット ' + q.set)).setAttribute('href', q.setUrl);
  head.lastChild.target = '_blank'; head.lastChild.rel = 'noopener';
  card.appendChild(head);

  card.appendChild(el('p', 'ask', '次のイ、ロ、ハの記述のうち、正しいものはどれか。'));
  const ul = el('ul', 'stmts');
  q.stmts.forEach(([k, t]) => { const li = el('li'); li.appendChild(el('span', 'kana', k)); li.appendChild(el('span', 'txt', t)); ul.appendChild(li); });
  card.appendChild(ul);

  const ch = el('div', 'choices');
  ch.setAttribute('role', 'group'); ch.setAttribute('aria-label', '選択肢');
  q.choices.forEach((c, i) => {
    const n = i + 1;
    const b = el('button', 'opt', '<span class="n">(' + n + ')</span><span class="c">' + c + '</span>');
    b.type = 'button'; b.id = 'opt-' + n;
    if (picked) {
      b.disabled = true;
      if (n === q.answer) b.classList.add('right');
      else if (n === picked) b.classList.add('wrong');
      else b.classList.add('dim');
    } else {
      b.addEventListener('click', () => answer(id, n));
    }
    ch.appendChild(b);
  });
  card.appendChild(ch);

  if (picked) {
    const ok = picked === q.answer;
    const v = el('div', 'verdict ' + (ok ? 'ok' : 'ng'), '<span class="mark" aria-hidden="true">' + (ok ? KANA_DONE : '×') + '</span>' + (ok ? '正解' : '不正解　正解は (' + q.answer + ') ' + q.choices[q.answer - 1]));
    v.setAttribute('role', 'status');
    card.appendChild(v);
    card.appendChild(el('div', 'explain', q.explain));
    const act = el('div', 'actions');
    const last = state.idx === state.order.length - 1;
    const nx = el('button', 'btn', last ? '結果を見る' : '次の問題');
    nx.type = 'button'; nx.id = 'next';
    nx.addEventListener('click', () => { if (last) state.done = true; else state.idx++; render(); nx.blur(); });
    act.appendChild(nx);
    card.appendChild(act);
  }
  return card;
}

function renderResult() {
  const ids = state.order;
  const right = ids.filter(id => state.picked[id] === byId[id].answer).length;
  const card = el('section', 'card result');
  card.appendChild(el('div', 'score', right + '<small> / ' + ids.length + ' 問</small>'));
  const rate = ids.length ? right / ids.length : 0;
  card.appendChild(el('p', 'pass', '正答率 ' + Math.round(rate * 100) + '%'));
  const miss = ids.filter(id => state.picked[id] !== byId[id].answer);
  if (miss.length) {
    const ul = el('ul', 'missed');
    miss.forEach(id => { const q = byId[id]; ul.appendChild(el('li', '', '<span class="k">セット' + q.set + ' 問' + q.n + '</span>' + q.topic + '　正解 (' + q.answer + ') ' + q.choices[q.answer - 1])); });
    card.appendChild(ul);
  }
  const act = el('div', 'actions');
  act.style.justifyContent = 'center';
  const again = el('button', 'btn ghost', 'もう一度');
  again.type = 'button'; again.addEventListener('click', () => start(state.key));
  act.appendChild(again);
  if (missedIds().length) {
    const mb = el('button', 'btn', 'まちがえた問題を解く');
    mb.type = 'button'; mb.addEventListener('click', () => start('missed'));
    act.appendChild(mb);
  }
  card.appendChild(act);
  return card;
}

function answer(id, n) {
  state.picked[id] = n;
  record[id] = { ok: n === byId[id].answer, at: Date.now() };
  save(record);
  render();
}

function render() {
  renderSets();
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  if (!state.order.length) {
    stage.appendChild(el('section', 'card', '<p class="ask">まちがえた問題はありません。セットを選んで解いてください。</p>'));
  } else {
    stage.appendChild(state.done ? renderResult() : renderQuestion());
  }
  renderBar();
}

document.getElementById('reset').addEventListener('click', () => {
  record = {}; save(record);
  document.getElementById('resetMsg').textContent = '成績を消しました';
  render();
});

let first = SETS.length ? SETS[SETS.length - 1].id : null;
try { const k = sessionStorage.getItem(KEY + '-set'); if (k && (k === 'mix' || SETS.some(s => s.id === k))) first = k; } catch (e) {}
if (first) start(first);
</script>
