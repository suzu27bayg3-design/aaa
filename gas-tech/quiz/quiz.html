@media (max-width: 520px) { .choices { grid-template-columns: 1fr 1fr; } .choices .opt:last-child { grid-column: 1 / -1; } }

.missed li { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; }

<script>
const SETS = [{"id": "01", "topic": "総論", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-01.md", "questions": [{"n": 1, "topic": "法の目的", "stmts": [["イ", "この法律は、高圧ガスによる災害を防止するため、高圧ガスの製造、貯蔵、販売などを規制することを定めている。"], ["ロ", "この法律は、民間事業者と高圧ガス保安協会による、高圧ガスの保安に関する自主的な活動を促進することも定めている。"], ["ハ", "この法律の目的は、高圧ガス事業の健全な発達を図ることだけであり、公共の安全の確保は目的に含まれていない。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ロ：正。第 1 条の目的は「規制」と「自主的な活動の促進」の 2 本立て（<a href=\"https://www.toyama-kak.jp/toyama-kak.jp/wp-content/uploads/2025/03/06_%E9%AB%98%E5%9C%A7%E3%82%AC%E3%82%B9%E4%BF%9D%E5%AE%89%E6%B3%95%E3%81%AE%E6%A6%82%E8%A6%81.pdf\" target=\"_blank\" rel=\"noopener\">富山県 概要<\/a>、<a href=\"https://www.bousai.go.jp/jishin/nankai/taio_wg/pdf/h290324sanko02.pdf\" target=\"_blank\" rel=\"noopener\">内閣府資料<\/a>）。<\/li><li>ハ：誤。「事業の健全な発達」はガス事業法の目的の言い回しで、高圧ガス保安法の目的は「公共の安全の確保」。2 つの法律の目的を入れ替えた選択肢に注意する。<\/li><\/ul>"}, {"n": 2, "topic": "圧縮ガスの定義", "stmts": [["イ", "常用の温度において圧力が 1 MPa 以上となる圧縮ガスで、現にその圧力が 1 MPa 以上であるものは、高圧ガスである。"], ["ロ", "温度 35 ℃において圧力が 1 MPa 未満である圧縮ガス（圧縮アセチレンガスを除く）は、高圧ガスではない。"], ["ハ", "「常用の温度」とは常温（おおむね 20 ℃）のことである。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正（第 2 条第 1 号の前段）。<\/li><li>ロ：誤。35 ℃で 1 MPa 未満でも、常用の温度で 1 MPa 以上になり、現に 1 MPa 以上であれば高圧ガスである。第 1 号は「A <strong>又は<\/strong> B」の構造で、どちらか一方を満たせば高圧ガスになる。<\/li><li>ハ：誤。「常用の温度」は常温ではなく、そのガスを取り扱う過程で通常なり得る最高の温度を指す。<\/li><\/ul><p>根拠：<a href=\"https://chemical-engineering-review.com/high-pressure-gas-safety-act-2/\" target=\"_blank\" rel=\"noopener\">化学工学レビュワー<\/a>、<a href=\"https://note.com/303geos/n/n5fbbb85d7a38\" target=\"_blank\" rel=\"noopener\">303geos（note）<\/a>、<a href=\"https://kako-mon.com/re-3/preparation/purpose-and-definitions/\" target=\"_blank\" rel=\"noopener\">kako-mon.com「目的と定義」<\/a>、<a href=\"https://chemhobby.com/chemistry/chemicalengineering/high_pressure_gas/\" target=\"_blank\" rel=\"noopener\">chemhobby 定義フローチャート<\/a><\/p>"}, {"n": 3, "topic": "圧縮アセチレンガス・液化ガスの定義", "stmts": [["イ", "温度 15 ℃において圧力が 0.2 MPa 以上となる圧縮アセチレンガスは、高圧ガスである。"], ["ロ", "圧力が 0.2 MPa となる場合の温度が 35 ℃を超える液化ガスは、常用の温度において圧力が 0.2 MPa 以上で、現にその圧力が 0.2 MPa 以上であっても、高圧ガスではない。"], ["ハ", "温度 35 ℃において圧力が 0 Pa を超える液化ガスのうち、液化シアン化水素、液化ブロムメチルなど政令で定めるものは、高圧ガスである。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（第 2 条第 2 号）。アセチレンは分解爆発を起こしやすいので、圧縮ガスより低い 0.2 MPa・15 ℃が基準になっている。<\/li><li>ロ：誤。第 3 号も「常用の温度で 0.2 MPa 以上かつ現に 0.2 MPa 以上」<strong>又は<\/strong>「0.2 MPa になる温度が 35 ℃以下」の構造。前段を満たせば高圧ガスである。<\/li><li>ハ：正（第 2 条第 4 号）。毒性などが特に強いものは、圧力が低くても対象にしている。<\/li><\/ul><p>根拠：<a href=\"https://ja.wikibooks.org/wiki/%E9%AB%98%E5%9C%A7%E3%82%AC%E3%82%B9%E4%BF%9D%E5%AE%89%E6%B3%95%E7%AC%AC2%E6%9D%A1\" target=\"_blank\" rel=\"noopener\">Wikibooks 高圧ガス保安法第 2 条<\/a>、<a href=\"https://www.mlsrc.saitama-u.ac.jp/anzen/doc/hoankosyu_2025.pdf\" target=\"_blank\" rel=\"noopener\">埼玉大学 保安講習資料<\/a><\/p>"}, {"n": 4, "topic": "製造の許可・届出", "stmts": [["イ", "1 日の処理容積が 100 m³ 以上（不活性ガス・空気を除く）の設備で高圧ガスを製造しようとする者は、都道府県知事に届け出れば足りる。"], ["ロ", "不活性ガスだけを製造する場合、1 日の処理容積が 300 m³ 未満の設備であれば、第二種製造者として届出の対象となる。"], ["ハ", "第二種製造者は、製造を始めた後、遅滞なく都道府県知事に届け出ればよい。"]], "choices": ["イ", "ロ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 2, "explain": "<ul><li>イ：誤。100 m³/日以上は<strong>許可<\/strong>（第 5 条第 1 項、第一種製造者）。<\/li><li>ロ：正。不活性ガス・空気は危険が小さいので、境目が 300 m³ に緩められている。<\/li><li>ハ：誤。第二種製造者は、製造を始める日の <strong>20 日前まで<\/strong>に届け出る（第 5 条第 2 項）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/2seizou-seizoujigyou.html\" target=\"_blank\" rel=\"noopener\">宮城県 第二種製造者 製造事業届<\/a>、<a href=\"https://www.bousai.go.jp/jishin/nankai/taio_wg/pdf/h290324sanko02.pdf\" target=\"_blank\" rel=\"noopener\">内閣府資料<\/a>、<a href=\"https://www.pref.osaka.lg.jp/menkyo/o020100/0000042.html\" target=\"_blank\" rel=\"noopener\">大阪府 高圧ガスの製造に関する手続き<\/a><\/p>"}, {"n": 5, "topic": "貯蔵所", "stmts": [["イ", "第一種ガスだけを容積 3,000 m³ 以上貯蔵するときは、都道府県知事の許可を受けた第一種貯蔵所で貯蔵する必要がある。"], ["ロ", "第二種ガスだけを容積 1,000 m³ 以上貯蔵するときは、第一種貯蔵所で貯蔵する必要がある。"], ["ハ", "容積 300 m³ 以上で、第一種貯蔵所の基準に満たない貯蔵所は、第二種貯蔵所として届出の対象となる。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正（第 16 条・第 17 条の 2）。<\/li><li>第一種ガスは比較的危険の小さいガス（不活性ガスなど）なので、基準の容積が大きく（3,000 m³）なっている。<\/li><li>第一種ガスと第二種ガスを一緒に貯蔵する場合は、換算式で判定する。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.fukushima.lg.jp/sec/16025a/gaspage2.html\" target=\"_blank\" rel=\"noopener\">福島県 高圧ガス（貯蔵）<\/a>、<a href=\"https://www.pref.ibaraki.jp/seikatsukankyo/shobo/sangyo/info/sangyohoan/koatsugastyozo/documents/tebiki-tyozou.pdf\" target=\"_blank\" rel=\"noopener\">茨城県 貯蔵の手引き<\/a><\/p>"}, {"n": 6, "topic": "危害予防規程・保安教育", "stmts": [["イ", "第一種製造者は危害予防規程を定め、都道府県知事に届け出なければならない。"], ["ロ", "第一種製造者が危害予防規程を変更したときは、届け出る必要はない。"], ["ハ", "第一種製造者は、従業者に対する保安教育計画を定めなければならない。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正（第 26 条第 1 項）。<\/li><li>ロ：誤。変更したときも届出が必要である。<\/li><li>ハ：正（第 27 条）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.okinawa.jp/site/shoko/seisaku/kiban/kibaiyoboukitei.html\" target=\"_blank\" rel=\"noopener\">沖縄県 危害予防規程<\/a>、<a href=\"https://www.uec.ac.jp/about/facilities/safetymanagement/pdf/security_education_plan.pdf\" target=\"_blank\" rel=\"noopener\">電気通信大学 保安教育計画（第 27 条に基づく）<\/a><\/p>"}, {"n": 7, "topic": "保安検査・定期自主検査", "stmts": [["イ", "保安検査は、前回の保安検査の日から 1 年（告示で定める施設は、告示で定める期間）を超えない日までに受けなければならない。"], ["ロ", "定期自主検査は法第 35 条の 2 に定められた義務で、第一種製造者などが行わなければならない。"], ["ハ", "保安検査を受けた施設は、定期自主検査を行う必要がない。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（第 35 条）。<\/li><li>ロ：正（第 35 条の 2）。<\/li><li>ハ：誤。保安検査は行政（知事や KHK など）が行う検査で、定期自主検査は事業者が自分で行う検査。目的も主体も違うので、両方とも必要である。<\/li><\/ul><p>根拠：<a href=\"https://www.city.nagoya.jp/bousai/shoubou/1013208/1011202/1011266/1033942/1011279.html\" target=\"_blank\" rel=\"noopener\">名古屋市 保安検査<\/a>、<a href=\"https://www.city.hiroshima.lg.jp/uploaded/attachment/182167.pdf\" target=\"_blank\" rel=\"noopener\">広島市資料（定期自主検査）<\/a><\/p>"}, {"n": 8, "topic": "保安統括者・保安技術管理者・保安係員", "stmts": [["イ", "第一種製造者は、保安統括者を選任または解任したときは、遅滞なく都道府県知事に届け出なければならない。"], ["ロ", "保安技術管理者は、乙種機械責任者免状を持つ者からも選任できる。"], ["ハ", "保安技術管理者と保安係員の選任・解任は、前年 8 月 1 日から当年 7 月 31 日までの分をまとめて、期間が終わった後に遅滞なく届け出る。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正（第 27 条の 2 第 5 項）。<\/li><li>ロ：誤。保安技術管理者に必要な免状は<strong>甲種化学・甲種機械<\/strong>。乙種機械で選任できるのは保安係員である。<\/li><li>ハ：正。届出の様式は一般高圧ガス保安規則の様式第 33 の 2。<\/li><\/ul><p>根拠：<a href=\"https://www.city.nagoya.jp/bousai/shoubou/1013208/1011202/1011266/1033942/1011275.html\" target=\"_blank\" rel=\"noopener\">名古屋市 保安統括者等<\/a>、<a href=\"https://www.city.sendai.jp/hoan/download/bunyabetsu/koatsugas/sezojigyo/kanri.html\" target=\"_blank\" rel=\"noopener\">仙台市 保安管理体制<\/a>、<a href=\"https://www.pref.gunma.jp/site/shinsei/12547.html\" target=\"_blank\" rel=\"noopener\">群馬県 保安技術管理者等届<\/a><\/p>"}, {"n": 9, "topic": "事故届", "stmts": [["イ", "高圧ガスについて災害が発生したときは、遅滞なく都道府県知事または警察官に届け出なければならない。"], ["ロ", "容器を盗まれた場合は、中に高圧ガスが入っていても届出の対象ではない。"], ["ハ", "高圧ガスを喪失したときも、遅滞なく都道府県知事または警察官に届け出なければならない。"]], "choices": ["イ", "ハ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ・ハ：正（第 63 条第 1 項）。災害の発生のほか、高圧ガスや容器を<strong>喪失したとき・盗まれたとき<\/strong>も届出の対象になる。<\/li><li>ロ：誤。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.mie.lg.jp/SHOBO/HP/HPG_accident.htm\" target=\"_blank\" rel=\"noopener\">三重県 高圧ガスの事故<\/a>、<a href=\"https://www.city.sendai.jp/hoan/zikotodokenituite.html\" target=\"_blank\" rel=\"noopener\">仙台市 事故届<\/a><\/p>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "第二種製造者は、製造を始めた日から 20 日以内に届け出なければならない。"], ["ロ", "第一種製造者の危害予防規程は、都道府県知事への届出の対象である。"], ["ハ", "容積 300 m³ 以上の高圧ガスを貯蔵する場合、第一種貯蔵所の基準に満たなければ、第二種貯蔵所の届出の対象となる。"]], "choices": ["イ", "ロ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。製造を始める日の「20 日<strong>前<\/strong>まで」に届け出る。「後」と「前」を入れ替えた選択肢に注意する。<\/li><li>ロ：正（第 26 条）。<\/li><li>ハ：正（第 17 条の 2）。<\/li><\/ul><p>根拠：問 4・問 5・問 6 と同じ。<\/p>"}]}, {"id": "02", "topic": "適用除外と定義の応用", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-02.md", "questions": [{"n": 1, "topic": "圧縮ガスの定義の応用", "stmts": [["イ", "常用の温度における圧力が 0.9 MPa（現在も 0.9 MPa）だが、温度 35 ℃では 1.1 MPa になる圧縮窒素は、高圧ガスである。"], ["ロ", "常用の温度では 1.2 MPa になるが、現在の圧力は 0.8 MPa で、温度 35 ℃でも 0.9 MPa にしかならない圧縮空気は、高圧ガスではない。"], ["ハ", "温度 35 ℃において 1 MPa 以上となる圧縮ガスでも、現在の圧力が 1 MPa 未満であれば、高圧ガスではない。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。A（常用の温度で 1 MPa 以上）は満たさないが、B（35 ℃で 1 MPa 以上）を満たす（第 2 条第 1 号）。<\/li><li>ロ：正。A は「常用の温度で 1 MPa 以上」<strong>かつ<\/strong>「現に 1 MPa 以上」なので、現在の圧力が 0.8 MPa では満たさない。B も満たさない。<\/li><li>ハ：誤。B を満たせば、現在の圧力に関係なく高圧ガスである。<\/li><\/ul><p>根拠：<a href=\"https://ja.wikibooks.org/wiki/%E9%AB%98%E5%9C%A7%E3%82%AC%E3%82%B9%E4%BF%9D%E5%AE%89%E6%B3%95%E7%AC%AC2%E6%9D%A1\" target=\"_blank\" rel=\"noopener\">Wikibooks 第 2 条<\/a>、<a href=\"https://note.com/303geos/n/n5fbbb85d7a38\" target=\"_blank\" rel=\"noopener\">303geos（note）<\/a>、<a href=\"https://chemhobby.com/chemistry/chemicalengineering/high_pressure_gas/\" target=\"_blank\" rel=\"noopener\">chemhobby 定義フローチャート<\/a><\/p>"}, {"n": 2, "topic": "圧縮アセチレンガス", "stmts": [["イ", "常用の温度において 0.25 MPa で、現在も 0.25 MPa である圧縮アセチレンガスは、高圧ガスである。"], ["ロ", "温度 15 ℃では 0.15 MPa だが、常用の温度では 0.25 MPa で、現在も 0.25 MPa である圧縮アセチレンガスは、15 ℃の条件を満たさないので高圧ガスではない。"], ["ハ", "温度 15 ℃において 0.2 MPa 以上となる圧縮アセチレンガスは、現在の圧力が 0.1 MPa であっても、高圧ガスである。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正。A を満たす（第 2 条第 2 号）。<\/li><li>ロ：誤。15 ℃の条件（B）を満たさなくても、A を満たせば高圧ガスである。<\/li><li>ハ：正。B を満たす。<\/li><\/ul><p>根拠：<a href=\"https://ja.wikibooks.org/wiki/%E9%AB%98%E5%9C%A7%E3%82%AC%E3%82%B9%E4%BF%9D%E5%AE%89%E6%B3%95%E7%AC%AC2%E6%9D%A1\" target=\"_blank\" rel=\"noopener\">Wikibooks 第 2 条<\/a><\/p>"}, {"n": 3, "topic": "液化ガス", "stmts": [["イ", "圧力が 0.2 MPa となる場合の温度が 30 ℃である液化ガスは、高圧ガスである。"], ["ロ", "圧力が 0.2 MPa となる場合の温度が 40 ℃で、常用の温度における圧力が 0.15 MPa である液化ガスは、高圧ガスではない。"], ["ハ", "液化ガスは、温度 35 ℃において圧力が 1 MPa 以上となるものに限り、高圧ガスとなる。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。0.2 MPa になる温度が 35 ℃以下なので、B を満たす（第 2 条第 3 号）。<\/li><li>ロ：正。A（常用の温度で 0.2 MPa 以上）も B（35 ℃以下で 0.2 MPa になる）も満たさない。<\/li><li>ハ：誤。液化ガスの基準圧は 0.2 MPa。1 MPa は圧縮ガスの基準である。<\/li><\/ul><p>根拠：<a href=\"https://ja.wikibooks.org/wiki/%E9%AB%98%E5%9C%A7%E3%82%AC%E3%82%B9%E4%BF%9D%E5%AE%89%E6%B3%95%E7%AC%AC2%E6%9D%A1\" target=\"_blank\" rel=\"noopener\">Wikibooks 第 2 条<\/a>、<a href=\"https://www.meti.go.jp/shingikai/sankoshin/hoan_shohi/koatsu_gas/pdf/008_02_00.pdf\" target=\"_blank\" rel=\"noopener\">経済産業省 資料<\/a><\/p>"}, {"n": 4, "topic": "第 4 号の液化ガス", "stmts": [["イ", "温度 35 ℃において圧力が 0 Pa を超える液化ガスは、種類を問わずすべて高圧ガスである。"], ["ロ", "温度 35 ℃において圧力が 0 Pa を超える液化ガスのうち、液化シアン化水素など政令で定めるものは、高圧ガスである。"], ["ハ", "液化ブロムメチルは、政令で定める液化ガスに含まれる。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。第 4 号の対象は、政令で定める液化ガスに限られる。<\/li><li>ロ・ハ：正。毒性などが強いものは、圧力が低くても対象にしている。<\/li><\/ul><p>根拠：<a href=\"https://ja.wikibooks.org/wiki/%E9%AB%98%E5%9C%A7%E3%82%AC%E3%82%B9%E4%BF%9D%E5%AE%89%E6%B3%95%E7%AC%AC2%E6%9D%A1\" target=\"_blank\" rel=\"noopener\">Wikibooks 第 2 条<\/a>、<a href=\"https://www.mlsrc.saitama-u.ac.jp/anzen/doc/hoankosyu_2025.pdf\" target=\"_blank\" rel=\"noopener\">埼玉大学 保安講習資料<\/a><\/p>"}, {"n": 5, "topic": "用語の意味", "stmts": [["イ", "「常用の温度」とは、そのガスを取り扱う過程で通常なり得る最高の温度をいう。"], ["ロ", "「常用の温度」とは、常温（おおむね 20 ℃）をいう。"], ["ハ", "「現にその圧力が 1 MPa 以上であるもの」とは、現在の圧力が 1 MPa 以上であるものをいう。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。「常用の温度」は常温ではない。<\/li><li>ハ：正。「現に」と「常用の温度において」の違いが、定義の 2 つの条件の違いになっている。<\/li><\/ul><p>根拠：<a href=\"https://chemical-engineering-review.com/high-pressure-gas-safety-act-2/\" target=\"_blank\" rel=\"noopener\">化学工学レビュワー<\/a>、<a href=\"https://kako-mon.com/re-3/preparation/purpose-and-definitions/\" target=\"_blank\" rel=\"noopener\">kako-mon.com「目的と定義」<\/a><\/p>"}, {"n": 6, "topic": "適用除外 I", "stmts": [["イ", "高圧ボイラーとその導管内における高圧蒸気には、高圧ガス保安法は適用されない。"], ["ロ", "鉄道車両のエアコンディショナー内における高圧ガスには、高圧ガス保安法は適用されない。"], ["ハ", "船舶安全法の適用を受ける船舶内の高圧ガスにも、高圧ガス保安法のすべての規定が適用される。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ロ：正（第 3 条第 1 項）。<\/li><li>ハ：誤。船舶安全法の適用を受ける船舶は、適用除外として挙げられている。船の安全は船舶安全法の仕組みで確保されているため。<\/li><\/ul><p>根拠：<a href=\"https://lawzilla.jp/law/326AC0000000204?n=ln3&amp;amp;mode=only\" target=\"_blank\" rel=\"noopener\">Lawzilla 第 3 条<\/a>、<a href=\"https://www.echoland-plus.com/gashou/hoan/hoan-03.html\" target=\"_blank\" rel=\"noopener\">echoland-plus 第 3 条<\/a>、<a href=\"https://klchem.co.jp/blog/2007/06/post-448.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル「法の適用除外」<\/a><\/p>"}, {"n": 7, "topic": "適用除外 II", "stmts": [["イ", "鉱山の設備内における高圧ガスは、適用除外とされるものがある。"], ["ロ", "原子炉とその附属施設内における高圧ガスは、適用除外とされている。"], ["ハ", "その他災害の発生のおそれがない高圧ガスで、政令で定めるものは、適用除外とされている。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ：正。鉱山の設備内の高圧ガスは、鉱山保安法の仕組みで安全が確保されている。<\/li><li>ロ：正。原子炉の安全は原子力関係の法律で確保されている（<a href=\"https://www2.nra.go.jp/data/000464966.pdf\" target=\"_blank\" rel=\"noopener\">原子力規制庁 資料<\/a>）。<\/li><li>ハ：正。具体的な範囲は政令（施行令第 2 条第 3 項）で決められている。<\/li><\/ul><p>根拠：<a href=\"https://lawzilla.jp/law/326AC0000000204?n=ln3&amp;amp;mode=only\" target=\"_blank\" rel=\"noopener\">Lawzilla 第 3 条<\/a>、<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/oshirase/2025/03/20250328_kouatsu_1.html\" target=\"_blank\" rel=\"noopener\">経済産業省 告示改正のお知らせ<\/a><\/p>"}, {"n": 8, "topic": "小さな容器", "stmts": [["イ", "内容積 1 デシリットル以下の容器には、容器や事故届に関する規定など、法の一部の規定が適用されない。"], ["ロ", "密閉しないで用いられる容器には、容器に関する規定がすべて適用される。"], ["ハ", "内容積 1 デシリットル以下の容器に入った高圧ガスには、高圧ガス保安法のすべての規定が適用されない。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。密閉しないで用いられる容器も、内容積 1 デシリットル以下の容器と同じく、第 40 条〜第 56 条の 2 の 2 と第 60 条〜第 63 条が適用されない。<\/li><li>ハ：誤。外れるのは一部の規定だけである。<\/li><\/ul><p>根拠：<a href=\"https://www.meti.go.jp/shingikai/sankoshin/hoan_shohi/koatsu_gas/pdf/008_02_00.pdf\" target=\"_blank\" rel=\"noopener\">経済産業省 審議会資料<\/a><\/p>"}, {"n": 9, "topic": "政令・告示による適用除外", "stmts": [["イ", "政令で定める適用除外は、法第 3 条とは関係なく、都道府県知事がそれぞれ定めている。"], ["ロ", "設備内のガスの容積が 0.15 m³ 以下のもののうち、経済産業大臣が定めるものは、規制の対象から除外されている。"], ["ハ", "告示で定める適用除外の範囲は、一度定められると改正されることはない。"]], "choices": ["イ", "ロ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 2, "explain": "<ul><li>イ：誤。政令による適用除外は、法第 3 条の「政令で定めるもの」を受けて国が定める。<\/li><li>ロ：正。<\/li><li>ハ：誤。2025 年 3 月にも、安全性が確認された設備内のガスが除外の対象に加えられた。<\/li><\/ul><p>根拠：<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/oshirase/2025/03/20250328_kouatsu_1.html\" target=\"_blank\" rel=\"noopener\">経済産業省 告示改正のお知らせ（2025 年 3 月）<\/a><\/p>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "自動車の装置内の高圧ガスには、法が適用されないものがある。"], ["ロ", "高圧ガスの定義に当たるガスには、適用除外に当たるかどうかにかかわらず、法のすべての規定が適用される。"], ["ハ", "鉄道車両のエアコンディショナー内の高圧ガスは、適用除外とはならない。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正。自動車の装置内の高圧ガスには法が適用されない。その自動車の種類は、令和 7 年 8 月 1 日施行の容器保安規則の改正で規定された（<a href=\"https://www.e-jemai.jp/jemai_club/act_amendment/lex_6/cat119/\" target=\"_blank\" rel=\"noopener\">JEMAI CLUB 法改正情報<\/a>）。<\/li><li>ロ：誤。適用除外に当たれば、法は適用されない。<\/li><li>ハ：誤（問 6 のロ）。<\/li><\/ul>"}]}, {"id": "03", "topic": "製造の許可・変更の許可・軽微な変更・承継", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-03.md", "questions": [{"n": 1, "topic": "製造の許可と欠格事由", "stmts": [["イ", "第一種製造者になろうとする者は、都道府県知事の許可を受けなければならない。"], ["ロ", "第一種製造者の許可を取り消され、取消しの日から 2 年を経過しない者は、製造の許可を受けることができない。"], ["ハ", "第一種製造者の許可を取り消された者でも、取消しの日から 1 年を経過すれば、製造の許可を受けることができる。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（第 5 条第 1 項）。<\/li><li>ロ：正（第 7 条第 1 号）。<\/li><li>ハ：誤。期間は 2 年である。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.aomori.lg.jp/kensei/jyourei/shinsakijyun/gyote_shinsakijyun_1497.html\" target=\"_blank\" rel=\"noopener\">青森県 審査基準（高圧ガス保安法）<\/a>、<a href=\"https://www.pref.saga.lg.jp/kiji00310078/3_10078_200272_up_yu5eixkx.pdf\" target=\"_blank\" rel=\"noopener\">佐賀県 審査基準<\/a><\/p>"}, {"n": 2, "topic": "許可の審査", "stmts": [["イ", "製造の許可の審査では、製造施設が一般高圧ガス保安規則などで定める技術上の基準に適合しているかが審査される。"], ["ロ", "製造施設が技術上の基準に適合していれば、申請者が欠格事由に当たっていても許可される。"], ["ハ", "都道府県は、製造の許可などについて審査基準や標準処理期間を定めて公表している。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正。第 8 条（許可の基準）の審査で、一般則第 5 条などの技術上の基準への適合が見られる。<\/li><li>ロ：誤。施設が基準に適合していることに加えて、申請者が第 7 条の欠格事由に当たらないことも必要である。「施設」と「人」の両方を審査する。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.saga.lg.jp/kiji00310078/3_10078_200272_up_yu5eixkx.pdf\" target=\"_blank\" rel=\"noopener\">佐賀県 審査基準<\/a>、<a href=\"https://www.pref.aomori.lg.jp/kensei/jyourei/shinsakijyun/gyote_shinsakijyun_1497.html\" target=\"_blank\" rel=\"noopener\">青森県 審査基準・標準処理期間<\/a><\/p>"}, {"n": 3, "topic": "第一種製造者の承継", "stmts": [["イ", "第一種製造者について相続・合併・分割があり、許可に係る事業所を承継した者は、第一種製造者の地位を承継する。"], ["ロ", "イの場合、第一種製造者の地位を承継した者は、遅滞なく、その事実を証する書面を添えて都道府県知事に届け出なければならない。"], ["ハ", "第一種製造者から製造施設を譲り受けた者は、届出をするだけで第一種製造者の地位を承継する。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ロ：正（第 10 条第 1 項・第 2 項）。相続の場合は、戸籍謄本など相続の事実を示す書面を添える。<\/li><li>ハ：誤。第一種製造者の承継は、相続・合併・分割に限られる。製造施設を譲り受けて製造する場合は、新たに許可を受ける必要がある。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-shoukei.html\" target=\"_blank\" rel=\"noopener\">宮城県 第一種製造事業承継届<\/a>、<a href=\"https://www.pref.niigata.lg.jp/sec/shobo/1203267657908.html\" target=\"_blank\" rel=\"noopener\">新潟県 承継届<\/a>、<a href=\"https://www.city.nagoya.jp/bousai/shoubou/1013208/1011202/1011266/1033942/1011271.html\" target=\"_blank\" rel=\"noopener\">名古屋市 承継<\/a><\/p>"}, {"n": 4, "topic": "第二種製造者の承継", "stmts": [["イ", "第二種製造者が事業の全部を譲り渡したときは、譲り受けた者が第二種製造者の地位を承継する。"], ["ロ", "第二種製造者が事業の一部を譲り渡したときも、譲り受けた者は第二種製造者の地位を承継する。"], ["ハ", "第二種製造者である株式会社が組織を変更した場合は、承継届を出さなければならない。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正（第 10 条の 2）。届出制の第二種製造者は、事業の全部の譲渡でも地位を承継する。<\/li><li>ロ：誤。一部の譲渡は対象外である。<\/li><li>ハ：誤。会社法上の組織変更は、事業者そのものが変わらないので、承継届の対象外とされている。<\/li><\/ul><p>根拠：<a href=\"https://www.city.hamamatsu.shizuoka.jp/hfdyobo/20231004dainisyuseizoujigyousyoukei-ipankouatugasu.html\" target=\"_blank\" rel=\"noopener\">浜松市 第二種製造事業承継届<\/a>、<a href=\"https://www.pref.niigata.lg.jp/sec/shobo/1203267662019.html\" target=\"_blank\" rel=\"noopener\">新潟県 承継届<\/a><\/p>"}, {"n": 5, "topic": "変更の許可", "stmts": [["イ", "第一種製造者は、製造のための施設の位置・構造・設備を変更する工事をするときは、原則として都道府県知事の許可を受けなければならない。"], ["ロ", "第一種製造者が、製造をする高圧ガスの種類や製造の方法を変更するときも、変更の許可の対象となる。"], ["ハ", "許可を要しない「軽微な変更」の範囲は、経済産業省令で定められている。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ：正（第 14 条第 1 項本文）。<\/li><li>ロ：正。変更許可の申請では、製造するガスの種類や製造の方法も記載・審査の対象になる。<\/li><li>ハ：正（第 14 条第 1 項ただし書）。<\/li><\/ul><p>根拠：<a href=\"https://www.city.nagoya.jp/bousai/shoubou/1013208/1011202/1011266/1033942/1011268.html\" target=\"_blank\" rel=\"noopener\">名古屋市 変更許可<\/a>、<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-henkoukyoka.html\" target=\"_blank\" rel=\"noopener\">宮城県 変更許可申請<\/a>、<a href=\"https://www.city.kobe.lg.jp/documents/14143/seizou_tenpushorui.pdf\" target=\"_blank\" rel=\"noopener\">神戸市 製造の添付書類<\/a>、<a href=\"https://www.pref.mie.lg.jp/GYOHSEI/000070898.htm\" target=\"_blank\" rel=\"noopener\">三重県 審査基準<\/a><\/p>"}, {"n": 6, "topic": "軽微な変更", "stmts": [["イ", "第一種製造者が軽微な変更の工事をしたときは、その完成後遅滞なく、都道府県知事に届け出なければならない。"], ["ロ", "軽微な変更の工事は、工事を始める日の 20 日前までに届け出なければならない。"], ["ハ", "軽微な変更の工事をしたのに届け出なかった場合は、罰金の対象となる。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正（第 14 条第 2 項）。届出の様式は一般則第 15 条による。<\/li><li>ロ：誤。軽微な変更は<strong>事後<\/strong>の届出である。「20 日前まで」は、第二種製造者の製造の届出の期限（セット 01）と混同させるひっかけ。<\/li><li>ハ：正。届出義務の違反は、第 83 条の罰金（30 万円以下）の対象になる。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.gunma.jp/site/shinsei/12540.html\" target=\"_blank\" rel=\"noopener\">群馬県 軽微変更届<\/a>、<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-keibihenkou.html\" target=\"_blank\" rel=\"noopener\">宮城県 軽微変更届<\/a>、<a href=\"https://www.kankyo.metro.tokyo.lg.jp/documents/d/kankyo/about-notification-files-safetygas_notice_procedure\" target=\"_blank\" rel=\"noopener\">東京都 届出の注意<\/a><\/p>"}, {"n": 7, "topic": "製造の開始・廃止", "stmts": [["イ", "第一種製造者は、高圧ガスの製造を開始したときは、届け出なければならない。"], ["ロ", "第二種製造者は、高圧ガスの製造を廃止しても、届け出る必要はない。"], ["ハ", "第一種製造者は、高圧ガスの製造を廃止しようとするときは、30 日前までに都道府県知事の許可を受けなければならない。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正（第 21 条）。<\/li><li>ロ：誤。第一種製造者・第二種製造者のどちらも、製造を廃止したときは遅滞なく届け出る。<\/li><li>ハ：誤。廃止は事後の届出で、許可は要らない。<\/li><\/ul><p>根拠：<a href=\"https://www.city.hamamatsu.shizuoka.jp/hfdyobo/20220222kouatuseizoukaisi.html\" target=\"_blank\" rel=\"noopener\">浜松市 製造開始届<\/a>、<a href=\"https://www.city.nagoya.jp/bousai/shoubou/1013208/1011202/1011266/1033942/1011284.html\" target=\"_blank\" rel=\"noopener\">名古屋市 製造廃止届<\/a>、<a href=\"https://www.pref.niigata.lg.jp/sec/shobo/1203267662588.html\" target=\"_blank\" rel=\"noopener\">新潟県 廃止届<\/a><\/p>"}, {"n": 8, "topic": "許可・届出の窓口", "stmts": [["イ", "事業所の所在地によっては、許可の申請や届出の宛先が都道府県知事ではなく市長になることがある。"], ["ロ", "第一種製造者の許可や届出の窓口は、すべて経済産業大臣である。"], ["ハ", "高圧ガス保安法の所管は経済産業省だが、許認可の実務は主に都道府県が担っている。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正。名古屋市などでは、権限の移譲によって届出先が市長になっている。<\/li><li>ロ：誤。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.city.nagoya.jp/bousai/shoubou/1013208/1011202/1011266/1033942/1011284.html\" target=\"_blank\" rel=\"noopener\">名古屋市 製造廃止届（宛先：市長）<\/a>、<a href=\"https://www.bousai.go.jp/jishin/nankai/taio_wg/pdf/h290324sanko02.pdf\" target=\"_blank\" rel=\"noopener\">内閣府 防災資料<\/a><\/p><p>試験では「都道府県知事」と書かれるのが普通である。<\/p>"}, {"n": 9, "topic": "期限の整理", "stmts": [["イ", "第二種製造者は、製造を始める日の 20 日前までに届け出なければならない。"], ["ロ", "相続・合併・分割で第一種製造者の地位を承継した者は、遅滞なく届け出なければならない。"], ["ハ", "第一種製造者は、軽微な変更の工事が完成した後、遅滞なく届け出なければならない。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ：正（第 5 条第 2 項）。<\/li><li>ロ：正（第 10 条第 2 項）。<\/li><li>ハ：正（第 14 条第 2 項）。<\/li><\/ul><p>期限は「20 日前（第二種の製造）」以外は、ここで扱ったものはすべて「遅滞なく（事後）」と覚えるとよい。<\/p><p>根拠：<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/2seizou-seizoujigyou.html\" target=\"_blank\" rel=\"noopener\">宮城県 第二種製造事業届<\/a>、問 3・問 6 と同じ。<\/p>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "第一種製造者は、軽微な変更に当たらない変更の工事であっても、工事の後に届け出れば許可は不要である。"], ["ロ", "第一種製造者の事業の全部を譲り受けた者は、第一種製造者の地位を承継する。"], ["ハ", "第二種製造者の事業の全部を譲り受けた者は、第二種製造者の地位を承継する。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 2, "explain": "<ul><li>イ：誤。軽微な変更以外は、事前に変更の許可が必要である。<\/li><li>ロ：誤。第一種製造者は、譲渡では地位を承継しない（問 3 のハ）。<\/li><li>ハ：正（問 4 のイ）。<\/li><\/ul>"}]}, {"id": "04", "topic": "完成検査", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-04.md", "questions": [{"n": 1, "topic": "完成検査の原則", "stmts": [["イ", "第一種製造者は、製造のための施設の設置の工事を完成したときは、都道府県知事が行う完成検査を受け、技術上の基準に適合していると認められた後でなければ、その施設を使用してはならない。"], ["ロ", "完成検査は、製造を開始してから 1 年以内に受ければよい。"], ["ハ", "完成検査では、製造のための施設が技術上の基準に適合しているかどうかが確かめられる。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正（第 20 条第 1 項）。<\/li><li>ロ：誤。完成検査は、使用を始める<strong>前<\/strong>に受ける。「認められた後でなければ使用してはならない」がポイント。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-kanseikensa.html\" target=\"_blank\" rel=\"noopener\">宮城県 製造施設完成検査申請<\/a>、<a href=\"https://www.pref.ehime.jp/uploaded/attachment/39850.pdf\" target=\"_blank\" rel=\"noopener\">愛媛県 資料<\/a><\/p>"}, {"n": 2, "topic": "KHK・指定完成検査機関による検査", "stmts": [["イ", "高圧ガス保安協会が行う完成検査を受け、技術上の基準に適合していると認められ、その旨を都道府県知事に届け出た場合は、知事の完成検査を受けなくてよい。"], ["ロ", "経済産業大臣が指定する者（指定完成検査機関）が行う完成検査を受けた場合も、イと同じ扱いになる。"], ["ハ", "高圧ガス保安協会の完成検査で基準に適合すると認められた場合は、都道府県知事への届出も不要である。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ロ：正（第 20 条第 1 項ただし書）。<\/li><li>ハ：誤。KHK や指定完成検査機関で検査を受けたときも、その旨を知事に届け出る（<strong>完成検査受検届<\/strong>）。知事がその施設を把握するためである。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-kankenjyuken.html\" target=\"_blank\" rel=\"noopener\">宮城県 完成検査受検届<\/a>、<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/shiteikikan/index.html\" target=\"_blank\" rel=\"noopener\">経済産業省 指定完成検査機関等<\/a><\/p>"}, {"n": 3, "topic": "指定・認定の主体", "stmts": [["イ", "指定完成検査機関を指定するのは、経済産業大臣である。"], ["ロ", "指定完成検査機関は、都道府県知事が事業所ごとに指定する。"], ["ハ", "指定完成検査機関の完成検査を受けて届け出た場合でも、その後改めて都道府県知事の完成検査を受けなければならない。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。指定完成検査機関は経済産業大臣が指定する（イ）。<\/li><li>ハ：誤。届け出れば、知事の完成検査は受けなくてよい。<\/li><\/ul><p>根拠：<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/shiteikikan/index.html\" target=\"_blank\" rel=\"noopener\">経済産業省 指定完成検査機関等<\/a>、<a href=\"https://www.fdma.go.jp/singi_kento/kento/items/kento079_09_1-5-1.pdf\" target=\"_blank\" rel=\"noopener\">消防庁 資料<\/a><\/p><p>注意：都道府県の審査基準のページには、指定を知事の権限として書いているものもある。試験対策では、条文に従って「経済産業大臣が指定する者」と覚える。<\/p>"}, {"n": 4, "topic": "認定制度の改正", "stmts": [["イ", "令和 5 年 12 月 21 日に施行された改正で、認定完成検査実施者の認定制度は廃止された。"], ["ロ", "改正前に認定完成検査実施者の認定を受けていた事業者は、その認定の有効期間までは効力が続く。"], ["ハ", "改正後に新しく設けられた認定高度保安実施者は、都道府県知事が認定する。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。同じ改正で、認定保安検査実施者の認定制度も廃止された。<\/li><li>ロ：正。施行日から 3 年間（2026 年 12 月 21 日まで）の経過措置期間もある。<\/li><li>ハ：誤。経済産業大臣が認定する。<\/li><\/ul><p>根拠：<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/sinnintei/index.html\" target=\"_blank\" rel=\"noopener\">経済産業省 認定高度保安実施者制度<\/a>、<a href=\"https://www.fdma.go.jp/relocation/neuter/topics/fieldList4_16/pdf/r05/01/shiryou4-4.pdf\" target=\"_blank\" rel=\"noopener\">消防庁掲載 新たな認定制度の運用<\/a><\/p><p>参考：旧制度の認定完成検査実施者は、変更の工事（特定変更工事）に限って自ら完成検査を行い、記録を知事に届け出る仕組みだった（<a href=\"https://www.fdma.go.jp/singi_kento/kento/items/kento079_09_1-5-1.pdf\" target=\"_blank\" rel=\"noopener\">消防庁 資料<\/a>）。<\/p>"}, {"n": 5, "topic": "変更の工事と完成検査", "stmts": [["イ", "変更の許可を受けた変更の工事は、すべて完成検査を受けなくてよい。"], ["ロ", "軽微な変更の工事は、完成検査を受ける工事とは別の扱いとされている。"], ["ハ", "特定変更工事についても、高圧ガス保安協会の完成検査を受けて基準に適合すると認められ、その旨を届け出れば、都道府県知事の完成検査を受けなくてよい。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 5, "explain": "<ul><li>イ：誤。変更の工事のうち特定変更工事は、完成検査の対象になる（第 20 条第 3 項）。<\/li><li>ロ：正。軽微な変更は、変更の許可も完成検査も要らず、工事後の届出と事業者の自主的な検査で扱われる。<\/li><li>ハ：正（第 20 条第 3 項ただし書）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.chiba.lg.jp/hoan/tetsuzuki/shigoto-sangyou/shoukougyou/documents/r5-1.pdf\" target=\"_blank\" rel=\"noopener\">千葉県 手続きの流れ（完成検査を要しない工事・軽微変更）<\/a>、<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-kankenjyuken.html\" target=\"_blank\" rel=\"noopener\">宮城県 完成検査受検届<\/a><\/p>"}, {"n": 6, "topic": "第一種貯蔵所", "stmts": [["イ", "第一種貯蔵所の所有者または占有者は、その工事を完成したときは、都道府県知事の完成検査を受け、技術上の基準に適合していると認められた後でなければ、高圧ガスの貯蔵を行ってはならない。"], ["ロ", "第一種貯蔵所の完成検査も、高圧ガス保安協会または指定完成検査機関の完成検査を受けて届け出れば、都道府県知事の完成検査を受けなくてよい。"], ["ハ", "第一種貯蔵所の完成検査で確かめるのは、法第 16 条第 2 項の技術上の基準への適合である。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正。<\/li><li>第一種貯蔵所でも、製造施設と同じ仕組みになっている。KHK・指定完成検査機関による例外もある。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.aichi.jp/site/koatsugas/tyozou-kanseikensa.html\" target=\"_blank\" rel=\"noopener\">愛知県 第一種貯蔵所 完成検査<\/a>、<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1chozou-kankenjyuken.html\" target=\"_blank\" rel=\"noopener\">宮城県 第一種貯蔵所 完成検査受検届<\/a><\/p>"}, {"n": 7, "topic": "完成検査と保安検査の違い", "stmts": [["イ", "第一種製造者は、許可を受け、工事をし、完成検査で基準に適合すると認められてから、施設を使用する。"], ["ロ", "完成検査に合格した施設は、その後の保安検査を受ける必要がない。"], ["ハ", "完成検査は使い始める前に受ける検査で、保安検査は使い始めた後に定期的に受ける検査である。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。保安検査は、使用を始めた後、前回の検査から 1 年（告示で定める施設は告示の期間）を超えない日までに、定期的に受ける（第 35 条、セット 01）。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.city.nagoya.jp/bousai/shoubou/1013208/1011202/1011266/1033942/1011279.html\" target=\"_blank\" rel=\"noopener\">名古屋市 保安検査<\/a>、<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-kanseikensa.html\" target=\"_blank\" rel=\"noopener\">宮城県 完成検査申請<\/a><\/p>"}, {"n": 8, "topic": "届出の種類", "stmts": [["イ", "高圧ガス保安協会や指定完成検査機関で完成検査を受けた後に、都道府県知事に出す届出は、完成検査受検届である。"], ["ロ", "第一種貯蔵所について、高圧ガス保安協会や指定完成検査機関で完成検査を受けたときも、完成検査受検届を出す。"], ["ハ", "完成検査受検届は、工事に着手する前に出さなければならない。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。<\/li><li>ロ：正。<\/li><li>ハ：誤。完成検査受検届は、KHK などで検査を受けて基準に適合すると認められた<strong>後<\/strong>に出す。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-kankenjyuken.html\" target=\"_blank\" rel=\"noopener\">宮城県 完成検査受検届（製造）<\/a>、<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1chozou-kankenjyuken.html\" target=\"_blank\" rel=\"noopener\">宮城県 完成検査受検届（第一種貯蔵所）<\/a>、<a href=\"https://www.pref.aichi.jp/site/koatsugas/tyozou-kanseikensa.html\" target=\"_blank\" rel=\"noopener\">愛知県 第一種貯蔵所 完成検査<\/a><\/p>"}, {"n": 9, "topic": "使用の時期", "stmts": [["イ", "完成検査で技術上の基準に適合していると認められなかった施設は、使用することができない。"], ["ロ", "都道府県知事の完成検査で基準に適合しないとされても、その旨を届け出れば使用することができる。"], ["ハ", "完成検査は、施設の使用を始めた後に受けてもよい。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。基準に適合すると認められなければ、使用できない。<\/li><li>ハ：誤。<\/li><\/ul>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "指定完成検査機関を指定するのは経済産業大臣である。"], ["ロ", "第一種製造者は、軽微な変更の工事をしたときは、その完成後遅滞なく都道府県知事に届け出なければならない。"], ["ハ", "完成検査は、許可制である第一種製造者の製造施設と第一種貯蔵所に課される。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ：正（問 3）。<\/li><li>ロ：正（セット 03 問 6）。<\/li><li>ハ：正。届出制の第二種製造者・第二種貯蔵所には課されない（セット 05 問 9）。<\/li><\/ul>"}]}, {"id": "05", "topic": "貯蔵の方法と貯蔵所", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-05.md", "questions": [{"n": 1, "topic": "貯蔵の意味と液化ガスの換算", "stmts": [["イ", "高圧ガスの「貯蔵」には、容器に充てんした高圧ガスを置くことが含まれる。"], ["ロ", "液化ガスは、質量 1 kg をもって容積 1 m³ とみなす。"], ["ハ", "貯蔵所の区分を判断するとき、液化ガスは質量 10 kg をもって容積 1 m³ とみなす。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。貯蔵は「容器に充てんした高圧ガスを置く」こと、または「貯槽に充てんして置く」こと。<\/li><li>ロ：誤。10 kg で 1 m³。<\/li><li>ハ：正（法第 16 条第 3 項）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.ibaraki.jp/seikatsukankyo/shobo/sangyo/info/sangyohoan/koatsugastyozo/documents/tebiki-tyozou.pdf\" target=\"_blank\" rel=\"noopener\">茨城県 貯蔵の手引き<\/a>、<a href=\"https://www.city.nagoya.jp/bousai/shoubou/1013208/1011202/1011266/1033943/1011292.html\" target=\"_blank\" rel=\"noopener\">名古屋市 第二種貯蔵所<\/a><\/p>"}, {"n": 2, "topic": "第一種貯蔵所と第二種貯蔵所", "stmts": [["イ", "第二種貯蔵所は、貯蔵を始めた後、遅滞なく届け出ればよい。"], ["ロ", "容積 300 m³ 以上の高圧ガスを貯蔵する場合で、第一種貯蔵所に当たらないときは、あらかじめ都道府県知事に届け出た第二種貯蔵所で貯蔵しなければならない。"], ["ハ", "第二種ガスだけを容積 1,000 m³ 以上貯蔵するときは、都道府県知事の許可を受けた第一種貯蔵所で貯蔵しなければならない。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。第二種貯蔵所は「あらかじめ」（貯蔵所を設置する前に）届け出る。<\/li><li>ロ：正（第 17 条の 2 第 1 項）。<\/li><li>ハ：正（第 16 条第 1 項）。<\/li><\/ul><p>根拠：<a href=\"https://www.city.sendai.jp/hoan/download/bunyabetsu/koatsugas/chozo/setchi.html\" target=\"_blank\" rel=\"noopener\">仙台市 第二種貯蔵所<\/a>、<a href=\"https://www.pref.aichi.jp/site/koatsugas/tyozou-2syu.html\" target=\"_blank\" rel=\"noopener\">愛知県 第二種貯蔵所<\/a>、<a href=\"https://www.city.hamamatsu.shizuoka.jp/hfdyobo/20231004dainisyutyozoujyosetti-ipankouatugasu.html\" target=\"_blank\" rel=\"noopener\">浜松市 第二種貯蔵所設置届<\/a><\/p><p>第二種製造者の「20 日前」と違い、第二種貯蔵所の届出期限は自治体の案内でも「あらかじめ」としか書かれていない。日数で問われたら注意する。<\/p>"}, {"n": 3, "topic": "温度の管理", "stmts": [["イ", "充てん容器等は、常に温度 40 ℃以下に保たなければならない。"], ["ロ", "充てん容器等の温度の上限は 60 ℃である。"], ["ハ", "ガスの温度を計測できる充てん容器等では、そのガスの温度を 40 ℃以下に保つ。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正（一般則第 18 条第 2 号）。圧力は温度とともに上がる（第 02 回の pV = nRT）。そのため、温度を抑えることが容器の破裂を防ぐ基本になる。<\/li><li>ロ：誤。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.nara.jp/secure/139863/%E8%B2%AF%E8%94%B5%E3%83%BB%E7%A7%BB%E5%8B%95%E5%9F%BA%E6%BA%96%E5%AF%BE%E5%BF%9C%E8%A1%A8%EF%BC%88%E4%B8%80%E8%88%AC%E5%89%87%EF%BC%89.docx\" target=\"_blank\" rel=\"noopener\">奈良県 貯蔵・移動基準対応表<\/a>、<a href=\"https://www.pref.okinawa.jp/_res/projects/default_project/_page_/001/012/100/21sankouhanbaikeikakusyo-marin.pdf\" target=\"_blank\" rel=\"noopener\">沖縄県 販売計画書参考例<\/a><\/p>"}, {"n": 4, "topic": "衝撃の防止", "stmts": [["イ", "充てん容器等（内容積 5 L 以下のものを除く）は、転落・転倒などによる衝撃と、バルブの損傷を防ぐ措置を講じ、粗暴な取扱いをしないこと。"], ["ロ", "内容積 5 L 以下の充てん容器等にも、イの措置が義務づけられている。"], ["ハ", "衝撃を防ぐ措置は、可燃性ガスの容器にだけ求められている。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正（一般則第 18 条）。<\/li><li>ロ：誤。内容積 5 L 以下の容器は除かれている。<\/li><li>ハ：誤。ガスの種類を問わない。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.nara.jp/secure/139863/%E8%B2%AF%E8%94%B5%E3%83%BB%E7%A7%BB%E5%8B%95%E5%9F%BA%E6%BA%96%E5%AF%BE%E5%BF%9C%E8%A1%A8%EF%BC%88%E4%B8%80%E8%88%AC%E5%89%87%EF%BC%89.docx\" target=\"_blank\" rel=\"noopener\">奈良県 貯蔵・移動基準対応表<\/a>、<a href=\"https://www.pref.okinawa.jp/_res/projects/default_project/_page_/001/012/100/21sankouhanbaikeikakusyo-marin.pdf\" target=\"_blank\" rel=\"noopener\">沖縄県 参考例<\/a><\/p>"}, {"n": 5, "topic": "容器置場の使い方", "stmts": [["イ", "充てん容器と残ガス容器は、それぞれ区分して容器置場に置く。"], ["ロ", "可燃性ガス・毒性ガス・酸素の充てん容器等は、それぞれ区分して置く。"], ["ハ", "容器置場には、計量器など作業に必要なもの以外のものを置かない。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正。区分して置くのは、可燃性ガスと酸素が隣り合うと、漏れたときに燃焼の危険が大きくなるため。また、取り違えを防ぐためでもある。<\/li><\/ul><p>根拠：<a href=\"https://klchem.co.jp/industry/siryo_8.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル 一般則抜粋<\/a>、<a href=\"https://www.pref.okinawa.jp/_res/projects/default_project/_page_/001/012/100/21sankouhanbaikeikakusyo-marin.pdf\" target=\"_blank\" rel=\"noopener\">沖縄県 参考例<\/a><\/p>"}, {"n": 6, "topic": "火気と通風", "stmts": [["イ", "毒性ガスの容器は、密閉した倉庫の中で貯蔵しなければならない。"], ["ロ", "可燃性ガス・毒性ガスの充てん容器等の貯蔵は、通風の良い場所で行う。"], ["ハ", "容器置場の周囲 2 m 以内では、火気の使用が制限される。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。通風の良い場所で貯蔵する。<\/li><li>ロ：正。漏れたガスが燃焼範囲（第 04 回）や有害な濃度までたまらないようにするため。<\/li><li>ハ：正（火気制限 2 m）。<\/li><\/ul><p>根拠：<a href=\"https://klchem.co.jp/industry/siryo_8.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル 一般則抜粋<\/a>、<a href=\"http://echoland-plus.com/gashou/ippan/ippan-18.html\" target=\"_blank\" rel=\"noopener\">echoland-plus 一般則第 18 条<\/a><\/p>"}, {"n": 7, "topic": "車両に積んだままの貯蔵", "stmts": [["イ", "貯蔵は、原則として、車両に固定し、または積載した容器によってしてはならない。"], ["ロ", "車両に積んだ容器での貯蔵は、時間にかかわらず一切問題にならない。"], ["ハ", "車両に容器を積んだまま長時間（目安として 2 時間以上）置いておくと、貯蔵とみなされることがある。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。消火用の不活性ガスや緊急車両の高圧ガスなどの例外、許可・届出に従う場合の例外がある。<\/li><li>ロ：誤。<\/li><li>ハ：正。佐賀県の Q&amp;A による運用の目安。<\/li><\/ul><p>根拠：<a href=\"http://echoland-plus.com/gashou/ippan/ippan-18.html\" target=\"_blank\" rel=\"noopener\">echoland-plus 一般則第 18 条<\/a>、<a href=\"https://www.pref.saga.lg.jp/kiji00376235/3_76235_275292_up_aze6r3aj.pdf\" target=\"_blank\" rel=\"noopener\">佐賀県 よくある質問集<\/a><\/p>"}, {"n": 8, "topic": "規制の対象外", "stmts": [["イ", "容積 0.15 m³ 以下の圧縮ガスの貯蔵には、貯蔵の技術上の基準は適用されない。"], ["ロ", "容積 0.15 m³ を超える圧縮ガスであれば、量にかかわらず第一種貯蔵所の許可が必要になる。"], ["ハ", "貯蔵所に当たらない量の貯蔵であっても、0.15 m³ を超える圧縮ガスの貯蔵は、貯蔵の技術上の基準に従わなければならない。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（一般則第 19 条）。<\/li><li>ロ：誤。第一種貯蔵所が必要になるのは、第一種ガスで 3,000 m³ 以上、第二種ガスで 1,000 m³ 以上のとき。<\/li><li>ハ：正。貯蔵所に当たらない量でも、置き方の基準は守る必要がある。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.mie.lg.jp/SHOBO/HP/HPG_store.htm\" target=\"_blank\" rel=\"noopener\">三重県 高圧ガスの貯蔵<\/a><\/p>"}, {"n": 9, "topic": "行政の命令", "stmts": [["イ", "第二種貯蔵所にも、第一種貯蔵所と同じく完成検査が義務づけられている。"], ["ロ", "第一種貯蔵所の工事を完成したときは、完成検査を受け、技術上の基準に適合していると認められた後でなければ貯蔵を行えない。"], ["ハ", "都道府県知事は、貯蔵所での貯蔵が技術上の基準に適合していないと認めるときは、基準に従って貯蔵するよう命じることができる。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。完成検査は、許可制の第一種貯蔵所に課される。届出制の第二種貯蔵所には課されない。<\/li><li>ロ：正（第 20 条、セット 04）。<\/li><li>ハ：正（第 15 条第 2 項）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.ibaraki.jp/seikatsukankyo/shobo/sangyo/info/sangyohoan/koatsugastyozo/documents/tebiki-tyozou.pdf\" target=\"_blank\" rel=\"noopener\">茨城県 貯蔵の手引き<\/a>、<a href=\"https://www.pref.aichi.jp/site/koatsugas/tyozou-kanseikensa.html\" target=\"_blank\" rel=\"noopener\">愛知県 第一種貯蔵所 完成検査<\/a><\/p>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "第一種ガスだけを容積 3,000 m³ 以上貯蔵する場合は、第一種貯蔵所の許可が必要である。"], ["ロ", "液化ガス 5,000 kg は、貯蔵所の判定で容積 500 m³ として扱う。"], ["ハ", "充てん容器等は、40 ℃以下に保ち、転落・転倒を防ぎ、容器置場の 2 m 以内では火気を制限する。"]], "choices": ["イ", "ロ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ：正。<\/li><li>ロ：正。5,000 ÷ 10 = 500 m³。<\/li><li>ハ：正。<\/li><\/ul>"}]}, {"id": "06", "topic": "販売事業", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-06.md", "questions": [{"n": 1, "topic": "販売事業の届出", "stmts": [["イ", "高圧ガスの販売の事業を営もうとする者は、販売所ごとに、事業開始の日の 20 日前までに都道府県知事に届け出なければならない。"], ["ロ", "販売事業の届出は、事業者ごとに 1 回行えばよく、販売所ごとに行う必要はない。"], ["ハ", "販売事業は、都道府県知事の許可を受けなければ営むことができない。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正（第 20 条の 4）。<\/li><li>ロ：誤。届出は販売所ごとに行う。<\/li><li>ハ：誤。販売事業は届出制で、許可制ではない。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.yamaguchi.lg.jp/soshiki/7/14231.html\" target=\"_blank\" rel=\"noopener\">山口県 高圧ガス販売の手続き<\/a>、<a href=\"https://www.pref.chiba.lg.jp/hoan/tetsuzuki/920/05100-020.html\" target=\"_blank\" rel=\"noopener\">千葉県 販売事業届<\/a>、<a href=\"https://www.khk.or.jp/administration/high_pressure_gas/procedure03.html\" target=\"_blank\" rel=\"noopener\">KHK 販売に係る申請手続き<\/a><\/p>"}, {"n": 2, "topic": "届出が要らない場合", "stmts": [["イ", "第一種製造者が、その事業所で製造した高圧ガスをその事業所で販売するときは、販売事業の届出は要らない。"], ["ロ", "第一種製造者は、どこで製造した高圧ガスをどこで販売する場合でも、販売事業の届出は要らない。"], ["ハ", "医療用ガス（在宅酸素療法用の液化酸素を除く）などを、常時の貯蔵量が容積 5 m³ 未満で販売する場合は、届出が要らない場合がある。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。届出が要らないのは「その事業所で製造したガスを、その事業所で販売する」場合に限られる。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.city.sakai.lg.jp/kurashi/bosai/shobo/shinsei/kouatsu/kouatsukisoku/20hanbai.html\" target=\"_blank\" rel=\"noopener\">堺市 高圧ガスの販売<\/a>、<a href=\"https://www.city.sapporo.jp/shobo/yobo/hoan/documents/hanbai.pdf\" target=\"_blank\" rel=\"noopener\">札幌市 販売の手引き<\/a><\/p>"}, {"n": 3, "topic": "販売主任者", "stmts": [["イ", "販売主任者は、事業者ごとに 1 人選任すれば、すべての販売所を受け持つことができる。"], ["ロ", "販売主任者を選任したときは、都道府県知事に届け出なければならない。"], ["ハ", "省令で定める高圧ガスを販売する販売業者は、販売所ごとに、所定の免状と経験を持つ者から販売主任者を選任しなければならない。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。販売主任者は販売所ごとに選任する。販売に必要な免状は、ガスの種類によって違う（例：酸素・水素・アンモニアなど）。<\/li><li>ロ：正。<\/li><li>ハ：正（第 28 条）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.yamaguchi.lg.jp/soshiki/7/14231.html\" target=\"_blank\" rel=\"noopener\">山口県<\/a>、<a href=\"https://www.pref.mie.lg.jp/SHOBO/HP/HPG_sales.htm\" target=\"_blank\" rel=\"noopener\">三重県 販売事業に関する手続き<\/a><\/p>"}, {"n": 4, "topic": "周知の対象と方法", "stmts": [["イ", "周知の対象となるのは、溶接・熱切断用のアセチレンや酸素、在宅酸素療法用の液化酸素など、省令で定める高圧ガスである。"], ["ロ", "周知は口頭で行えば足り、書面は要らない。"], ["ハ", "周知は、災害の発生の防止に必要な事項を記載した書面を配布して行う。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（第 20 条の 5、一般則第 38 条・第 39 条）。<\/li><li>ロ：誤。書面の配布が必要である。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.city.sakai.lg.jp/kurashi/bosai/shobo/shinsei/kouatsu/kouatsukisoku/20hanbai.html\" target=\"_blank\" rel=\"noopener\">堺市<\/a>、<a href=\"https://www.pref.okinawa.jp/_res/projects/default_project/_page_/001/012/100/00hannbaijigyou.pdf\" target=\"_blank\" rel=\"noopener\">沖縄県 販売事業の手引き<\/a><\/p>"}, {"n": 5, "topic": "周知の時期", "stmts": [["イ", "周知は、最初の販売契約のときに 1 回行えば、その後は不要である。"], ["ロ", "前回の周知から 1 年以上たって高圧ガスを引き渡すときも、周知を行う。"], ["ハ", "周知は、販売契約を結んだときに行う。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。1 年以上たったら、引き渡すときにもう一度周知する。消費者側の人や設備が変わっているかもしれないからである。<\/li><li>ロ・ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.city.sakai.lg.jp/kurashi/bosai/shobo/shinsei/kouatsu/kouatsukisoku/20hanbai.html\" target=\"_blank\" rel=\"noopener\">堺市<\/a><\/p>"}, {"n": 6, "topic": "周知を受ける者", "stmts": [["イ", "第一種製造者に高圧ガスを販売するときは、周知の義務はない。"], ["ロ", "特定高圧ガス消費者に高圧ガスを販売するときも、周知の義務がある。"], ["ハ", "他の販売業者に高圧ガスを販売するときは、周知の義務はない。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正。<\/li><li>ロ：誤。第一種製造者・販売業者・特定高圧ガス消費者は、周知を受ける側から除かれている。どれも、自ら保安の義務を負っている者だからである。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.okinawa.jp/_res/projects/default_project/_page_/001/012/100/00hannbaijigyou.pdf\" target=\"_blank\" rel=\"noopener\">沖縄県 販売事業の手引き<\/a><\/p>"}, {"n": 7, "topic": "帳簿", "stmts": [["イ", "販売業者の帳簿は、記載の日から 10 年間保存しなければならない。"], ["ロ", "販売業者の帳簿は、記載の日から 2 年間保存しなければならない。"], ["ハ", "販売業者は、販売所ごとに帳簿を備え、容器による高圧ガスの授受について記載しなければならない。"]], "choices": ["イ", "ハ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 5, "explain": "<ul><li>イ：誤。10 年は、第一種製造者の製造施設に異常があった場合などの記録の保存期間（セット 13）。<\/li><li>ロ：正。<\/li><li>ハ：正（第 60 条、一般則第 95 条第 3 項）。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201810-08_R.pdf\" target=\"_blank\" rel=\"noopener\">KHK「高圧ガス保安法の基礎シリーズ」第 15 回（帳簿）<\/a>、<a href=\"https://www.city.sendai.jp/hoan/documents/4-kouatugasu-hannbai.pdf\" target=\"_blank\" rel=\"noopener\">仙台市 高圧ガスの販売<\/a>、<a href=\"https://www.pref.saitama.lg.jp/documents/179680/tebikihanbai.pdf\" target=\"_blank\" rel=\"noopener\">埼玉県 販売の手引<\/a><\/p>"}, {"n": 8, "topic": "承継・廃止・移転", "stmts": [["イ", "販売事業を廃止したときは、遅滞なく都道府県知事に届け出なければならない。"], ["ロ", "販売所を移転する場合は、販売事業を廃止し、あらためて販売事業の届出をする必要がある。"], ["ハ", "販売事業を承継したときは、承継の届出を行う。"]], "choices": ["イ", "ロ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正。届出は「販売所」に結びついているので、場所が変われば新しい届出になる。<\/li><\/ul><p>根拠：<a href=\"https://www.city.sakai.lg.jp/kurashi/bosai/shobo/shinsei/kouatsu/kouatsukisoku/20hanbai.html\" target=\"_blank\" rel=\"noopener\">堺市<\/a>、<a href=\"https://www.pref.yamaguchi.lg.jp/soshiki/7/14231.html\" target=\"_blank\" rel=\"noopener\">山口県<\/a><\/p>"}, {"n": 9, "topic": "液化石油ガスの販売", "stmts": [["イ", "液化石油ガスを一般消費者等に販売する事業は、液化石油ガス法による登録を受けて行う。"], ["ロ", "イの事業は、高圧ガス保安法による販売事業の届出の対象である。"], ["ハ", "液化石油ガスを一般消費者等に販売する事業にも、高圧ガス保安法の販売主任者の選任が必要である。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正。<\/li><li>ロ・ハ：誤。液化石油ガスを一般消費者等に販売する事業は液化石油ガス法の対象で、高圧ガス保安法の販売事業の届出からは除かれている。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.yamaguchi.lg.jp/soshiki/7/14231.html\" target=\"_blank\" rel=\"noopener\">山口県<\/a>、<a href=\"https://www.pref.kochi.lg.jp/doc/2019121900050/file_contents/hanbaitebiki.pdf\" target=\"_blank\" rel=\"noopener\">高知県 販売の手引<\/a><\/p>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "販売事業の届出は事業開始の 20 日前まで、第二種製造者の届出は製造開始の 20 日前までである。"], ["ロ", "販売業者は、すべての高圧ガスについて、販売のたびに周知を行わなければならない。"], ["ハ", "販売業者が周知を行う方法は書面の配布であり、周知の記録は帳簿に記載する。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。周知の対象は省令で定めるガスに限られ、時期も「契約時」と「1 年以上たっての引き渡し時」である。<\/li><li>ハ：正。周知を行った記録も、帳簿の記載事項になっている。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201810-08_R.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 15 回<\/a>、<a href=\"https://www.city.sakai.lg.jp/kurashi/bosai/shobo/shinsei/kouatsu/kouatsukisoku/20hanbai.html\" target=\"_blank\" rel=\"noopener\">堺市<\/a><\/p>"}]}, {"id": "07", "topic": "移動", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-07.md", "questions": [{"n": 1, "topic": "警戒標", "stmts": [["イ", "充てん容器等を車両に積載して移動するときは、その車両の見やすい箇所に警戒標を掲げなければならない。"], ["ロ", "警戒標は、毒性ガスを積載する場合にだけ掲げればよい。"], ["ハ", "小さな容器だけを少量積載する場合など、警戒標を要しない例外がある。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。ガスの種類を問わない。<\/li><li>ハ：正。小さな容器だけを少量積載した車両には例外がある。例外となる容器の内容積と合計の数値は、資料によって「20 L 以下・合計 40 L 以下」と「25 L 以下・合計 50 L 以下」があり、改正で変わっている。<\/li><\/ul><p>根拠：<a href=\"https://www.kankyo.metro.tokyo.lg.jp/documents/d/kankyo/gas-300400a20180814141108681-files-idoukijyunn\" target=\"_blank\" rel=\"noopener\">東京都 移動基準<\/a>、<a href=\"https://www.pref.mie.lg.jp/common/content/001220632.pdf\" target=\"_blank\" rel=\"noopener\">三重県 輸送防災講習会資料<\/a><\/p>"}, {"n": 2, "topic": "温度と転倒防止", "stmts": [["イ", "移動中は車両の荷台が通風の良い状態になるので、温度を管理する必要はない。"], ["ロ", "移動中の充てん容器等には、転落・転倒などを防ぐ措置を講じる。"], ["ハ", "移動中の充てん容器等は、常に温度 40 ℃以下に保たなければならない。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。直射日光や車内の熱で容器の温度は上がる。温度が上がると圧力も上がる（pV = nRT）。<\/li><li>ロ・ハ：正（一般則第 50 条）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.nagasaki.jp/fs/8/7/6/6/_/00-5-2__2-02__50_.docx\" target=\"_blank\" rel=\"noopener\">長崎県 一般則第 50 条の基準<\/a>、<a href=\"https://www.pref.nara.jp/secure/139863/%E8%B2%AF%E8%94%B5%E3%83%BB%E7%A7%BB%E5%8B%95%E5%9F%BA%E6%BA%96%E5%AF%BE%E5%BF%9C%E8%A1%A8%EF%BC%88%E4%B8%80%E8%88%AC%E5%89%87%EF%BC%89.docx\" target=\"_blank\" rel=\"noopener\">奈良県 貯蔵・移動基準対応表<\/a><\/p>"}, {"n": 3, "topic": "可燃性ガスと酸素の積載", "stmts": [["イ", "可燃性ガスの充てん容器と酸素の充てん容器を同一の車両に積載するときは、バルブが互いに向き合わないようにする。"], ["ロ", "可燃性ガスと酸素の充てん容器は、どのような場合も同一の車両に積載してはならない。"], ["ハ", "塩素とアセチレン、アンモニア、水素などの組合せのように、同一の車両に積載してはならない組合せが定められている。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：正。バルブから漏れたとき、可燃性ガスと酸素が直接混ざらないようにするため。<\/li><li>ロ：誤。バルブの向きに気をつければ、同一の車両に積める。<\/li><li>ハ：正（一般則第 50 条第 6 号）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.mie.lg.jp/common/content/001220632.pdf\" target=\"_blank\" rel=\"noopener\">三重県 輸送防災講習会資料<\/a><\/p>"}, {"n": 4, "topic": "消火設備・資材", "stmts": [["イ", "可燃性ガス・毒性ガス・酸素を移動するときは、消火器や防災工具などを携行する。"], ["ロ", "不活性ガスを移動する場合も、必ず除害の措置が必要である。"], ["ハ", "アルシンやセレン化水素の充てん容器を積載した車両には、除害の措置が必要である。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正。<\/li><li>ロ：誤。除害の措置が必要なのは、毒性の特に強いガスなどである。<\/li><\/ul><p>根拠：<a href=\"https://www.kankyo.metro.tokyo.lg.jp/documents/d/kankyo/gas-300400a20180814141108681-files-idoukijyunn\" target=\"_blank\" rel=\"noopener\">東京都 移動基準<\/a>、<a href=\"https://www.pref.mie.lg.jp/common/content/001220632.pdf\" target=\"_blank\" rel=\"noopener\">三重県資料<\/a><\/p>"}, {"n": 5, "topic": "注意事項の書面", "stmts": [["イ", "注意事項の書面は、事業所に保管しておけばよく、運転者に携帯させる必要はない。"], ["ロ", "移動中に携帯させる注意事項の書面は、一般に「イエローカード」と呼ばれている。"], ["ハ", "災害の発生の防止のために必要な注意事項を記載した書面を運転者に交付し、移動中携帯させ、これを遵守させる。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。<\/li><li>ロ・ハ：正。事故のとき、運転者や駆けつけた消防が、書面を見てすぐに正しい対処ができるようにするためのものである。<\/li><\/ul><p>根拠：<a href=\"https://www.kankyo.metro.tokyo.lg.jp/documents/d/kankyo/gas-300400a20180814141108681-files-idoukijyunn\" target=\"_blank\" rel=\"noopener\">東京都 移動基準<\/a>、<a href=\"https://www.khk.or.jp/Portals/0/khk/hpg/accident/2022/20221014_transportation_link04.pdf\" target=\"_blank\" rel=\"noopener\">KHK 移動の規制<\/a><\/p>"}, {"n": 6, "topic": "運転者の数", "stmts": [["イ", "移動監視者の乗務が必要な量の高圧ガスを移動する場合で、一の運転者による連続運転時間が 4 時間を超えるときは、交替して運転させるため、運転者 2 人を乗車させる必要がある。"], ["ロ", "イの場合で、一の運転者による運転時間が 1 日当たり 9 時間を超えるときも、運転者 2 人を乗車させる必要がある。"], ["ハ", "連続運転時間には休憩時間の長さは関係なく、運転を始めてから終えるまでの時間をいう。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ロ：正。運転者 2 人の基準は、移動監視者が必要になるような大量の移動にかかる。<\/li><li>ハ：誤。「連続運転時間」は、1 回が連続 10 分以上で、合計 30 分以上の運転の中断をすることなく連続して運転する時間をいう。<\/li><\/ul><p>根拠：<a href=\"https://www.kankyo.metro.tokyo.lg.jp/documents/d/kankyo/gas-300400a20180814141108681-files-idoukijyunn\" target=\"_blank\" rel=\"noopener\">東京都 移動基準<\/a>、<a href=\"https://www.pref.mie.lg.jp/common/content/001220632.pdf\" target=\"_blank\" rel=\"noopener\">三重県資料<\/a><\/p>"}, {"n": 7, "topic": "移動監視者", "stmts": [["イ", "可燃性ガス・酸素の圧縮ガスを容積 300 m³ 以上移動するときは、移動監視者が必要である。"], ["ロ", "可燃性ガス・酸素の液化ガスを質量 3,000 kg 以上移動するときは、移動監視者が必要である。"], ["ハ", "毒性ガスは、可燃性ガスより少ない量から移動監視者が必要になる。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正。毒性ガスは、漏れたときの影響が大きいので、少ない量から監視者が必要になる。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.okayama.jp/uploaded/life/863013_8198071_misc.pdf\" target=\"_blank\" rel=\"noopener\">岡山県 高圧ガスの移動<\/a><\/p>"}, {"n": 8, "topic": "適用される規則", "stmts": [["イ", "一般の高圧ガスを車両で移動するときの技術上の基準は、一般高圧ガス保安規則に定められている。"], ["ロ", "高圧ガスの移動には、高圧ガス保安法の基準は適用されない。"], ["ハ", "液化石油ガスを車両で移動するときの技術上の基準は、液化石油ガス保安規則に定められている。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（一般則第 48 条〜第 50 条）。<\/li><li>ロ：誤。<\/li><li>ハ：正（液石則第 47 条〜第 49 条）。<\/li><\/ul><p>根拠：<a href=\"https://www.kankyo.metro.tokyo.lg.jp/documents/d/kankyo/gas-300400a20180814141108681-files-idoukijyunn\" target=\"_blank\" rel=\"noopener\">東京都 移動基準<\/a><\/p>"}, {"n": 9, "topic": "毒性ガスの積載", "stmts": [["イ", "毒性ガスを移動する車両には、警戒標を掲げる必要がない。"], ["ロ", "毒性ガスの容器にも、温度を 40 ℃以下に保つ基準が適用される。"], ["ハ", "毒性ガスの充てん容器を積載するときは、木枠やパッキンなどを使って、容器どうしがぶつからないようにする措置が求められる。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。警戒標の少量の例外からも、毒性ガスの容器は除かれている。<\/li><li>ロ・ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.mie.lg.jp/common/content/001220632.pdf\" target=\"_blank\" rel=\"noopener\">三重県資料<\/a>、<a href=\"https://www.kankyo.metro.tokyo.lg.jp/documents/d/kankyo/gas-300400a20180814141108681-files-idoukijyunn\" target=\"_blank\" rel=\"noopener\">東京都 移動基準<\/a><\/p>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "移動の基準は、移動中に事故が起きても、その場で被害を広げないための措置を含んでいる。"], ["ロ", "酸素は燃えないガスなので、移動の基準は適用されない。"], ["ハ", "警戒標の要否を決める少量の基準（容器の内容積の上限など）は、改正で数値が変わったことがあり、最新の条文で確かめる必要がある。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。酸素は他のものを激しく燃やす（支燃性）ガスで、消火器の携行や可燃性ガスとの積み方などの基準の対象である。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.kankyo.metro.tokyo.lg.jp/documents/d/kankyo/gas-300400a20180814141108681-files-idoukijyunn\" target=\"_blank\" rel=\"noopener\">東京都 移動基準<\/a>、<a href=\"https://www.pref.mie.lg.jp/common/content/001220632.pdf\" target=\"_blank\" rel=\"noopener\">三重県資料<\/a><\/p>"}]}, {"id": "08", "topic": "消費と廃棄", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-08.md", "questions": [{"n": 1, "topic": "特定高圧ガス消費者の届出", "stmts": [["イ", "特定高圧ガスを消費する者は、事業所ごとに、消費開始の日の 20 日前までに都道府県知事に届け出なければならない。"], ["ロ", "特定高圧ガスを消費する者は、都道府県知事の許可を受けなければならない。"], ["ハ", "特定高圧ガスを消費する者は、消費を開始した後、遅滞なく届け出ればよい。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正（第 24 条の 2）。<\/li><li>ロ：誤。許可制ではなく届出制。<\/li><li>ハ：誤。事前（20 日前まで）の届出。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.mie.lg.jp/SHOBO/HP/HPG_consumer.htm\" target=\"_blank\" rel=\"noopener\">三重県 消費にかかる規制<\/a>、<a href=\"https://www.pref.aichi.jp/site/koatsugas/tokutei-todoke.html\" target=\"_blank\" rel=\"noopener\">愛知県 特定高圧ガス消費届<\/a>、<a href=\"https://www.khk.or.jp/administration/high_pressure_gas/procedure04.html\" target=\"_blank\" rel=\"noopener\">KHK 特定高圧ガス消費者の申請手続き<\/a><\/p>"}, {"n": 2, "topic": "特定高圧ガスの種類", "stmts": [["イ", "圧縮モノシラン・圧縮ジボラン・液化アルシンは、微量であっても特定高圧ガスの消費の届出の対象となる。"], ["ロ", "特定高圧ガスは、量にかかわらず、すべて同じ基準で届出の対象となる。"], ["ハ", "液化塩素は、一定量以上を貯蔵して消費する場合に届出の対象となる。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。少量でも自然発火や強い毒性で大きな被害になるため。<\/li><li>ロ：誤。ガスの種類ごとに数量の基準がある。<\/li><li>ハ：正。茨城県の手引きでは、液化塩素は質量 1,000 kg 以上で届出の対象とされている。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.aichi.jp/site/koatsugas/tokutei-todoke.html\" target=\"_blank\" rel=\"noopener\">愛知県 特定高圧ガス消費届<\/a>、<a href=\"https://www.pref.ibaraki.jp/seikatsukankyo/shobo/sangyo/info/sangyohoan/koatsugastebiki/documents/honnbunn-6.pdf\" target=\"_blank\" rel=\"noopener\">茨城県 特定高圧ガス消費者に係る届出<\/a><\/p>"}, {"n": 3, "topic": "消費設備の火気の制限", "stmts": [["イ", "特定高圧ガスの消費設備では、火気との距離を定める基準はない。"], ["ロ", "特定高圧ガスの貯蔵設備などの周囲 5 m 以内には、可燃性・発火性のものを置かない。"], ["ハ", "特定高圧ガスの貯蔵設備などの周囲 5 m 以内では、火気の使用を禁じる。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。<\/li><li>ロ・ハ：正（一般則第 55 条第 2 項）。所定の措置（第 6 条の 2 第 2 項）に適合する場合は 4 m になる。<\/li><\/ul><p>根拠：<a href=\"http://www.pref.mie.lg.jp/common/content/001065202.pdf\" target=\"_blank\" rel=\"noopener\">三重県 特定高圧ガスの消費の技術上の基準<\/a><\/p>"}, {"n": 4, "topic": "点検", "stmts": [["イ", "特定高圧ガスの消費設備は、1 日に 1 回以上、作動状況を点検する。"], ["ロ", "消費設備の点検は、1 年に 1 回行えば足りる。"], ["ハ", "点検で異常があったときは、補修などの措置を講じる。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正。<\/li><li>ロ：誤。1 年に 1 回以上は、定期自主検査の頻度（セット 12）。日常の点検とは別である。<\/li><\/ul><p>根拠：<a href=\"http://www.pref.mie.lg.jp/common/content/001065202.pdf\" target=\"_blank\" rel=\"noopener\">三重県 特定高圧ガスの消費の技術上の基準<\/a><\/p>"}, {"n": 5, "topic": "使用の開始時・終了時", "stmts": [["イ", "消費設備の使用を開始するときと終了するときは、設備などの異常の有無を点検する。"], ["ロ", "使用の開始時に点検していれば、終了時の点検は要らない。"], ["ハ", "特定高圧ガスの消費の技術上の基準は、一般則第 55 条などに定められている。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。開始時と終了時の両方で点検する。<\/li><li>ハ：正。液化石油ガスでは液石則第 53 条。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.mie.lg.jp/SHOBO/HP/HPG_consumer.htm\" target=\"_blank\" rel=\"noopener\">三重県 消費にかかる規制<\/a>、<a href=\"http://www.pref.mie.lg.jp/common/content/001065202.pdf\" target=\"_blank\" rel=\"noopener\">三重県 技術上の基準<\/a><\/p>"}, {"n": 6, "topic": "周知との関係", "stmts": [["イ", "特定高圧ガス消費者には、定期自主検査の義務がない。"], ["ロ", "特定高圧ガス消費者は、自ら届出と技術上の基準の遵守の義務を負う。"], ["ハ", "販売業者は、特定高圧ガス消費者に高圧ガスを販売するとき、周知をしなくてよい。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。特定高圧ガス消費者は、定期自主検査の義務がある者に含まれる（セット 12）。<\/li><li>ロ：正。<\/li><li>ハ：正（セット 06 問 6）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.okinawa.jp/_res/projects/default_project/_page_/001/012/100/00hannbaijigyou.pdf\" target=\"_blank\" rel=\"noopener\">沖縄県 販売事業の手引き<\/a>、<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201806-10.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 11 回<\/a><\/p>"}, {"n": 7, "topic": "廃棄の基準", "stmts": [["イ", "高圧ガスの廃棄は、容器とともに行ってはならない。"], ["ロ", "使い終わった容器は、中にガスが残っていても、そのまま一般の廃棄物として捨ててよい。"], ["ハ", "高圧ガスを容器ごと廃棄することは、法令違反になる。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正（一般則第 62 条など）。<\/li><li>ロ：誤。残ったガスが収集・処理の途中で漏れたり、容器が破裂したりするおそれがある。<\/li><\/ul><p>根拠：<a href=\"https://www.meti.go.jp/shingikai/sankoshin/hoan_shohi/koatsu_gas/pdf/029_02_00.pdf\" target=\"_blank\" rel=\"noopener\">経済産業省 高圧ガスの保安に係る注意喚起（2025 年 7 月）<\/a><\/p>"}, {"n": 8, "topic": "廃棄の規定の位置", "stmts": [["イ", "高圧ガスの廃棄に係る技術上の基準は、一般則では第 61 条・第 62 条に置かれている。"], ["ロ", "技術上の基準は、具体的な方法を一つに決める「仕様規定」から、達成すべき性能を定める「性能規定」に改められている。"], ["ハ", "廃棄の具体的な方法は、例示基準などで示されている。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正。技術上の基準は、2001 年の省令改正で性能規定に変わった。<\/li><\/ul><p>根拠：<a href=\"https://ja.wikipedia.org/wiki/%E4%B8%80%E8%88%AC%E9%AB%98%E5%9C%A7%E3%82%AC%E3%82%B9%E4%BF%9D%E5%AE%89%E8%A6%8F%E5%89%87\" target=\"_blank\" rel=\"noopener\">Wikipedia 一般高圧ガス保安規則<\/a>、<a href=\"https://www.khk.or.jp/Portals/0/resources/information/law/dl/kinouseikijun.pdf\" target=\"_blank\" rel=\"noopener\">KHK 例示基準 目次<\/a><\/p>"}, {"n": 9, "topic": "届出の期限の整理", "stmts": [["イ", "特定高圧ガス消費者の届出：消費開始の 20 日前まで"], ["ロ", "第二種製造者の届出：製造開始の 20 日前まで"], ["ハ", "販売事業の届出：事業開始の 20 日前まで"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正。届出制の手続きは、事前の届出が「20 日前まで」で統一されているものが多い。ただし、第二種貯蔵所は「あらかじめ」と案内されている（セット 05）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.mie.lg.jp/SHOBO/HP/HPG_consumer.htm\" target=\"_blank\" rel=\"noopener\">三重県<\/a>、<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/2seizou-seizoujigyou.html\" target=\"_blank\" rel=\"noopener\">宮城県 第二種製造事業届<\/a>、<a href=\"https://www.pref.yamaguchi.lg.jp/soshiki/7/14231.html\" target=\"_blank\" rel=\"noopener\">山口県 販売の手続き<\/a><\/p>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "特定高圧ガスの消費に関する届出は、事業者全体で 1 回行えばよい。"], ["ロ", "特定高圧ガス消費者は、消費のための施設について、技術上の基準に従わなければならない。"], ["ハ", "容器ごと廃棄する方法は、ガスが少量であれば認められている。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 2, "explain": "<ul><li>イ：誤。事業所ごとに届け出る。<\/li><li>ロ：正。<\/li><li>ハ：誤。量にかかわらず、容器とともに廃棄してはならない。<\/li><\/ul>"}]}, {"id": "09", "topic": "容器", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-09.md", "questions": [{"n": 1, "topic": "容器検査と刻印", "stmts": [["イ", "容器検査に合格し、刻印または標章の掲示がされている容器でなければ、譲渡し、または引き渡してはならない。"], ["ロ", "容器検査に合格していない容器でも、製造者が自ら刻印をすれば譲渡できる。"], ["ハ", "容器検査に合格した容器には、経済産業大臣・高圧ガス保安協会・指定容器検査機関が、速やかに刻印をしなければならない。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（第 44 条）。<\/li><li>ロ：誤。<\/li><li>ハ：正（第 45 条）。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/inspection_certification/container_accessories/container_inspec.html\" target=\"_blank\" rel=\"noopener\">KHK 容器検査<\/a>、<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201804-08.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 9 回<\/a><\/p>"}, {"n": 2, "topic": "表示", "stmts": [["イ", "表示をするのは、容器を製造した者の義務であり、所有者の義務ではない。"], ["ロ", "表示が消えたときも、遅滞なく表示をし直さなければならない。"], ["ハ", "容器の所有者は、容器に刻印等がされたときは、遅滞なく表示をしなければならない。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。表示は所有者の義務である。<\/li><li>ロ・ハ：正（第 46 条）。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201804-08.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 9 回<\/a>、<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/kisei/youki.html\" target=\"_blank\" rel=\"noopener\">経済産業省 容器に関する規制<\/a><\/p>"}, {"n": 3, "topic": "塗色", "stmts": [["イ", "酸素ガスの容器の塗色は黒色である。"], ["ロ", "アセチレンガスの容器の塗色はねずみ色である。"], ["ハ", "水素ガスの容器の塗色は赤色、液化炭酸ガスの容器の塗色は緑色である。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正。<\/li><li>ロ：誤。アセチレンはかっ色（褐色）である。<\/li><\/ul><p>根拠：<a href=\"https://klchem.co.jp/industry/siryo_2.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル 高圧ガス容器の圧力・塗色<\/a>、<a href=\"https://www.tps.sci.waseda.ac.jp/safety-gas/\" target=\"_blank\" rel=\"noopener\">早稲田大学 高圧ガスの基礎知識<\/a><\/p>"}, {"n": 4, "topic": "塗色のその他", "stmts": [["イ", "液化酸素の容器の塗色も、圧縮の酸素と同じ黒色である。"], ["ロ", "液化アンモニアの容器の塗色は白色である。"], ["ハ", "液化塩素の容器の塗色は黄色である。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。液化酸素の容器はねずみ色である。同じ酸素でも、圧縮と液化で塗色が違う。<\/li><li>ロ・ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://klchem.co.jp/industry/siryo_2.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル 塗色<\/a>、<a href=\"https://www.tps.sci.waseda.ac.jp/safety-gas/\" target=\"_blank\" rel=\"noopener\">早稲田大学<\/a><\/p>"}, {"n": 5, "topic": "充てんの条件", "stmts": [["イ", "容器に充てんする高圧ガスは、刻印等で示された種類のものでなければならない。"], ["ロ", "圧縮ガスは、刻印等で示された圧力以下で充てんする。"], ["ハ", "液化ガスは、刻印等で示された内容積に応じた質量以下で充てんする。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正（第 48 条）。液化ガスを質量で制限するのは、詰めすぎると温度が上がったとき液が膨張して容器いっぱいになり、急激に圧力が上がるからである。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201804-08.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 9 回<\/a><\/p>"}, {"n": 6, "topic": "附属品", "stmts": [["イ", "高圧ガスを充てんする容器には、附属品検査に合格した所定の附属品が装着されていなければならない。"], ["ロ", "附属品（バルブなど）には検査の制度はなく、容器本体だけが検査される。"], ["ハ", "容器検査に合格していれば、附属品が付いていなくても充てんできる。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正（第 48 条）。<\/li><li>ロ：誤。附属品にも附属品検査の制度があり、刻印がされる。<\/li><li>ハ：誤。<\/li><\/ul><p>根拠：<a href=\"https://klchem.co.jp/blog/2014/02/post-2237.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル 容器附属品検査の刻印<\/a>、<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201804-08.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 9 回<\/a><\/p>"}, {"n": 7, "topic": "容器再検査の期間", "stmts": [["イ", "溶接容器の容器再検査の期間は、製造後の経過年数が 20 年未満のものは 5 年、20 年以上のものは 2 年である。"], ["ロ", "一般継目なし容器の容器再検査の期間は 5 年である。"], ["ハ", "一般複合容器（医療用酸素用を除く）の容器再検査の期間は 3 年である。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正（容器保安規則第 24 条）。医療用酸素用の一般複合容器は 5 年。溶接容器は、古くなるほど腐食などの劣化が進むので、期間が短くなる。<\/li><\/ul><p>根拠：<a href=\"http://www.echoland-plus.com/gashou/youki/youki-24.html\" target=\"_blank\" rel=\"noopener\">echoland-plus 容器保安規則第 24 条<\/a>、<a href=\"https://klchem.co.jp/blog/2011/10/post-1601.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル 容器再検査の期間<\/a><\/p><p>注意：令和 8 年 6 月に改正が施行されたという情報がある。受験する年の条文で確かめること。<\/p>"}, {"n": 8, "topic": "再検査期間を過ぎた容器", "stmts": [["イ", "容器再検査の期間を過ぎた容器には、容器再検査に合格し、所定の刻印等がされるまで、高圧ガスを充てんしてはならない。"], ["ロ", "容器再検査の期間を過ぎても、中に高圧ガスが残っていれば、そのまま充てんを続けてよい。"], ["ハ", "容器再検査の期間は、すべての容器で一律に 5 年である。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。<\/li><li>ハ：誤。容器の種類と製造後の経過年数で違う（問 7）。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201804-08.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 9 回<\/a>、<a href=\"https://klchem.co.jp/blog/2016/10/35.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル<\/a><\/p>"}, {"n": 9, "topic": "くず化", "stmts": [["イ", "経済産業大臣は、容器検査に合格しなかった容器が、充てんするガスの種類や圧力を変えても規格に適合しないときは、所有者に対し、くず化その他容器として使用できないように処分すべきことを命じることができる。"], ["ロ", "くず化の命令は、容器の所有者ではなく、ガスを充てんした者に対して出される。"], ["ハ", "内容積 500 L 以下の容器についての、くず化などの命令の事務は、都道府県知事が行う。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（第 56 条第 1 項）。<\/li><li>ロ：誤。命令の相手は容器の所有者である。<\/li><li>ハ：正。政令によって都道府県知事が処理する事務とされている。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.saga.lg.jp/kiji0039977/3_9977_199472_up_40gskqkt.pdf\" target=\"_blank\" rel=\"noopener\">佐賀県 処分基準<\/a>、<a href=\"https://www.pref.aomori.lg.jp/kensei/jyourei/syobunkijyun/gyote_syobunkijyun_437.html\" target=\"_blank\" rel=\"noopener\">青森県 処分基準<\/a>、<a href=\"https://www.pref.mie.lg.jp/GYOHSEI/000070933.htm\" target=\"_blank\" rel=\"noopener\">三重県 処分基準<\/a><\/p>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "容器の表示は、塗色だけでよく、ガスの名称を書く必要はない。"], ["ロ", "塗色が「その他」に当たるガスの容器は、ねずみ色に塗る。"], ["ハ", "容器検査・刻印 → 表示 → 充てん → 容器再検査という流れで、容器の安全が確かめられる。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。表示には、塗色のほか、ガスの名称や、性質を示す文字（「燃」「毒」など）が含まれる。<\/li><li>ロ：正。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.tps.sci.waseda.ac.jp/safety-gas/\" target=\"_blank\" rel=\"noopener\">早稲田大学 高圧ガスの基礎知識<\/a>、<a href=\"https://klchem.co.jp/blog/2019/11/blog-7187.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル<\/a><\/p>"}]}, {"id": "10", "topic": "保安管理体制", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-10.md", "questions": [{"n": 1, "topic": "保安統括者", "stmts": [["イ", "第一種製造者は、事業所ごとに、保安統括者を選任しなければならない。"], ["ロ", "保安統括者には、甲種機械責任者免状の交付を受けている者を選任しなければならない。"], ["ハ", "保安統括者は、その事業所で事業の実施を統括管理する者をもって充てなければならない。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（第 27 条の 2 第 1 項）。<\/li><li>ロ：誤。保安統括者には免状は要らない。<\/li><li>ハ：正（第 27 条の 2 第 2 項）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.aichi.jp/site/koatsugas/seizou-hoankanri.html\" target=\"_blank\" rel=\"noopener\">愛知県 保安統括者等の選解任<\/a>、<a href=\"https://lawzilla.jp/law/326AC0000000204?n=ln27_2&amp;amp;mode=only\" target=\"_blank\" rel=\"noopener\">Lawzilla 第 27 条の 2<\/a><\/p>"}, {"n": 2, "topic": "保安技術管理者", "stmts": [["イ", "保安技術管理者は、保安係員を補佐して、現場の施設の維持を受け持つ者である。"], ["ロ", "保安技術管理者は、製造保安責任者免状の交付を受け、所定の製造の経験を持つ者から選任する。"], ["ハ", "保安技術管理者は、免状がなくても、事業所の長であれば選任できる。"]], "choices": ["イ", "ロ", "イ、ロ", "イ、ハ", "ロ、ハ"], "answer": 2, "explain": "<ul><li>イ：誤。保安技術管理者は、<strong>保安統括者<\/strong>を補佐して、技術的な事項を管理する。現場で施設を見るのは保安係員である。<\/li><li>ロ：正。<\/li><li>ハ：誤。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.ibaraki.jp/seikatsukankyo/shobo/sangyo/info/sangyohoan/koatsugastebiki/documents/honnbunn-2.pdf\" target=\"_blank\" rel=\"noopener\">茨城県 第一種製造者に係る申請・届出<\/a>、<a href=\"https://klchem.co.jp/blog/2024/08/blog-13197.php\" target=\"_blank\" rel=\"noopener\">川口液化ケミカル 保安統括者等の選任<\/a><\/p>"}, {"n": 3, "topic": "保安係員", "stmts": [["イ", "保安係員は、事業所ごとに 1 人選任すれば、すべての施設の区分を受け持てる。"], ["ロ", "保安係員は、製造保安責任者免状の交付を受け、所定の経験を持つ者から選任する。"], ["ハ", "保安係員は、製造のための施設の区分ごとに選任する。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。<\/li><li>ロ・ハ：正（第 27 条の 2 第 4 項）。<\/li><\/ul><p>根拠：<a href=\"https://lawzilla.jp/law/326AC0000000204?n=ln27_2&amp;amp;mode=only\" target=\"_blank\" rel=\"noopener\">Lawzilla 第 27 条の 2<\/a>、<a href=\"https://mame-tochan.com/security-management-organization/\" target=\"_blank\" rel=\"noopener\">まめとうちゃん 保安管理組織<\/a><\/p>"}, {"n": 4, "topic": "第二種製造者", "stmts": [["イ", "第二種製造者も、事業所ごとに保安統括者を選任しなければならない場合がある。"], ["ロ", "保安統括者の選任の規定は、第一種製造者にだけ適用され、第二種製造者には適用されない。"], ["ハ", "保安統括者を選任・解任したときは、遅滞なく都道府県知事に届け出る。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。条文は「第一種製造者及び第二種製造者」を対象にしている（省令で除かれる場合がある）。<\/li><li>ロ：誤。<\/li><li>ハ：正（第 27 条の 2 第 5 項）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.aichi.jp/site/koatsugas/seizou-hoankanri.html\" target=\"_blank\" rel=\"noopener\">愛知県<\/a>、<a href=\"https://www.city.nagoya.jp/bousai/shoubou/1013208/1011202/1011266/1033942/1011275.html\" target=\"_blank\" rel=\"noopener\">名古屋市 保安統括者等<\/a><\/p>"}, {"n": 5, "topic": "届出の時期", "stmts": [["イ", "保安統括者とその代理者の選任・解任は、そのつど遅滞なく届け出る。"], ["ロ", "保安係員の選任・解任は、選任した日から 20 日以内に届け出る。"], ["ハ", "保安技術管理者・保安係員の選任・解任は、前年 8 月 1 日から当年 7 月 31 日までの分をまとめて、期間終了後に遅滞なく届け出る。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/administration/high_pressure_gas/procedure01.html\" target=\"_blank\" rel=\"noopener\">KHK 高圧ガスの製造に係る申請手続き<\/a>、<a href=\"https://www.city.sendai.jp/hoan/download/bunyabetsu/koatsugas/sezojigyo/kanri.html\" target=\"_blank\" rel=\"noopener\">仙台市 保安管理体制<\/a><\/p><p>注意：保安技術管理者などの<strong>代理者<\/strong>の選任・解任について、KHK は届出不要としている。一方、群馬県は届出の対象に含めて案内しており、食い違いがある。試験では条文で確かめる。<\/p>"}, {"n": 6, "topic": "代理者", "stmts": [["イ", "代理者の制度は、保安係員には適用されない。"], ["ロ", "保安統括者・保安技術管理者・保安企画推進員に選任されている者は、他の保安統括者などの代理者を兼ねることができる場合がある。"], ["ハ", "第一種製造者は、保安統括者などの代理者をあらかじめ選任しておく。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。保安係員にも代理者がある。<\/li><li>ロ：正。<\/li><li>ハ：正（第 33 条）。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.gunma.jp/site/shinsei/12550.html\" target=\"_blank\" rel=\"noopener\">群馬県 保安統括者等代理者の届出<\/a>、<a href=\"https://www.pref.aichi.jp/site/koatsugas/seizou-hoankanri.html\" target=\"_blank\" rel=\"noopener\">愛知県<\/a><\/p>"}, {"n": 7, "topic": "保安係員の講習：初回", "stmts": [["イ", "保安係員には、製造保安責任者免状の交付を受けた日の属する年度の翌年度の開始の日から 3 年以内に、第 1 回の講習を受けさせる。"], ["ロ", "選任された日に、すでに免状の交付から 3 年が経過しているなどの場合は、選任された日から 6 月以内に講習を受けさせる。"], ["ハ", "講習の期限を数えるときの「年度」は、4 月 1 日から翌年 3 月 31 日までをいう。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ：正（第 27 条の 2 第 7 項）。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/qualification/examination_course/course_duty/system.html\" target=\"_blank\" rel=\"noopener\">KHK 法定義務講習の制度<\/a>、<a href=\"https://www.city.niigata.lg.jp/kurashi/bohan/shobo/oshirase/jigyosha/hoanfb20210901.html\" target=\"_blank\" rel=\"noopener\">新潟市 法定義務講習<\/a><\/p>"}, {"n": 8, "topic": "保安係員の講習：2 回目以降", "stmts": [["イ", "第 2 回の講習は、第 1 回の講習を受けた日の属する年度の翌年度の開始の日から 5 年以内に受けさせる。"], ["ロ", "講習は第 1 回だけ受ければよく、その後は不要である。"], ["ハ", "保安主任者にも、保安係員と同じく講習を受けさせる義務がある。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"http://oitalpg.or.jp/topics_content/upl/39-1.pdf\" target=\"_blank\" rel=\"noopener\">大分県 LP ガス協会 講習の時期<\/a>、<a href=\"https://www.khk.or.jp/qualification/examination_course/course_duty/system.html\" target=\"_blank\" rel=\"noopener\">KHK 法定義務講習<\/a><\/p>"}, {"n": 9, "topic": "保安企画推進員と認定高度保安実施者", "stmts": [["イ", "保安企画推進員は、選任された日から 6 月以内に第 1 回の講習を受ける必要がある。"], ["ロ", "認定高度保安実施者は、保安主任者・保安企画推進員の選任・解任について、届出を要しない特例がある。"], ["ハ", "保安企画推進員にも、保安主任者・保安係員と同じく、法定の講習の制度がある。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ：正（第 27 条の 3 第 3 項で準用）。<\/li><li>ロ：正。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.city.niigata.lg.jp/kurashi/bohan/shobo/oshirase/jigyosha/hoanfb20210901.html\" target=\"_blank\" rel=\"noopener\">新潟市 法定義務講習<\/a>、<a href=\"https://www.japaneselawtranslation.go.jp/ja/laws/view/4555/ja\" target=\"_blank\" rel=\"noopener\">日本法令外国語訳データベース 高圧ガス保安法<\/a><\/p>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "保安統括者は免状不要、保安技術管理者は甲種の免状、保安係員は甲種・乙種・丙種化学などの免状で選任できる。"], ["ロ", "保安統括者の選任・解任の届出は、年に 1 回まとめて行えばよい。"], ["ハ", "保安技術管理者は保安統括者を補佐し、保安係員は施設の区分ごとに置かれる。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。保安係員に選任できる免状は、甲種化学・甲種機械・乙種化学・乙種機械・丙種化学など。<\/li><li>ロ：誤。年 1 回まとめて届け出るのは、保安技術管理者や保安係員などである。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.gunma.jp/site/shinsei/12547.html\" target=\"_blank\" rel=\"noopener\">群馬県 保安技術管理者等届<\/a>、<a href=\"https://www.khk.or.jp/administration/high_pressure_gas/procedure01.html\" target=\"_blank\" rel=\"noopener\">KHK<\/a><\/p>"}]}, {"id": "11", "topic": "危害予防規程・保安教育", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-11.md", "questions": [{"n": 1, "topic": "危害予防規程の届出", "stmts": [["イ", "第一種製造者は、危害予防規程を定め、都道府県知事に届け出なければならない。"], ["ロ", "危害予防規程は、定めておけばよく、届け出る必要はない。"], ["ハ", "危害予防規程を変更したときも、都道府県知事に届け出なければならない。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正（第 26 条第 1 項）。<\/li><li>ロ：誤。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.okinawa.lg.jp/shigoto/keizai/1009879/1024873/1012108.html\" target=\"_blank\" rel=\"noopener\">沖縄県 危害予防規程<\/a>、<a href=\"https://www.pref.miyagi.jp/soshiki/syoubou/1seizou-kitei.html\" target=\"_blank\" rel=\"noopener\">宮城県 危害予防規程届<\/a><\/p>"}, {"n": 2, "topic": "危害予防規程の記載事項", "stmts": [["イ", "危害予防規程には、保安管理体制と保安統括者などの職務の範囲を記載する。"], ["ロ", "危害予防規程には、製造設備の安全な運転・操作、巡視・点検、危険時の措置と訓練などを記載する。"], ["ハ", "危害予防規程には、協力会社の作業の管理や、従業者への周知・教育の方法も記載する。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.okinawa.lg.jp/shigoto/keizai/1009879/1024873/1012108.html\" target=\"_blank\" rel=\"noopener\">沖縄県 危害予防規程<\/a>、<a href=\"https://www.pref.niigata.lg.jp/sec/shobo/1203008460314.html\" target=\"_blank\" rel=\"noopener\">新潟県 危害予防規程届<\/a><\/p>"}, {"n": 3, "topic": "危害予防規程の様式", "stmts": [["イ", "危害予防規程の記載事項は、事業者が自由に決めてよく、法令の定めはない。"], ["ロ", "一般則の逐条解説では、危害予防規程に記載すべき事項が第 1 号から第 12 号まで示されている。"], ["ハ", "危害予防規程の届出の様式や添付書類は、一般則第 63 条に定められている。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。記載すべき事項は省令で定められている。<\/li><li>ロ・ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/files/20220328chikujo3_ippansoku7_4.pdf\" target=\"_blank\" rel=\"noopener\">経済産業省 一般則の逐条解説<\/a><\/p>"}, {"n": 4, "topic": "保安教育計画：第一種製造者", "stmts": [["イ", "第一種製造者は、その従業者に対する保安教育計画を定めなければならない。"], ["ロ", "第一種製造者は、保安教育計画を都道府県知事に届け出なければならない。"], ["ハ", "第一種製造者は、保安教育計画を忠実に実行しなければならない。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（第 27 条第 1 項）。<\/li><li>ロ：誤。届出は平成 12 年の改正で廃止された。<\/li><li>ハ：正（第 27 条第 3 項）。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201711-14.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 4 回<\/a>、<a href=\"https://lawzilla.jp/law/326AC0000000204?n=ln27&amp;amp;mode=only\" target=\"_blank\" rel=\"noopener\">Lawzilla 第 27 条<\/a><\/p>"}, {"n": 5, "topic": "保安教育：第二種製造者など", "stmts": [["イ", "第二種製造者は、その従業者に保安教育を施さなければならない。"], ["ロ", "第二種製造者は、保安教育計画を定めて知事に届け出なければならない。"], ["ハ", "第二種製造者には、保安教育の義務はない。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 1, "explain": "<ul><li>イ：正（第 27 条第 4 項）。<\/li><li>ロ：誤。第二種製造者に、計画を定める義務はない。<\/li><li>ハ：誤。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201711-14.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 4 回<\/a><\/p>"}, {"n": 6, "topic": "知事の権限", "stmts": [["イ", "都道府県知事は、保安教育計画について何の権限も持たない。"], ["ロ", "都道府県知事は、第一種製造者が保安教育計画を忠実に実行していないときなどには、勧告することができる。"], ["ハ", "都道府県知事は、保安教育計画が公共の安全の維持または災害の発生の防止上十分でないと認めるときは、その変更を命じることができる。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。<\/li><li>ロ：正（第 27 条第 5 項）。<\/li><li>ハ：正（第 27 条第 2 項）。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201711-14.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 4 回<\/a><\/p>"}, {"n": 7, "topic": "KHK の役割", "stmts": [["イ", "高圧ガス保安協会は、保安教育計画の策定や教育の実施の基準となる事項を公表している。"], ["ロ", "高圧ガス保安協会は、事業者ごとに保安教育計画を承認する。"], ["ハ", "高圧ガス保安協会が公表する事項は、事業者が保安教育計画を作るときの参考になる。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（第 27 条第 6 項）。<\/li><li>ロ：誤。KHK は承認しない。計画を定めるのは事業者自身である。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201711-14.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 4 回<\/a>、<a href=\"https://www.khk.or.jp/Portals/0/khk/hpg/hpg_div/2021/Public%20Comment20220113/3Draft2%20KHKS%201801-2.pdf\" target=\"_blank\" rel=\"noopener\">KHK 保安教育計画の指針（案）<\/a><\/p>"}, {"n": 8, "topic": "届出の制度の変化", "stmts": [["イ", "届出が廃止されたので、保安教育計画を定める義務もなくなった。"], ["ロ", "届出が廃止された後も、保安教育計画を定めて忠実に実行する義務は残っている。"], ["ハ", "保安教育計画の届出は、平成 12 年の改正で廃止された。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。<\/li><li>ロ・ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201711-14.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 4 回<\/a><\/p>"}, {"n": 9, "topic": "大規模地震対策", "stmts": [["イ", "一部の事業所では、危害予防規程に、大規模地震に係る防災・減災対策などを記載する必要がある。"], ["ロ", "危害予防規程は、地震などの災害を想定せず、平常時の運転のことだけを記載すればよい。"], ["ハ", "危害予防規程には、危険時の措置と訓練に関することを記載する。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.okinawa.lg.jp/shigoto/keizai/1009879/1024873/1012108.html\" target=\"_blank\" rel=\"noopener\">沖縄県 危害予防規程<\/a><\/p>"}, {"n": 10, "topic": "総合", "stmts": [["イ", "危害予防規程：第一種製造者が定めて届け出る。保安教育計画：第一種製造者が定めて実行する（届出不要）。"], ["ロ", "第二種製造者は、危害予防規程を届け出なければならない。"], ["ハ", "保安教育は、第一種製造者だけでなく第二種製造者にも義務がある。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正。<\/li><li>ロ：誤。危害予防規程の届出は、第一種製造者の義務である。<\/li><li>ハ：正。<\/li><\/ul>"}]}, {"id": "12", "topic": "保安検査・定期自主検査・認定高度保安実施者", "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-f6cae4a9-q43ilw/gas-tech/koatsu-koukikai/law-set-12.md", "questions": [{"n": 1, "topic": "保安検査の原則", "stmts": [["イ", "第一種製造者は、特定施設について、定期に、都道府県知事が行う保安検査を受けなければならない。"], ["ロ", "保安検査は、施設の使用を始める前に 1 回受ければ、その後は不要である。"], ["ハ", "保安検査は、原則として、前回の保安検査の日から 1 年を超えない日までに受ける。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ：正（第 35 条）。<\/li><li>ロ：誤。使用前の 1 回は完成検査で、保安検査は使用開始後に定期に受ける。<\/li><li>ハ：正。告示で定める施設は告示の期間になる。<\/li><\/ul><p>根拠：<a href=\"https://www.city.nagoya.jp/bousai/shoubou/1013208/1011202/1011266/1033942/1011279.html\" target=\"_blank\" rel=\"noopener\">名古屋市 保安検査<\/a>、<a href=\"https://www.pref.ibaraki.jp/seikatsukankyo/shobo/sangyo/info/sangyohoan/koatsugastebiki/documents/hpgtebiki-tokutei-04.pdf\" target=\"_blank\" rel=\"noopener\">茨城県 保安検査<\/a><\/p>"}, {"n": 2, "topic": "KHK・指定保安検査機関", "stmts": [["イ", "指定保安検査機関で保安検査を受けた場合は、知事への届出は要らない。"], ["ロ", "指定保安検査機関は、経済産業大臣が指定する。"], ["ハ", "高圧ガス保安協会または指定保安検査機関が行う保安検査を受け、その旨を都道府県知事に届け出た場合は、知事の保安検査を受けなくてよい。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。KHK や指定保安検査機関で受けたときも、その旨を知事に届け出る。<\/li><li>ロ：正。<\/li><li>ハ：正。<\/li><\/ul><p>根拠：<a href=\"https://www.safety-kanto.meti.go.jp/hipregas/h_shiteikikan.html\" target=\"_blank\" rel=\"noopener\">関東東北産業保安監督部 指定保安検査機関<\/a>、<a href=\"https://www.meti.go.jp/policy/safety_security/industrial_safety/sangyo/hipregas/shiteikikan/index.html\" target=\"_blank\" rel=\"noopener\">経済産業省 指定完成検査機関等一覧<\/a>、<a href=\"https://www.pref.ibaraki.jp/seikatsukankyo/shobo/sangyo/info/sangyohoan/koatsugastebiki/documents/hpgtebiki-tokutei-04.pdf\" target=\"_blank\" rel=\"noopener\">茨城県 保安検査<\/a><\/p>"}, {"n": 3, "topic": "保安検査の時期の幅", "stmts": [["イ", "保安検査の時期には、「基準日」の前後 1 か月以内に受ければ、基準日に受けたものとみなす扱いがある。"], ["ロ", "保安検査は、基準日ちょうどの日に受けなければならず、前後の幅はない。"], ["ハ", "基準日の扱いは、2017 年の省令改正で加えられた。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正。<\/li><li>ロ：誤。<\/li><\/ul><p>根拠：<a href=\"https://www.pref.ibaraki.jp/seikatsukankyo/shobo/sangyo/info/sangyohoan/koatsugastebiki/documents/hpgtebiki-tokutei-04.pdf\" target=\"_blank\" rel=\"noopener\">茨城県 保安検査<\/a><\/p>"}, {"n": 4, "topic": "定期自主検査の対象", "stmts": [["イ", "第一種製造者は、定期自主検査を行わなければならない。"], ["ロ", "特定高圧ガス消費者は、定期自主検査を行わなければならない。"], ["ハ", "1 日に製造する高圧ガスの容積が 30 m³ 以上である第二種製造者は、定期自主検査を行わなければならない。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 5, "explain": "<ul><li>イ・ロ・ハ：すべて正。このほか、認定を受けた指定設備を使う第二種製造者も対象になる。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201806-10.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 11 回<\/a><\/p>"}, {"n": 5, "topic": "定期自主検査の頻度と内容", "stmts": [["イ", "定期自主検査は、5 年に 1 回行えば足りる。"], ["ロ", "定期自主検査では、施設が技術上の基準（耐圧試験に係るものを除く）に適合しているかを確かめる。"], ["ハ", "定期自主検査は、1 年（経済産業大臣が定める設備・施設は大臣が定める期間）に 1 回以上行う。"]], "choices": ["イ", "ハ", "イ、ロ", "ロ、ハ", "イ、ロ、ハ"], "answer": 4, "explain": "<ul><li>イ：誤。<\/li><li>ロ・ハ：正（一般則第 83 条）。<\/li><\/ul><p>根拠：<a href=\"https://lawzilla.jp/law/341M50000400053?n=ln83&amp;amp;mode=only\" target=\"_blank\" rel=\"noopener\">Lawzilla 一般則第 83 条<\/a>、<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201806-10.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 11 回<\/a><\/p>"}, {"n": 6, "topic": "定期自主検査の記録と体制", "stmts": [["イ", "定期自主検査を行ったときは、検査記録を作成し、保存しなければならない。"], ["ロ", "定期自主検査の結果は、毎回、都道府県知事の承認を受けなければならない。"], ["ハ", "第一種製造者・第二種製造者が定期自主検査を行うときは、保安係員（選任が必要な場合）に検査の実施を監督させる。"]], "choices": ["イ", "ロ", "イ、ハ", "ロ、ハ", "イ、ロ、ハ"], "answer": 3, "explain": "<ul><li>イ・ハ：正。<\/li><li>ロ：誤。<\/li><\/ul><p>根拠：<a href=\"https://www.khk.or.jp/Portals/0/khk/info/journal/2018/201806-10.pdf\" target=\"_blank\" rel=\"noopener\">KHK 基礎シリーズ第 11 回<\/a><\/p>"}, {"n": 7, "topic": "保安検査と定期自主検査の関係", "stmts": [["イ", "保安検査を受ければ、定期自主検査は要らない。"], ["ロ", "県が行う保安検査は、事業者が実施した定期自主検査の結果をもとに行われる。"], ["ハ", "保安検査と定期
