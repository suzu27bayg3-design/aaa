<style>
/* Layout: one narrow exam-sheet column; set chips on top, one question card at a time, 3肢択一 ア・イ・ウ (実技は○×も). */
:root {
  --bg: #F3F3F7;
  --surface: #FFFFFF;
  --ink: #1C1F2E;
  --muted: #5D6275;
  --line: #D6D8E2;
  --accent: #2E3A78;
  --accent-soft: #E6E8F5;
  --seal: #C23A22;
  --ok: #1D7447;
  --ok-soft: #E2F3E9;
  --ng: #B8460E;
  --ng-soft: #FBEBE1;
  --f-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12131B; --surface: #1B1D29; --ink: #E7E8F0; --muted: #A0A4B8; --line: #2F3245;
    --accent: #9DAAF0; --accent-soft: #232848; --seal: #F07A62;
    --ok: #52C48D; --ok-soft: #173326; --ng: #F39461; --ng-soft: #3A2318;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12131B; --surface: #1B1D29; --ink: #E7E8F0; --muted: #A0A4B8; --line: #2F3245;
  --accent: #9DAAF0; --accent-soft: #232848; --seal: #F07A62;
  --ok: #52C48D; --ok-soft: #173326; --ng: #F39461; --ng-soft: #3A2318;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 680px; margin: 0 auto; display: grid; gap: 20px; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header { display: grid; gap: 6px; }
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.seal {
  font-family: var(--f-display); font-weight: 700; color: var(--seal);
  border: 2px solid var(--seal); border-radius: 4px; padding: 0 8px; letter-spacing: .12em; font-size: 15px; line-height: 1.6;
  background: var(--surface);
}
h1 { font-family: var(--f-display); font-weight: 700; font-size: 26px; margin: 0; text-wrap: balance; letter-spacing: .02em; }
.lede { margin: 0; color: var(--muted); font-size: 14px; }

.sets { display: grid; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row .lab { font-size: 12px; color: var(--muted); letter-spacing: .08em; min-width: 2.6em; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 14px; cursor: pointer; font-size: 14px; display: inline-flex; gap: 8px; align-items: baseline;
}
.chip .no { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.chip .sc { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip[aria-pressed="true"] .no, .chip[aria-pressed="true"] .sc { color: var(--surface); opacity: .85; }
.chip:disabled { opacity: .45; cursor: default; }

.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.meter { flex: 1 1 160px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 120px; }
.meter > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }
.count { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.qhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.qno { font-family: var(--f-display); font-weight: 700; font-size: 20px; }
.qtopic { color: var(--muted); font-size: 14px; }
.qsrc { margin-left: auto; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.ask { margin: 0; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.box { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 10px 14px; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.box summary { cursor: pointer; font-weight: 700; font-family: var(--f-display); color: var(--accent); }
.box p, .box ul { margin: 8px 0 0; }

.choices { display: grid; gap: 10px; }
.choices.ox { grid-template-columns: 1fr 1fr; }
.opt {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; cursor: pointer;
  display: grid; grid-template-columns: 2em 1fr; gap: 12px; align-items: start; text-align: left;
  transition: border-color .15s, background .15s; min-width: 0;
}
.opt .k {
  font-family: var(--f-display); font-weight: 700; width: 2em; height: 2em; display: grid; place-items: center;
  border: 1.5px solid var(--ink); border-radius: 4px; line-height: 1;
}
.opt .t { min-width: 0; overflow-wrap: anywhere; font-size: 15px; }
.choices.ox .opt { grid-template-columns: 1fr; justify-items: center; min-height: 64px; align-content: center; }
.choices.ox .opt .t { font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--ng); background: var(--ng-soft); }
.opt.dim { opacity: .5; }

.verdict { display: flex; gap: 10px; align-items: center; font-weight: 700; font-family: var(--f-display); font-size: 18px; }
.verdict .mark { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--surface); font-size: 16px; flex: none; }
.verdict.ok { color: var(--ok); } .verdict.ok .mark { background: var(--ok); }
.verdict.ng { color: var(--ng); } .verdict.ng .mark { background: var(--ng); }
.explain { border-top: 1px dashed var(--line); padding-top: 12px; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.explain p, .explain ul { margin: 0 0 8px; }
.explain ul, .box ul { padding-left: 1.2em; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.btn { border: 1.5px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 8px; padding: 10px 18px; cursor: pointer; font-weight: 700; }
.btn.ghost { background: transparent; color: var(--accent); }

.result { text-align: center; display: grid; gap: 10px; justify-items: center; }
.score { font-family: var(--f-display); font-weight: 700; font-size: 44px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.score small { font-size: 18px; color: var(--muted); }
.pass { font-size: 14px; color: var(--muted); margin: 0; }
.pass b { color: var(--ok); } .pass b.ng { color: var(--ng); }
.missed { width: 100%; text-align: left; display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.missed li { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.missed .k { font-family: var(--f-mono); color: var(--muted); margin-right: 8px; }

footer { font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
footer p { margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const SETS = [{"id": "01", "kind": "学科", "topic": "特許法 I（発明・特許要件・出願）", "principle": "<p>特許制度は「技術を公開する代わりに、一定期間の独占を認める」仕組みです（公開代償説、<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法1条<\/a>）。だから保護されるのは、まだ世に出ていない（新規性）、簡単には思いつかない（進歩性）技術だけで、出願から1年6月で内容が公開されます。誰が先に権利を持つかは「先に出願した者」で決めます（先願主義）。発明した日は証明しにくいので、出願日という客観的な日付を基準にしているのです。<\/p>", "questions": [{"topic": "発明の定義", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["数学の計算方法そのものは、特許法上の発明に該当する。", "特許法上の発明とは、自然法則を利用した技術的思想の創作のうち高度のものをいう。", "エネルギー保存則に反するいわゆる永久機関も、特許法上の発明に該当する。"], "answer": 2, "explain": "<ul><li>イ：正。発明の定義そのもの（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法2条1項<\/a>）。<\/li><li>ア：誤。計算方法そのものは自然法則を「利用」していない。<\/li><li>ウ：誤。自然法則に反するものは、自然法則を利用しているとはいえない。<\/li><\/ul><p>原理：特許は「産業」の発達のための制度なので、自然法則を使って再現できる技術だけを保護する。<\/p>", "n": 1}, {"topic": "産業上の利用可能性", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["医師が行う人間の手術方法は、特許を受けることができる。", "医薬品そのものは、人の病気を治療するものなので特許を受けることができない。", "人間を手術、治療または診断する方法は、産業上利用することができる発明に該当しないものとして扱われる。"], "answer": 3, "explain": "<ul><li>ウ：正。特許・実用新案審査基準（第III部第1章）の扱い。医師の医療行為を特許で縛らないという政策判断による（<a href=\"https://www.jpo.go.jp/system/laws/rule/guideline/patent/tukujitu_kijun/index.html\" target=\"_blank\" rel=\"noopener\">特許庁 審査基準<\/a>）。<\/li><li>ア：誤（ウを参照）。<\/li><li>イ：誤。医薬品や医療機器という「物」は特許を受けられる。除かれるのは人間に対する医療行為の「方法」。<\/li><\/ul>", "n": 2}, {"topic": "新規性喪失の例外", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["自ら学会で発表した発明は、発表日から6月以内に出願しなければ、例外の適用を受けられない。", "自ら学会で発表した発明でも、発表日から1年以内に所定の手続をとって出願すれば、その発表によって新規性を失わなかったものとみなされる。", "新規性喪失の例外の適用を受けると、出願日が発表日までさかのぼる。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法30条2項・3項<\/a>）。例外適用の書面は出願と同時に出し、証明書は出願日から30日以内に出す。2018年改正で6月から1年に延長された。<\/li><li>ア：誤。6月は改正前の期間。<\/li><li>ウ：誤。出願日はさかのぼらない。発表から出願までの間に他人が同じ発明を出願すると、その他人の出願が先願になるおそれがある。<\/li><\/ul><p>原理：例外はあくまで救済。原則どおり、公表する前に出願するのが最も安全。<\/p>", "n": 3}, {"topic": "進歩性", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["新規性がある発明であれば、必ず特許を受けることができる。", "その発明の属する技術分野の通常の知識を有する者（当業者）が、出願前の公知の発明に基づいて容易に発明できたときは、特許を受けることができない。", "進歩性の有無は、技術の知識を持たない一般人を基準に判断される。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法29条2項<\/a>）。<\/li><li>ア：誤。新規性に加えて進歩性なども必要。<\/li><li>ウ：誤。判断の基準は「当業者」。<\/li><\/ul><p>原理：誰でも簡単に思いつく改良に独占権を与えると、かえって技術の進歩を妨げる。<\/p>", "n": 4}, {"topic": "先願主義", "ask": "同一の発明について、甲と乙が同じ日に別々に特許出願をした。次の記述のうち、最も適切なものはどれか。", "choices": ["先に発明を完成させた者が特許を受けることができる。", "特許庁長官が行うくじにより定めた一方のみが特許を受けることができる。", "甲と乙の協議により定めた一方のみが特許を受けることができ、協議が成立しないときは、いずれも特許を受けることができない。"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法39条2項<\/a>）。<\/li><li>ア：誤。日本は先発明主義ではなく先願主義。<\/li><li>イ：誤。くじで決めるのは<strong>商標<\/strong>の同日出願（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000127\" target=\"_blank\" rel=\"noopener\">商標法8条5項<\/a>）。特許・意匠と混同しない。<\/li><\/ul>", "n": 5}, {"topic": "出願書類", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["特許出願の願書には、明細書・特許請求の範囲・必要な図面・要約書を添付する。", "特許請求の範囲は、審査の段階になってから提出すればよい。", "図面は、どの特許出願でも必ず添付しなければならない。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法36条2項<\/a>）。<\/li><li>イ：誤。特許請求の範囲は出願時に必要。権利の範囲はここに書いた内容で決まる（70条1項）。<\/li><li>ウ：誤。図面は「必要な」場合に添付する。<\/li><\/ul>", "n": 6}, {"topic": "出願審査請求", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["出願審査請求は、特許出願人だけが行うことができる。", "出願日から3年以内に出願審査請求をしないと、その特許出願は取り下げたものとみなされる。", "出願審査請求は、出願日から5年以内に行えばよい。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法48条の3第1項・第4項<\/a>）。<\/li><li>ア：誤。審査請求は<strong>何人も<\/strong>できる。<\/li><li>ウ：誤。3年。<\/li><\/ul><p>原理：出願人に権利化するか様子を見るかを決める猶予を与え、権利化の必要がない出願は審査しないで済ませるための制度。<\/p>", "n": 7}, {"topic": "出願公開", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["特許出願は、原則として出願日から1年6月を経過したときに出願公開される。", "特許出願は、出願審査請求があったときに直ちに出願公開される。", "出願人は、出願公開の時期を早めるよう請求することはできない。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法64条1項<\/a>）。<\/li><li>イ：誤。審査請求と出願公開は無関係。<\/li><li>ウ：誤。出願公開の請求（早期公開）ができる（64条の2）。<\/li><\/ul>", "n": 8}, {"topic": "国内優先権", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["先の特許出願の日から1年以内であれば、その出願に記載した発明を改良した内容を含めて、先の出願に基づく優先権を主張して特許出願できる。", "国内優先権の主張は、先の出願の日から2年以内であればできる。", "国内優先権を主張しても、先の出願は取り下げられずに審査が続く。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法41条1項<\/a>）。<\/li><li>イ：誤。1年以内。<\/li><li>ウ：誤。先の出願は、その出願日から1年4月を経過した時に取り下げたものとみなされる（42条1項）。<\/li><\/ul><p>原理：基本発明を出願した後に改良が生まれても、まとめて1つの出願にできるようにする制度。<\/p>", "n": 9}, {"topic": "拒絶査定不服審判", "ask": "拒絶査定を受けた特許出願人が拒絶査定不服審判を請求できる期間として、最も適切なものはどれか。", "choices": ["拒絶査定の謄本の送達があった日から30日以内", "拒絶査定の謄本の送達があった日から3月以内", "拒絶査定の謄本の送達があった日から6月以内"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法121条1項<\/a>）。2014年改正で30日から3月に延長された。<\/li><li>ア・ウ：誤。<\/li><\/ul>", "n": 10}], "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-93e11681-sex295/chizai3/set-01.md"}, {"id": "02", "kind": "学科", "topic": "特許法 II（特許権・実施権・侵害）", "principle": "<p>特許権は「業として特許発明を実施する権利を専有する」権利です（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法68条<\/a>）。自分で使えるだけでなく、他人の実施を止められる独占権なので、移転や専用実施権は登録して公に示さないと効力を生じません。一方、侵害者には過失が推定されます。権利の内容は特許公報で公示されているので、事業者は調べるべきだという考え方です。<\/p>", "questions": [{"topic": "存続期間", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["特許権の存続期間は、設定登録の日から20年をもって終了する。", "特許権の存続期間は、特許出願の日から20年をもって終了する。ただし、医薬品等については延長登録の出願により最長5年延長できる場合がある。", "特許権の存続期間は、特許出願の日から25年をもって終了する。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法67条1項・4項<\/a>）。医薬品は安全性審査（薬機法の承認）のあいだ実施できない期間があるため、その分の延長が認められる。<\/li><li>ア：誤。起算点は出願日。<\/li><li>ウ：誤。25年は意匠権（出願日から）。<\/li><\/ul>", "n": 1}, {"topic": "職務発明", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["従業者がした発明は、すべて職務発明となる。", "契約・勤務規則等であらかじめ使用者に特許を受ける権利を取得させることを定めたときは、その特許を受ける権利は、発生した時から使用者に帰属する。", "職務発明について従業者が特許を受けたとき、使用者はその特許権について無償の専用実施権を有する。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法35条3項<\/a>）。権利を取得させた従業者は「相当の利益」を受ける権利を持つ（35条4項）。<\/li><li>ア：誤。職務発明は「使用者の業務範囲に属し」「従業者の現在または過去の職務に属する」発明に限られる（35条1項）。<\/li><li>ウ：誤。使用者が持つのは<strong>通常実施権<\/strong>（35条1項）。<\/li><\/ul>", "n": 2}, {"topic": "専用実施権・通常実施権", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["通常実施権は、登録しなければ、その後に特許権を取得した者に対抗することができない。", "専用実施権の設定は、登録しなければその効力を生じない。", "専用実施権を設定した後も、特許権者はその範囲内で自由に特許発明を実施できる。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法98条1項2号<\/a>）。<\/li><li>ア：誤。2011年改正の<strong>当然対抗制度<\/strong>で、通常実施権は登録しなくても第三者に対抗できる（99条）。<\/li><li>ウ：誤。専用実施権を設定した範囲では、特許権者も実施できない（68条ただし書）。<\/li><\/ul><p>原理：専用実施権は独占的な権利なので登録で公示する。通常実施権は「実施しても訴えない」という権利にすぎない。<\/p>", "n": 3}, {"topic": "侵害に対する救済", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["差止請求をするには、侵害者に故意または過失があることが必要である。", "特許権侵害については、刑事罰は定められていない。", "他人の特許権を侵害した者は、その侵害行為について過失があったものと推定される。"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法103条<\/a>）。<\/li><li>ア：誤。差止請求（100条）に故意・過失は不要。必要なのは損害賠償請求（民法709条）。<\/li><li>イ：誤。侵害罪がある（196条：10年以下の拘禁刑もしくは1,000万円以下の罰金、またはその併科）。<\/li><\/ul>", "n": 4}, {"topic": "特許料", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["特許料は、出願時に存続期間の全期間分を一括で納付しなければならない。", "第4年以後の各年分の特許料を納付期限までに納付せず、追納期間内にも納付しなかったときは、特許権は消滅したものとみなされる。", "特許料を納付しなくても、特許権は存続期間満了まで存続する。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法112条<\/a>）。追納期間は納付期限経過後6月以内（割増特許料が必要）。<\/li><li>ア：誤。第1年から第3年分は特許査定の謄本送達日から30日以内に一時に納付し（108条1項）、第4年以後は前年以前に納付する（108条2項）。<\/li><li>ウ：誤。<\/li><\/ul>", "n": 5}, {"topic": "特許権の共有", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["共有に係る特許権の各共有者は、他の共有者の同意を得なければ、自ら特許発明を実施できない。", "共有に係る特許権の各共有者は、他の共有者の同意を得なければ、その持分を譲渡したり、他人に通常実施権を許諾したりできない。", "共有に係る特許権の各共有者は、他の共有者の同意を得なくても、専用実施権を設定できる。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法73条1項・3項<\/a>）。<\/li><li>ア：誤。契約で別段の定めがない限り、各共有者は同意なく自ら実施できる（73条2項）。<\/li><li>ウ：誤（73条3項）。<\/li><\/ul><p>原理：誰に持分や実施権が渡るかは、他の共有者の利益（競合の増加）に直結するので、同意が必要になる。<\/p>", "n": 6}, {"topic": "特許権の効力が及ばない範囲", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["試験または研究のためにする特許発明の実施には、特許権の効力は及ばない。", "特許製品を外国から輸入する行為には、特許権の効力は及ばない。", "特許権の効力は、業として行う実施だけでなく、個人が家庭内で行う実施にも及ぶ。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法69条1項<\/a>）。研究を止めると技術の進歩という制度目的に反するため。<\/li><li>イ：誤。輸入も「実施」に含まれる（2条3項）。<\/li><li>ウ：誤。特許権は「業として」の実施を専有する権利（68条）。<\/li><\/ul>", "n": 7}, {"topic": "特許権の移転", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["特許権の譲渡は、当事者間の契約だけで効力を生じ、登録は不要である。", "特許権は一身専属の権利なので、譲渡できない。", "特許権の移転（相続その他の一般承継によるものを除く）は、登録しなければ効力を生じない。"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法98条1項1号<\/a>）。相続などの一般承継の場合は、遅滞なく特許庁長官に届け出る（98条2項）。<\/li><li>ア・イ：誤。<\/li><\/ul>", "n": 8}, {"topic": "特許無効審判", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["特許無効審判は、何人も請求することができる。", "特許権が消滅した後は、特許無効審判を請求することはできない。", "特許を無効にすべき旨の審決が確定したときは、特許権は初めから存在しなかったものとみなされる。"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法125条<\/a>）。<\/li><li>ア：誤。請求できるのは利害関係人（123条2項）。何人もできるのは特許異議の申立て（113条：特許掲載公報発行日から6月以内）。<\/li><li>イ：誤。消滅後も請求できる（123条3項）。過去の侵害について損害賠償を請求されている場合などに意味がある。<\/li><\/ul>", "n": 9}, {"topic": "損害額の推定", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["侵害者が侵害行為により利益を受けているときは、その利益の額は、特許権者が受けた損害の額と推定される。", "損害賠償は、差止請求と同時でなければ請求できない。", "特許権侵害による損害賠償請求権には、時効がない。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法102条2項<\/a>）。損害額の立証は難しいため、推定規定で権利者の負担を軽くしている。<\/li><li>イ：誤。それぞれ別に請求できる。<\/li><li>ウ：誤。民法724条の消滅時効（損害と加害者を知った時から3年など）が適用される。<\/li><\/ul>", "n": 10}], "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-93e11681-sex295/chizai3/set-02.md"}, {"id": "03", "kind": "学科", "topic": "実用新案法・意匠法", "principle": "<p>実用新案は「小発明」を早く安く保護するため、実体審査をせずに登録します。その代わり、権利を行使するときは実用新案技術評価書を示して警告する必要があります。意匠は物品などの「見た目」の創作を保護する創作法で、新規性と創作非容易性が要件です。デザインは模倣されやすく、流行で寿命も短いので、類似範囲まで効力が及び、関連意匠・秘密意匠などの独自の制度があります。<\/p>", "questions": [{"topic": "実用新案の対象と権利行使", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["物の製造方法も、実用新案登録の対象となる。", "実用新案権者は、実用新案技術評価書を提示して警告をした後でなければ、侵害者に対して権利を行使することができない。", "実用新案権の存続期間は、出願の日から20年である。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000123\" target=\"_blank\" rel=\"noopener\">実用新案法29条の2<\/a>）。<\/li><li>ア：誤。対象は「物品の形状、構造又は組合せ」に関する考案に限られる（1条・3条）。<\/li><li>ウ：誤。出願日から10年（15条）。<\/li><\/ul><p>原理：無審査で登録されるため、有効性を客観的に評価した書面がなければ権利を行使させない。<\/p>", "n": 1}, {"topic": "実用新案と特許出願", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["実用新案登録出願は、特許出願と同じく実体審査を経て登録される。", "実用新案権は、更新登録をすれば存続期間を延長できる。", "一定の期間内であれば、実用新案登録に基づいて特許出願をすることができる。"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法46条の2<\/a>）。原則として実用新案登録出願の日から3年以内。<\/li><li>ア：誤。方式審査と基礎的要件の審査だけで登録される（14条2項）。<\/li><li>イ：誤。更新制度はない。<\/li><\/ul>", "n": 2}, {"topic": "実用新案技術評価", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["実用新案技術評価は、何人も請求することができる。", "実用新案技術評価は、実用新案権者だけが請求できる。", "否定的な評価が出た実用新案登録は、自動的に取り消される。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000123\" target=\"_blank\" rel=\"noopener\">実用新案法12条1項<\/a>）。<\/li><li>イ：誤。<\/li><li>ウ：誤。評価書は「意見」にすぎず、権利を消すには無効審判が必要。<\/li><\/ul>", "n": 3}, {"topic": "意匠権の存続期間", "ask": "意匠権の存続期間として、最も適切なものはどれか。", "choices": ["設定登録の日から20年", "意匠登録出願の日から20年", "意匠登録出願の日から25年"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000125\" target=\"_blank\" rel=\"noopener\">意匠法21条1項<\/a>）。2019年改正（2020年4月施行）で「登録日から20年」から変わった。<\/li><li>ア：誤。改正前の期間。<\/li><li>イ：誤。<\/li><\/ul>", "n": 4}, {"topic": "部分意匠・秘密意匠", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["秘密意匠の秘密期間は、設定登録の日から最長5年である。", "物品の部分の形状等についても、部分意匠として意匠登録を受けることができる。", "意匠登録出願にも出願審査請求制度があり、請求がなければ審査されない。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000125\" target=\"_blank\" rel=\"noopener\">意匠法2条1項<\/a>かっこ書）。<\/li><li>ア：誤。最長3年（14条1項）。発売前のデザインを競合に知られないための制度。<\/li><li>ウ：誤。意匠には審査請求制度がなく、すべての出願が審査される。<\/li><\/ul>", "n": 5}, {"topic": "2019年改正", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["建築物の外観は、意匠登録の対象とならない。", "店舗の内装は、意匠登録の対象とならない。", "機器の操作の用に供される画像は、物品に記録・表示されていなくても意匠登録の対象となり得る。"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000125\" target=\"_blank\" rel=\"noopener\">意匠法2条1項<\/a>）。<\/li><li>ア・イ：誤。改正で<strong>建築物<\/strong>・<strong>内装<\/strong>（8条の2）・<strong>画像<\/strong>が保護対象に加わった（<a href=\"https://www.jpo.go.jp/system/design/gaiyo/seidogaiyo/isho_kaisei_2019.html\" target=\"_blank\" rel=\"noopener\">特許庁 令和元年意匠法改正<\/a>）。<\/li><\/ul>", "n": 6}, {"topic": "意匠の登録要件", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["絵画や彫刻など純粋美術の分野に属する著作物は、工業上利用できる意匠に当たらず、意匠登録を受けられない。", "公知の意匠に類似する意匠であっても、同一でなければ新規性がある。", "新規性があれば、公知の形状を単に組み合わせただけの意匠でも、必ず意匠登録を受けられる。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000125\" target=\"_blank\" rel=\"noopener\">意匠法3条1項柱書<\/a>）。工業上利用できるとは、同じものを反復して量産できること（<a href=\"https://www.jpo.go.jp/system/laws/rule/guideline/design/shinsa_kijun/index.html\" target=\"_blank\" rel=\"noopener\">特許庁 意匠審査基準<\/a>）。<\/li><li>イ：誤。公知意匠に<strong>類似<\/strong>する意匠も新規性がない（3条1項3号）。<\/li><li>ウ：誤。容易に創作できた意匠は登録できない（3条2項：創作非容易性）。<\/li><\/ul>", "n": 7}, {"topic": "関連意匠", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["関連意匠は、本意匠と同日に出願したものに限り登録を受けられる。", "関連意匠は、本意匠の意匠登録出願の日以後10年を経過する日前までに出願すれば、登録を受けられる場合がある。", "関連意匠の意匠権は、本意匠の意匠権と分離して移転できる。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000125\" target=\"_blank\" rel=\"noopener\">意匠法10条1項<\/a>）。2019年改正で、同日だけでなく10年以内の出願が認められた。<\/li><li>ア：誤。<\/li><li>ウ：誤。分離して移転できない（22条1項）。似たデザインの権利が別々の人に渡ると、権利が重なって混乱するため。<\/li><\/ul><p>原理：1つのコンセプトから生まれたデザインのバリエーションを、まとめて守るための制度。<\/p>", "n": 8}, {"topic": "意匠権の効力", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["意匠権の効力は、登録意匠と同一の意匠にだけ及ぶ。", "意匠権者は、業として登録意匠およびこれに類似する意匠の実施をする権利を専有する。", "意匠権の効力は、物品が類似しない場合でも、形状が同じであれば常に及ぶ。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000125\" target=\"_blank\" rel=\"noopener\">意匠法23条<\/a>）。デザインは少し変えるだけで模倣できるので、類似範囲まで効力を及ぼす。<\/li><li>ア：誤。<\/li><li>ウ：誤。意匠の類似は、物品等の類否と形態の類否の両方で判断する。<\/li><\/ul>", "n": 9}, {"topic": "組物の意匠", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["1つの意匠登録出願で、関係のない2以上の意匠をまとめて出願できる。", "組物の意匠については、部分意匠として意匠登録を受けることは一切できない。", "経済産業省令で定める組物を構成する物品等は、組物全体として統一があるときは、一意匠として出願し、意匠登録を受けることができる。"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000125\" target=\"_blank\" rel=\"noopener\">意匠法8条<\/a>）。例：一組の飲食用具セット。<\/li><li>ア：誤。一意匠一出願が原則（7条）。<\/li><li>イ：誤。2019年改正で、組物の部分意匠も認められた。<\/li><\/ul>", "n": 10}], "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-93e11681-sex295/chizai3/set-03.md"}, {"id": "04", "kind": "学科", "topic": "商標法", "principle": "<p>商標法は創作ではなく、マークに積み重なった<strong>業務上の信用<\/strong>を守る法律です（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000127\" target=\"_blank\" rel=\"noopener\">商標法1条<\/a>）。だから新しさは要りませんが、他人の商品と区別できること（識別力）が必要で、信用が続くかぎり更新して永続させられます。逆に、使われていない商標には守る信用がないので、不使用取消審判で取り消せます。権利の範囲は「マーク×指定商品・役務」の組合せで決まります。<\/p>", "questions": [{"topic": "識別力", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["商品「りんご」について「りんご」の文字だけからなる商標は、原則として商標登録を受けることができない。", "地名だけからなる商標は、どの商品についても常に商標登録を受けることができる。", "音からなる商標は、商標登録の対象とならない。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000127\" target=\"_blank\" rel=\"noopener\">商標法3条1項1号<\/a>：普通名称）。<\/li><li>イ：誤。産地や販売地を表すにすぎない場合は登録できない（3条1項3号）。<\/li><li>ウ：誤。2014年改正で音・色彩・動き・ホログラム・位置の商標が導入された（2条1項）。<\/li><\/ul><p>原理：普通名称は誰もが使う必要があるので、一人に独占させない。<\/p>", "n": 1}, {"topic": "使用による識別力", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["普通名称であっても、長年使用して有名になれば、商標登録を受けることができる。", "商品の産地や品質を普通に表示するにすぎない商標でも、使用された結果、需要者が誰の商品か認識できるようになったものは、商標登録を受けることができる。", "識別力は、商標登録の要件ではない。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000127\" target=\"_blank\" rel=\"noopener\">商標法3条2項<\/a>）。3条1項3号〜5号に当たる商標が対象。<\/li><li>ア：誤。普通名称（1号）・慣用商標（2号）・その他識別力がないもの（6号）は3条2項の対象外。<\/li><li>ウ：誤。<\/li><\/ul>", "n": 2}, {"topic": "存続期間", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["商標権の存続期間は出願の日から10年で、更新はできない。", "商標権の存続期間は設定登録の日から20年で、更新はできない。", "商標権の存続期間は設定登録の日から10年で、更新登録の申請により更新できる。"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000127\" target=\"_blank\" rel=\"noopener\">商標法19条1項・2項<\/a>）。<\/li><li>ア・イ：誤。<\/li><\/ul><p>原理：標識法なので、使用を続けて信用を保つかぎり永続的に保護する。<\/p>", "n": 3}, {"topic": "他人の先行登録商標", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["他人の登録商標に類似する商標は、指定商品が類似していなくても、常に登録を受けられない。", "他人の登録商標に類似し、指定商品も類似する商標でも、その他人の承諾を得ており、出所の混同を生じるおそれがないときは、登録を受けられる場合がある。", "他人の登録商標に類似し、指定商品も類似する商標でも、先に使用していれば必ず登録を受けられる。"], "answer": 2, "explain": "<ul><li>イ：正。2024年4月1日施行の<strong>コンセント制度<\/strong>（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000127\" target=\"_blank\" rel=\"noopener\">商標法4条4項<\/a>）。<\/li><li>ア：誤。4条1項11号は、商標と指定商品の<strong>両方<\/strong>が同一・類似の場合。<\/li><li>ウ：誤。<\/li><\/ul>", "n": 4}, {"topic": "不使用取消審判", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["継続して3年以上、日本国内で、商標権者・専用使用権者・通常使用権者のいずれも登録商標を指定商品に使用していないときは、何人も取消審判を請求できる。", "継続して5年以上使用していないことが要件である。", "取消審判は、利害関係人しか請求できない。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000127\" target=\"_blank\" rel=\"noopener\">商標法50条1項<\/a>）。<\/li><li>イ・ウ：誤。<\/li><\/ul><p>原理：使われていない商標には守るべき信用がない。他人の選択の余地を狭めないよう、取り消せるようにしている。<\/p>", "n": 5}, {"topic": "登録異議の申立て", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["利害関係人に限り、商標登録の日から6月以内に申し立てることができる。", "何人も、商標掲載公報の発行の日から2月以内に限り申し立てることができる。", "何人も、いつでも申し立てることができる。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000127\" target=\"_blank\" rel=\"noopener\">商標法43条の2<\/a>）。<\/li><li>比較：特許異議の申立ては「特許掲載公報発行日から<strong>6月<\/strong>」（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法113条<\/a>）。<\/li><\/ul>", "n": 6}, {"topic": "商標の類否", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["外観が異なれば、常に非類似と判断される。", "商標が同一でなければ、類似と判断されることはない。", "外観・称呼（呼び方）・観念などから取引者・需要者に与える印象等を総合して判断される。"], "answer": 3, "explain": "<ul><li>ウ：正。最高裁昭和43年2月27日判決（氷山印事件）が示した基準（<a href=\"https://www.courts.go.jp/app/hanrei_jp/search1\" target=\"_blank\" rel=\"noopener\">裁判所 判例検索<\/a>で「昭和39(行ツ)110」）。<\/li><li>ア・イ：誤。<\/li><\/ul>", "n": 7}, {"topic": "専用権と禁止権", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["商標権者は、登録商標に類似する商標を指定商品に類似する商品に使用する他人に対しても、その使用を差し止めることができる。", "商標権者は、類似範囲の商標についても、自ら独占的に使用する権利を持つ。", "商標権の効力は、指定商品と類似しない商品にも及ぶ。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000127\" target=\"_blank\" rel=\"noopener\">商標法37条1号<\/a>：禁止権）。<\/li><li>イ：誤。独占的に使用できる（専用権）のは、指定商品についての登録商標だけ（25条）。類似範囲は他人を排除できるだけ。<\/li><li>ウ：誤。<\/li><\/ul>", "n": 8}, {"topic": "商標権の効力の制限", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["他人の登録商標を、指定商品と同一の商品に自社商品の目印として付ける行為にも、商標権の効力は及ばない。", "自己の氏名を普通に用いられる方法で表示する商標には、原則として商標権の効力は及ばない。", "商標権の効力は、商品の普通名称を普通に用いられる方法で表示する行為にも及ぶ。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000127\" target=\"_blank\" rel=\"noopener\">商標法26条1項1号<\/a>）。ただし不正競争の目的がある場合は除く（26条2項）。<\/li><li>ア：誤。典型的な侵害。<\/li><li>ウ：誤。及ばない（26条1項2号）。<\/li><\/ul>", "n": 9}, {"topic": "マドリッド協定議定書", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["国際登録を受ければ、全世界で一律に有効な商標権が発生する。", "日本の商標登録出願や商標登録がなくても、日本国特許庁を通じて国際出願ができる。", "日本の商標登録出願または商標登録を基礎として、日本国特許庁を通じて国際出願ができ、保護を受けるかどうかは指定した国ごとに判断される。"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://www.jpo.go.jp/system/trademark/madrid/index.html\" target=\"_blank\" rel=\"noopener\">特許庁 マドリッド協定議定書による国際登録<\/a>）。<\/li><li>ア：誤。属地主義により、権利は各指定国で判断される。<\/li><li>イ：誤。本国官庁での基礎出願・基礎登録が必要。<\/li><\/ul>", "n": 10}], "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-93e11681-sex295/chizai3/set-04.md"}, {"id": "05", "kind": "学科", "topic": "著作権法 I（著作物・著作者・権利）", "principle": "<p>著作権は「表現」を守る権利で、アイデアそのものは保護しません（アイデア・表現二分論）。文化的な表現は大量に生まれるため、登録などの手続は要らず、創作した時点で自動的に発生します（無方式主義、<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法17条2項<\/a>）。著作者の権利は、財産としての<strong>著作権<\/strong>（譲渡できる）と、作者の人格を守る<strong>著作者人格権<\/strong>（譲渡できない）の2本立てです。<\/p>", "questions": [{"topic": "著作物", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["斬新なアイデアは、表現されていなくても著作物として保護される。", "事実の伝達にすぎない雑報や時事の報道も、言語の著作物に該当する。", "小学生が描いた絵であっても、思想・感情が創作的に表現されていれば著作物となる。"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法2条1項1号<\/a>）。創作性は「個性が表れていること」で足り、芸術的な水準の高さは要らない。<\/li><li>ア：誤。保護されるのは表現。<\/li><li>イ：誤。言語の著作物に当たらない（10条2項）。<\/li><\/ul>", "n": 1}, {"topic": "権利の発生", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["著作権は、文化庁に登録することで発生する。", "著作権は、創作した時点で発生し、何らの手続も要しない。", "著作権は、©表示をしなければ発生しない。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法17条2項<\/a>）。<\/li><li>ア：誤。文化庁への登録（75条以下）は、権利移転の第三者対抗要件などのための制度（<a href=\"https://www.bunka.go.jp/seisaku/chosakuken/toroku_seido/\" target=\"_blank\" rel=\"noopener\">文化庁 著作権登録制度<\/a>）。<\/li><li>ウ：誤。<\/li><\/ul>", "n": 2}, {"topic": "著作者人格権", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["著作者人格権は、契約により他人に譲渡できる。", "著作者人格権には、公表権、氏名表示権、同一性保持権がある。", "複製権は、著作者人格権の一つである。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法18条〜20条<\/a>）。<\/li><li>ア：誤。一身専属で譲渡できない（59条）。実務では「著作者人格権を行使しない」という特約（不行使特約）を結ぶ。<\/li><li>ウ：誤。複製権（21条）は財産権としての著作権。<\/li><\/ul>", "n": 3}, {"topic": "保護期間", "ask": "実名で公表された小説の著作権の保護期間として、最も適切なものはどれか。", "choices": ["著作者の死後50年", "著作者の死後70年（死亡した年の翌年1月1日から起算）", "創作後70年"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法51条2項・57条<\/a>）。2018年12月30日に50年から70年へ延長された。57条の<strong>暦年主義<\/strong>で、翌年1月1日から数える。<\/li><li>ア・ウ：誤。<\/li><\/ul>", "n": 4}, {"topic": "職務著作", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["法人の発意に基づき、業務に従事する者が職務上作成し、法人名義で公表するものは、契約等に別段の定めがない限り、法人が著作者となる。", "従業者が職務上作成した著作物は、公表名義を問わず常に法人が著作者となる。", "職務著作であっても、著作者人格権は従業者に残る。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法15条1項<\/a>）。<\/li><li>イ：誤。原則として法人名義での公表が要件。プログラムの著作物は公表名義を問わない（15条2項）。<\/li><li>ウ：誤。法人が「著作者」になるので、著作者人格権も法人が持つ。<\/li><li>比較：特許の職務発明では、発明者は常に従業者（自然人）。<\/li><\/ul>", "n": 5}, {"topic": "プログラム", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["プログラム言語そのものも、著作物として保護される。", "プログラムは特許で保護されるので、著作物には当たらない。", "プログラムは著作物として保護されるが、プログラム言語・規約・解法は保護されない。"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法10条1項9号・10条3項<\/a>）。<\/li><li>ア：誤。言語や解法はアイデアにあたる部分なので、独占させない。<\/li><li>イ：誤。発明に当たれば特許も取れるが、著作権とは別の制度。<\/li><\/ul>", "n": 6}, {"topic": "二次的著作物", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["小説を翻訳した場合、翻訳物の利用について権利を持つのは翻訳者だけである。", "原著作物の著作者は、二次的著作物の利用に関し、二次的著作物の著作者と同一の種類の権利を持つ。", "翻訳や映画化で作られたものは、著作物に当たらない。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法28条<\/a>）。翻訳書を出版するには、翻訳者と原作者の両方の許諾が必要になる。<\/li><li>ア：誤。<\/li><li>ウ：誤。翻案などで創作したものは二次的著作物（2条1項11号）。<\/li><\/ul>", "n": 7}, {"topic": "編集著作物", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["素材の選択または配列によって創作性を有する編集物は、編集著作物として保護される。", "素材が著作物でなければ、編集物は保護されない。", "編集著作物が保護されると、素材となった個々の著作物の著作者の権利は失われる。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法12条1項<\/a>）。<\/li><li>イ：誤。素材が単なるデータでも、選択・配列に創作性があればよい。<\/li><li>ウ：誤。影響を及ぼさない（12条2項）。<\/li><\/ul>", "n": 8}, {"topic": "共同著作物の保護期間", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["共同著作物の著作権は、最初に死亡した著作者の死後70年で消滅する。", "共同著作物の著作権は、公表後70年で消滅する。", "共同著作物の著作権は、最後に死亡した著作者の死後70年を経過するまで存続する。"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法51条2項<\/a>かっこ書）。<\/li><li>ア・イ：誤。<\/li><\/ul>", "n": 9}, {"topic": "公衆送信権", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["他人の写真を自分のウェブサイトにアップロードする行為は、公衆送信権（送信可能化を含む）の対象となる。", "ウェブサイトにアップロードしただけで、まだ誰も閲覧していなければ、著作権侵害にはならない。", "公衆送信権は、テレビ放送だけを対象とする権利である。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法23条1項<\/a>）。<\/li><li>イ：誤。誰でもアクセスできる状態にした（送信可能化）時点で権利が及ぶ。<\/li><li>ウ：誤。放送・有線放送・インターネット送信などを含む。<\/li><\/ul>", "n": 10}], "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-93e11681-sex295/chizai3/set-05.md"}, {"id": "06", "kind": "学科", "topic": "著作権法 II（権利の制限・著作隣接権・侵害）", "principle": "<p>著作権は無方式で幅広く発生するため、文化の利用を止めすぎないように、私的使用・引用・教育など「許諾なしに使える場合」が細かく決められています（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法30条〜50条<\/a>）。どの規定も「権利者の利益を不当に害しない」範囲に限られる、というのが共通の考え方です。また、著作物を公衆に伝える実演家やレコード製作者などの貢献は<strong>著作隣接権<\/strong>で保護されます。<\/p>", "questions": [{"topic": "私的使用のための複製", "ask": "著作権法30条の私的使用のための複製として許されるものはどれか。", "choices": ["自分と家族で聴くために、購入した音楽CDを自宅でスマートフォンにコピーする。", "会社の同僚に配るために、業務で使う書籍をコピーする。", "違法に配信されていると知りながら、音楽ファイルを自分用にダウンロードする。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法30条1項<\/a>）。<\/li><li>イ：誤。会社内の業務利用は「個人的又は家庭内」に当たらない。<\/li><li>ウ：誤。違法と知りながらの録音録画・ダウンロードは除外されている（30条1項3号・4号）。<\/li><\/ul>", "n": 1}, {"topic": "引用", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["未公表の著作物であっても引用できる。", "引用の場合には、出所を明示する必要はない。", "自分の著作物が「主」、引用部分が「従」の関係にあり、引用部分が明瞭に区別されていることなどが必要とされる。"], "answer": 3, "explain": "<ul><li>ウ：正。最高裁昭和55年3月28日判決（パロディ・モンタージュ写真事件）などで示された基準。<\/li><li>ア：誤。「公表された著作物」に限る（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法32条1項<\/a>）。<\/li><li>イ：誤。出所の明示が必要（48条1項1号）。<\/li><\/ul>", "n": 2}, {"topic": "著作隣接権を持つ者", "ask": "著作隣接権を有する者として、最も適切なものはどれか。", "choices": ["作詞家", "CD販売店", "歌手（実演家）"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法89条<\/a>）。著作隣接権を持つのは、実演家・レコード製作者・放送事業者・有線放送事業者。<\/li><li>ア：誤。作詞家は著作者。<\/li><li>イ：誤。<\/li><\/ul><p>原理：著作隣接権は、著作物を公衆に「伝達する」者の貢献を保護する権利。<\/p>", "n": 3}, {"topic": "授業での利用", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["学校の授業の過程で利用するために必要と認められる限度で、公表された著作物を複製できる。授業目的の公衆送信は、設置者が補償金を支払えば許諾なしにできる。", "営利目的の学習塾の授業でも、著作権法35条により自由に複製できる。", "授業で使うのであれば、市販の問題集を生徒全員分コピーしてもよい。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法35条1項・2項<\/a>）。授業目的公衆送信補償金制度は2020年に施行（<a href=\"https://sartras.or.jp/\" target=\"_blank\" rel=\"noopener\">SARTRAS<\/a>）。<\/li><li>イ：誤。営利を目的とする教育機関は対象外。<\/li><li>ウ：誤。ドリルなど購入を前提とする教材のコピーは「著作権者の利益を不当に害する」ので許されない（35条1項ただし書）。<\/li><\/ul>", "n": 4}, {"topic": "非営利の上演・演奏", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["入場料を取るコンサートでも、主催者が非営利団体であれば、許諾なしに演奏できる。", "営利を目的とせず、聴衆から料金を受けず、演奏者に報酬が支払われない場合は、公表された著作物を許諾なしに演奏できる。", "非営利・無料であれば、未公表の楽曲も許諾なしに演奏できる。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法38条1項<\/a>）。例：学校の文化祭での無料演奏。<\/li><li>ア：誤。料金を受けないことも要件。<\/li><li>ウ：誤。公表された著作物に限る。<\/li><\/ul>", "n": 5}, {"topic": "写り込み", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["写真撮影の際に、背景にポスターが小さく写り込んだ場合、それが軽微な構成部分であれば、原則として著作権侵害にならない。", "他人のキャラクターを写真の主役として大きく写しても、写り込みとして許される。", "写り込みは、いかなる場合も著作権侵害となる。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法30条の2<\/a>：付随対象著作物の利用）。<\/li><li>イ：誤。付随的に写り込んだものに限る。<\/li><li>ウ：誤。<\/li><\/ul>", "n": 6}, {"topic": "情報解析のための利用", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["情報解析（AIの学習など）のための利用であれば、どのような場合でも許諾は不要である。", "情報解析を目的とする利用であっても、常に権利者の許諾が必要である。", "著作物に表現された思想・感情の享受を目的としない情報解析などのための利用は、権利者の利益を不当に害する場合を除き、許諾なしにできる。"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法30条の4<\/a>）（<a href=\"https://www.bunka.go.jp/seisaku/chosakuken/aiandcopyright.html\" target=\"_blank\" rel=\"noopener\">文化庁 AIと著作権<\/a>）。<\/li><li>ア：誤。ただし書がある。<\/li><li>イ：誤。<\/li><\/ul>", "n": 7}, {"topic": "実演家人格権", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["実演家には、公表権・氏名表示権・同一性保持権が認められている。", "実演家には、氏名表示権と同一性保持権が認められている。", "実演家人格権は、他人に譲渡できる。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法90条の2・90条の3<\/a>）。公表権はない。<\/li><li>ア：誤。<\/li><li>ウ：誤。一身専属（101条の2）。<\/li><\/ul>", "n": 8}, {"topic": "著作隣接権の保護期間", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["実演に関する著作隣接権は、実演が行われた日の属する年の翌年から起算して70年を経過するまで存続する。", "放送に関する著作隣接権は、放送後70年を経過するまで存続する。", "実演に関する著作隣接権は、実演家の死後70年を経過するまで存続する。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法101条2項1号<\/a>）。レコードは発行後70年。<\/li><li>イ：誤。放送・有線放送は50年。<\/li><li>ウ：誤。起算点は実演の時。<\/li><\/ul>", "n": 9}, {"topic": "侵害と罰則", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["著作権侵害には刑事罰がない。", "著作権侵害罪は、原則として親告罪である。", "侵害行為の差止めを請求するには、侵害者の故意が必要である。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法123条1項<\/a>）。海賊版の販売など一部は非親告罪（123条2項）。<\/li><li>ア：誤。10年以下の拘禁刑もしくは1,000万円以下の罰金、またはその併科（119条1項）。<\/li><li>ウ：誤。差止め（112条）に故意・過失は不要。<\/li><\/ul>", "n": 10}], "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-93e11681-sex295/chizai3/set-06.md"}, {"id": "07", "kind": "学科", "topic": "不正競争防止法・条約・その他", "principle": "<p>不正競争防止法は、権利を登録させるのではなく、他人の信用へのただ乗りや営業秘密の盗用など、不公正な<strong>行為<\/strong>を規制する法律です。登録がない表示やデザインも保護される場合があります。また、知的財産権は国ごとに成立して効力もその国にしか及ばないので（属地主義）、外国での保護はパリ条約・PCT・マドリッド協定議定書などの条約で手続を楽にしています。<\/p>", "questions": [{"topic": "営業秘密の要件", "ask": "不正競争防止法上の「営業秘密」の要件として、<strong>含まれないもの<\/strong>はどれか。", "choices": ["秘密として管理されていること（秘密管理性）", "事業活動に有用な技術上または営業上の情報であること（有用性）", "特許庁に登録されていること"], "answer": 3, "explain": "<ul><li>ウ：要件ではない。営業秘密の要件は、秘密管理性・有用性・<strong>非公知性<\/strong>の3つ（<a href=\"https://laws.e-gov.go.jp/law/405AC0000000047\" target=\"_blank\" rel=\"noopener\">不正競争防止法2条6項<\/a>）。登録制度はない（<a href=\"https://www.meti.go.jp/policy/economy/chizai/chiteki/trade-secret.html\" target=\"_blank\" rel=\"noopener\">経済産業省 営業秘密<\/a>）。<\/li><\/ul><p>原理：特許は「公開と引換えに独占」、営業秘密は「秘密のまま守る」。外から分析されにくい製法などは、あえて出願しない選択もある（オープン・クローズ戦略）。<\/p>", "n": 1}, {"topic": "周知表示混同惹起行為", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["商標登録されていなくても、需要者の間に広く認識されている他人の商品等表示と同一・類似の表示を使い、混同を生じさせる行為は、不正競争に当たる。", "商標登録されていない表示は、不正競争防止法では一切保護されない。", "全国的に著名でなければ、不正競争防止法2条1項1号では保護されない。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/405AC0000000047\" target=\"_blank\" rel=\"noopener\">不正競争防止法2条1項1号<\/a>）。<\/li><li>イ：誤。<\/li><li>ウ：誤。1号の「周知」は一地方で足りる。全国的な著名性が要件となるのは、混同がなくても保護する2号（著名表示冒用行為）。<\/li><\/ul>", "n": 2}, {"topic": "限定提供データ", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["インターネットで誰でも無償で入手できるデータも、限定提供データとして保護される。", "ID・パスワードなどで管理しつつ、業として特定の者に提供するデータは、限定提供データとして保護され得る。", "限定提供データとして保護されるのは、営業秘密として秘密管理されているデータに限られる。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/405AC0000000047\" target=\"_blank\" rel=\"noopener\">不正競争防止法2条7項<\/a>）。2018年改正で導入。<\/li><li>ア：誤。<\/li><li>ウ：誤。営業秘密に当たるものは除かれる。共有を前提とするデータを守るための別の類型。<\/li><\/ul>", "n": 3}, {"topic": "種苗法", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["登録品種であっても、農業者が収穫物から種苗をとって自家増殖することは常に自由である。", "品種登録は特許庁に出願する。", "育成者権の存続期間は品種登録の日から25年（果樹などの永年性植物は30年）である。"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/410AC0000000083\" target=\"_blank\" rel=\"noopener\">種苗法19条2項<\/a>）。<\/li><li>ア：誤。2022年4月から、登録品種の自家増殖には育成者権者の許諾が必要（21条の改正）（<a href=\"https://www.hinshu2.maff.go.jp/\" target=\"_blank\" rel=\"noopener\">農林水産省 品種登録<\/a>）。<\/li><li>イ：誤。農林水産大臣に出願する。<\/li><\/ul>", "n": 4}, {"topic": "独占禁止法との関係", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["特許のライセンス契約には、独占禁止法は一切適用されない。", "知的財産権の権利の行使と認められる行為には独占禁止法は適用されないが、権利の行使に見えても制度の趣旨を逸脱する場合は適用され得る。", "ライセンシーに製品の販売価格を指定して拘束することは、常に適法である。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/322AC0000000054\" target=\"_blank\" rel=\"noopener\">独占禁止法21条<\/a>、<a href=\"https://www.jftc.go.jp/dk/guideline/unyoukijun/chitekizaisan.html\" target=\"_blank\" rel=\"noopener\">公正取引委員会 知的財産の利用に関する独占禁止法上の指針<\/a>）。<\/li><li>ア：誤。<\/li><li>ウ：誤。販売価格の制限は、原則として不公正な取引方法に当たる。<\/li><\/ul>", "n": 5}, {"topic": "パリ条約の優先期間", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["特許・実用新案・意匠・商標とも12月である。", "特許・実用新案は12月、意匠・商標は6月である。", "特許は18月、商標は12月である。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://www.wipo.int/treaties/en/ip/paris/\" target=\"_blank\" rel=\"noopener\">パリ条約4条C(1)（WIPO）<\/a>）。<\/li><li>ア・ウ：誤。<\/li><\/ul><p>原理：外国出願の準備には時間がかかるので、最初の出願日を基準に新規性などを判断してもらえる「優先権」を与える。<\/p>", "n": 6}, {"topic": "パリ条約の三大原則", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["同盟国の国民は、他の同盟国において、その国の国民と同じ保護を受ける。", "ある同盟国で特許が無効になると、他の同盟国の同じ発明の特許も無効になる。", "パリ条約に基づいて国際出願をすれば、1つの出願で全同盟国の特許が得られる。"], "answer": 1, "explain": "<ul><li>ア：正。内国民待遇の原則（パリ条約2条）。<\/li><li>イ：誤。各国の特許は互いに独立している（特許独立の原則、4条の2）。<\/li><li>ウ：誤。国際出願の制度はPCTのもの。PCTでも特許を付与するかは各国が判断する。<\/li><\/ul>", "n": 7}, {"topic": "PCT国際出願", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["国際出願をすれば、世界共通の「国際特許」が付与される。", "日本国特許庁に日本語で国際出願をすることはできない。", "国際出願日が認められた国際出願は、各指定国において、国際出願日に正規の国内出願がされた効果を有する。"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://www.wipo.int/pct/en/texts/articles/a11.html\" target=\"_blank\" rel=\"noopener\">PCT 11条(3)（WIPO）<\/a>）。<\/li><li>ア：誤。「国際特許」は存在しない。特許を付与するかは各国の国内段階で審査される。<\/li><li>イ：誤。日本国特許庁を受理官庁として日本語で出願できる（<a href=\"https://www.jpo.go.jp/system/patent/pct/seido/kokusai1.html\" target=\"_blank\" rel=\"noopener\">特許庁 PCT国際出願制度の概要<\/a>）。<\/li><\/ul>", "n": 8}, {"topic": "国際調査", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["国際調査は、出願人が請求した場合にだけ行われる。", "すべての国際出願は国際調査の対象となり、関連する先行技術を示した国際調査報告が作成される。", "国際調査報告で、各国での特許の可否が最終的に決まる。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://www.wipo.int/pct/en/texts/articles/a15.html\" target=\"_blank\" rel=\"noopener\">PCT 15条（WIPO）<\/a>）。見解書も作られる。<\/li><li>ア：誤。<\/li><li>ウ：誤。最終判断は各国の国内段階で行われる。<\/li><\/ul>", "n": 9}, {"topic": "知的財産基本法", "ask": "次の記述のうち、最も適切なものはどれか。", "choices": ["知的財産基本法では、営業秘密は「知的財産」に含まれない。", "知的財産基本法では、商標や商号など事業活動に用いられる商品または役務を表示するものも「知的財産」に含まれる。", "知的財産基本法に基づいて、特許権が発生する。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/414AC0000000122\" target=\"_blank\" rel=\"noopener\">知的財産基本法2条1項<\/a>）。<\/li><li>ア：誤。営業秘密も含まれる。<\/li><li>ウ：誤。基本法は国の施策の基本方針を定める法律。権利は特許法などの個別法で発生する。<\/li><\/ul>", "n": 10}], "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-93e11681-sex295/chizai3/set-07.md"}, {"id": "J1", "kind": "実技", "topic": "実技 I（特許・商標の事例）", "scenario": "<p><strong>ミナト文具株式会社<\/strong>（以下「X社」）は文房具メーカーである。開発部の社員Aは、職務として「針を使わずに紙を綴じるホチキス」（以下「本件発明」）を完成させた。X社は本件発明を使った新商品を、商品名「<strong>ミナクル<\/strong>」、特徴的な流線形デザインで発売する予定である。法務部の社員Bがこの対応を担当している。<\/p><p>（人物・企業名はすべて架空）<\/p>", "principle": "<p>実技試験は、企業の担当者として「次に何をすべきか」を問う形式です。条文の数字を覚えるだけでなく、<strong>どの手続が、どの段階で、誰に対して使えるのか<\/strong>（出願前／審査中／登録後、出願人／何人も／利害関係人）を整理しておくと解けます。<\/p>", "questions": [{"topic": "新規性喪失の例外の期限", "ask": "X社は本件発明を、特許出願前の2026年5月10日に展示会で発表してしまった。新規性喪失の例外の適用を受けるための出願期限として、最も適切なものはどれか。", "choices": ["2026年11月10日", "2027年5月10日", "2028年5月10日"], "answer": 2, "explain": "<ul><li>イ：正。公開日から1年以内（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法30条2項<\/a>）。<\/li><li>出願と同時に例外適用の書面を出し、出願日から30日以内に証明書を出すことも忘れない（30条3項）。<\/li><\/ul>", "n": 1}, {"topic": "職務発明の帰属", "ask": "社員Aは「本件発明は自分の発明だから、特許を受ける権利は自分のものだ」と主張している。X社の職務発明規程には、職務発明の特許を受ける権利は発生時にX社が取得すると定められている。Bの説明として、最も適切なものはどれか。", "choices": ["特許を受ける権利は発生時からX社に帰属する。Aは相当の利益を受ける権利を有する。", "規程があっても、特許を受ける権利はAに帰属し、X社は無償の通常実施権を持つだけである。", "特許を受ける権利がX社に帰属するので、Aは発明者でもなくなる。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法35条3項・4項<\/a>）。<\/li><li>ウ：誤。権利がX社に帰属しても、発明者がAであることは変わらない。願書にもAが発明者として記載される。<\/li><\/ul>", "n": 2}, {"topic": "審査請求の期限", "ask": "X社は2026年6月1日に特許出願した。出願審査請求の期限として、最も適切なものはどれか。", "choices": ["2027年12月1日", "2029年6月1日", "2033年6月1日"], "answer": 2, "explain": "<ul><li>イ：正。出願日から3年（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法48条の3<\/a>）。<\/li><li>ア：出願公開の時期（1年6月）。数字の取り違えに注意。<\/li><\/ul>", "n": 3}, {"topic": "拒絶理由通知への対応", "ask": "X社に拒絶理由通知が届いた。Bがとるべき対応として、最も適切なものはどれか。", "choices": ["直ちに拒絶査定不服審判を請求する。", "直ちに特許無効審判を請求する。", "指定期間内に意見書や手続補正書を提出する。"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法50条・17条の2<\/a>）。<\/li><li>ア：誤。拒絶査定不服審判は「拒絶査定」を受けた後の手続。拒絶理由通知の段階ではまだ査定は出ていない。<\/li><li>イ：誤。無効審判は、すでに成立した特許を無効にする手続。<\/li><\/ul>", "n": 4}, {"topic": "先使用権", "ask": "競合Y社が、X社の出願より前に本件発明と同一の発明を特許出願しており、その後Y社に特許権が設定された。しかしX社は、Y社の発明内容を知らずに独自に開発し、Y社の出願時点で既に量産設備を整えていた。Bの判断として、最も適切なものはどれか。", "choices": ["X社は先使用による通常実施権を主張できる可能性がある。", "X社は直ちに製造を中止するしかない。", "先に開発したX社に特許権が移転される。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法79条<\/a>）。<\/li><li>先願主義を貫くと、独自に事業を始めていた者が不当に害されるため、公平を図る制度。設計図や日付入りの資料に公証役場で確定日付をとるなど、証拠を残しておくことが重要。<\/li><\/ul>", "n": 5}, {"topic": "他社特許への対抗", "ask": "Y社の特許掲載公報が発行されてから4月が経過した。X社がY社の特許を取り消したいと考えている。この時点でX社がとれる手段として、最も適切なものはどれか。", "choices": ["商標登録異議の申立て", "特許異議の申立て", "拒絶査定不服審判の請求"], "answer": 2, "explain": "<ul><li>イ：正。公報発行日から6月以内なら何人も申し立てられる（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法113条<\/a>）。<\/li><li>特許無効審判（123条）も選択肢。無効審判は、利害関係人であれば6月経過後でも請求できる。<\/li><\/ul>", "n": 6}, {"topic": "侵害品の廃棄請求", "ask": "X社の特許権を侵害する製品をZ社が販売していた。X社は、Z社に対し、販売の停止に加えて在庫品の廃棄も請求できる。", "choices": ["○", "×"], "answer": 1, "explain": "<ul><li>○（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000121\" target=\"_blank\" rel=\"noopener\">特許法100条2項<\/a>）。差止請求をするときは、侵害行為を組成した物の廃棄なども請求できる。<\/li><\/ul>", "n": 7}, {"topic": "商標登録出願の願書", "ask": "X社は商品名「ミナクル」を商標登録出願しようとしている。願書の記載として、最も適切なものはどれか。", "choices": ["商標だけを記載すれば、すべての商品について権利が生じる。", "商標と、指定商品（例：第16類「文房具類」）を記載する。", "商品を発売した後でなければ出願できない。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000127\" target=\"_blank\" rel=\"noopener\">商標法5条1項・6条<\/a>）。区分は国際分類（ニース分類）に従う。<\/li><li>ウ：誤。使用する前でも、使用の意思があれば出願できる（3条1項柱書）。<\/li><\/ul>", "n": 8}, {"topic": "先行登録商標への対応", "ask": "調査の結果、他社Wが「ミナクル」と類似する商標を文房具について登録していることが分かった。ただし、Wはその商標を4年以上まったく使用していない。Bの提案として、最も適切なものはどれか。", "choices": ["不使用取消審判を請求する。", "商標は登録されれば絶対的な権利なので、商品名を変更するほかない。", "商標登録異議の申立てをする。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000127\" target=\"_blank\" rel=\"noopener\">商標法50条<\/a>）。<\/li><li>ウ：誤。異議申立ては公報発行日から2月以内に限られる（43条の2）。<\/li><\/ul>", "n": 9}, {"topic": "商標権の更新", "ask": "X社が「ミナクル」の商標権を取得した。商標権の更新登録の申請ができる期間として、最も適切なものはどれか。", "choices": ["存続期間満了後1年以内に限る", "存続期間中いつでも", "存続期間満了前6月から満了日まで（満了後6月以内も割増登録料を払えば可）"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000127\" target=\"_blank\" rel=\"noopener\">商標法20条2項・3項<\/a>）。<\/li><\/ul>", "n": 10}], "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-93e11681-sex295/chizai3/set-J1.md"}, {"id": "J2", "kind": "実技", "topic": "実技 II（意匠・著作権・その他の事例）", "scenario": "<p><strong>ミナト文具株式会社<\/strong>（以下「X社」）は文房具メーカーである。開発部の社員Aは、職務として「針を使わずに紙を綴じるホチキス」（以下「本件発明」）を完成させた。X社は本件発明を使った新商品を、商品名「<strong>ミナクル<\/strong>」、特徴的な流線形デザインで発売する予定である。法務部の社員Bがこの対応を担当している。<\/p><p>（人物・企業名はすべて架空）<\/p>", "principle": "<p>同じ「模倣品」でも、意匠登録があれば意匠権、なければ不正競争防止法の形態模倣（発売から3年）、輸入されるなら税関での差止め、と使える手段が変わります。著作権では、外部に作らせたものの権利は原則として作った人に生まれるので、契約で何を移すかを明記するのが基本です。<\/p>", "questions": [{"topic": "発売後の意匠登録出願", "ask": "X社は流線形のホチキスのデザインについて、既に2026年7月1日に発売してしまい、その後に意匠登録出願を検討している。最も適切なものはどれか。", "choices": ["発売した以上、意匠登録を受ける余地はない。", "発売日から1年以内に、新規性喪失の例外の手続をとって出願すれば、登録を受けられる可能性がある。", "意匠は特許と異なり新規性が要求されないので、いつでも出願できる。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/334AC0000000125\" target=\"_blank\" rel=\"noopener\">意匠法4条2項・3項<\/a>）。<\/li><li>ウ：誤。意匠も創作法なので新規性が必要（3条1項）。<\/li><\/ul>", "n": 1}, {"topic": "登録のないデザインの模倣", "ask": "「ミナクル」の発売から2年後に、Z社がその形態をそっくり模倣した商品を販売し始めた。X社は意匠登録をしていない。最も適切なものはどれか。", "choices": ["意匠登録がない以上、何もできない。", "著作権侵害として当然に差止めできる。", "不正競争防止法の形態模倣を理由に、販売の差止めを請求できる可能性がある。"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/405AC0000000047\" target=\"_blank\" rel=\"noopener\">不正競争防止法2条1項3号・19条1項5号イ<\/a>）。保護されるのは日本国内で最初に販売された日から<strong>3年<\/strong>。2023年改正で、デジタル空間での模倣も規制対象になった。<\/li><li>イ：誤。実用品のデザインが著作物（応用美術）と認められるのは限定的で、「当然に」とはいえない。<\/li><\/ul>", "n": 2}, {"topic": "税関での輸入差止め", "ask": "Z社の模倣品が海外で製造され、日本に輸入されようとしている。X社は、知的財産権を侵害する物品の輸入を差し止めるよう、税関長に申し立てることができる。", "choices": ["○", "×"], "answer": 1, "explain": "<ul><li>○（<a href=\"https://laws.e-gov.go.jp/law/329AC0000000061\" target=\"_blank\" rel=\"noopener\">関税法69条の13<\/a>）。対象には特許権・意匠権・商標権・著作権などの侵害物品のほか、不正競争防止法の形態模倣品なども含まれる（<a href=\"https://www.customs.go.jp/mizugiwa/chiteki/index.htm\" target=\"_blank\" rel=\"noopener\">税関 知的財産侵害物品の取締り<\/a>）。<\/li><\/ul>", "n": 3}, {"topic": "外部委託の著作物", "ask": "X社は販促パンフレット用のイラストを外部のフリーデザイナーCに依頼した。今後、X社がイラストを自由に改変して使うための契約として、最も適切なものはどれか。", "choices": ["著作権（著作権法27条・28条の権利を含む）をX社に譲渡し、Cは著作者人格権を行使しない旨を定める。", "「著作権を譲渡する」とだけ定めれば十分である。", "料金を支払えば、契約がなくても著作権はX社に移る。"], "answer": 1, "explain": "<ul><li>ア：正。<\/li><li>イ：誤。27条（翻訳・翻案権）と28条（二次的著作物の利用権）は、特掲しないと譲渡人（C）に留保されたものと推定される（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法61条2項<\/a>）。著作者人格権は譲渡できないので（59条）、不行使特約で対応する。<\/li><li>ウ：誤。外部委託は職務著作（15条）に当たらず、著作権はCに発生する。<\/li><\/ul>", "n": 4}, {"topic": "社員が作ったカタログ", "ask": "X社の社員がX社の企画に基づき職務として作成し、X社名義で公表した商品カタログの著作者は、原則としてX社である。", "choices": ["○", "×"], "answer": 1, "explain": "<ul><li>○（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法15条1項<\/a>）。<\/li><\/ul>", "n": 5}, {"topic": "新聞記事の社内配布", "ask": "Bは、業界紙の記事をコピーして社内会議で20部配布しようとしている。最も適切なものはどれか。", "choices": ["社内利用なので私的使用に当たり、許諾は不要である。", "新聞記事は著作物ではないので、自由にコピーできる。", "私的使用には当たらないため、原則として権利者の許諾が必要である。"], "answer": 3, "explain": "<ul><li>ウ：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法30条1項<\/a>）。<\/li><li>イ：誤。事実の伝達にすぎない雑報は著作物でないが（10条2項）、一般的な記事には創作性がある。<\/li><\/ul>", "n": 6}, {"topic": "店頭イベントのBGM", "ask": "X社は、店頭イベントで市販の音楽CDを再生してBGMとして流そうとしている（入場無料だが、商品の販売促進が目的）。最も適切なものはどれか。", "choices": ["入場無料なので、許諾は一切不要である。", "営利目的での公の演奏に当たるため、権利者（管理団体等）の許諾が必要である。", "CDを購入した時点で、あらゆる利用が許諾されている。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法22条・38条1項<\/a>）。38条1項の例外は「営利を目的としない」ことが要件。販売促進のBGMは営利目的。<\/li><\/ul>", "n": 7}, {"topic": "ネット上の写真", "ask": "インターネット上で誰でも閲覧できる写真は、出所を明示すれば、X社のパンフレットに自由に掲載できる。", "choices": ["○", "×"], "answer": 2, "explain": "<ul><li>×。公開されていても著作権は消えない。パンフレットへの掲載は複製（<a href=\"https://laws.e-gov.go.jp/law/345AC0000000048\" target=\"_blank\" rel=\"noopener\">著作権法21条<\/a>）に当たり、許諾が必要。引用（32条）の要件（主従関係など）を満たさない限り、出所を明示しても適法にはならない。<\/li><\/ul>", "n": 8}, {"topic": "顧客名簿の持出し", "ask": "X社の営業担当者が退職し、競合会社に顧客名簿を持ち出した。名簿には「社外秘」と表示され、パスワードでアクセスが制限されていた。最も適切なものはどれか。", "choices": ["営業秘密として、不正競争防止法に基づき使用の差止めや損害賠償を請求できる可能性がある。", "顧客名簿は技術情報ではないので、営業秘密に当たらない。", "特許登録していない情報は一切保護されない。"], "answer": 1, "explain": "<ul><li>ア：正（<a href=\"https://laws.e-gov.go.jp/law/405AC0000000047\" target=\"_blank\" rel=\"noopener\">不正競争防止法2条1項4号〜9号・2条6項・3条・4条<\/a>）。「社外秘」表示とアクセス制限は、秘密管理性を基礎づける典型的な措置（<a href=\"https://www.meti.go.jp/policy/economy/chizai/chiteki/trade-secret.html\" target=\"_blank\" rel=\"noopener\">経済産業省 営業秘密管理指針<\/a>）。<\/li><li>イ：誤。営業上の情報も営業秘密に含まれる。<\/li><\/ul>", "n": 9}, {"topic": "外国での権利取得", "ask": "X社は本件発明について、米国と欧州でも特許を取りたいと考えている。日本出願は2026年6月1日である。最も適切なものはどれか。", "choices": ["日本で特許を取れば、米国・欧州でも自動的に保護される。", "2027年6月1日までにパリ条約の優先権を主張して各国に出願するか、PCT国際出願をすれば、日本出願日を基準に新規性等が判断され得る。", "外国出願は、日本の特許が成立してからでなければできない。"], "answer": 2, "explain": "<ul><li>イ：正（<a href=\"https://www.wipo.int/treaties/en/ip/paris/\" target=\"_blank\" rel=\"noopener\">パリ条約4条（WIPO）<\/a>、<a href=\"https://www.wipo.int/pct/en/texts/articles/a8.html\" target=\"_blank\" rel=\"noopener\">PCT 8条（WIPO）<\/a>）。<\/li><li>ア：誤。属地主義により、権利は国ごとに取る。<\/li><li>PCTルートの国内移行期限は、原則として優先日から30か月（<a href=\"https://www.jpo.go.jp/system/patent/pct/seido/kokusai1.html\" target=\"_blank\" rel=\"noopener\">特許庁 PCT国際出願制度の概要<\/a>）。<\/li><\/ul>", "n": 10}], "url": "https://github.com/suzu27bayg3-design/aaa/blob/ccr-93e11681-sex295/chizai3/set-J2.md"}];
const KEY = 'chizai3-quiz-v1';
const KANA = ['ア', 'イ', 'ウ', 'エ', 'オ'];
const PASS = 0.7;

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save(r) { try { localStorage.setItem(KEY, JSON.stringify(r)); } catch (e) {} }
let record = load();

const all = SETS.flatMap(s => s.questions.map(q => ({ ...q, set: s.id, setTopic: s.topic, setUrl: s.url, scenario: s.scenario, id: s.id + '-' + q.n })));
const byId = Object.fromEntries(all.map(q => [q.id, q]));
const setById = Object.fromEntries(SETS.map(s => [s.id, s]));

let state = null;

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function missedIds() { return all.filter(q => record[q.id] && record[q.id].ok === false).map(q => q.id); }
function label(q, i) { return q.choices.length > 2 ? KANA[i] : q.choices[i]; }

function start(key) {
  let order, lbl;
  if (key === 'missed') { order = shuffle(missedIds()); lbl = 'まちがえた問題'; }
  else if (key === 'mock') { order = shuffle(all.filter(q => setById[q.set].kind === '学科').map(q => q.id)).slice(0, 30); lbl = '学科 模擬試験 30問'; }
  else if (key === 'mix') { order = shuffle(all.map(q => q.id)).slice(0, 10); lbl = '全セットから 10 問'; }
  else { const s = setById[key]; order = s.questions.map(q => s.id + '-' + q.n); lbl = 'セット ' + s.id + '　' + s.topic; }
  state = { key, label: lbl, order, idx: 0, picked: {}, done: false };
  try { sessionStorage.setItem(KEY + '-set', key); } catch (e) {}
  render();
}

function setScore(s) {
  const ids = s.questions.map(q => s.id + '-' + q.n);
  const tried = ids.filter(id => record[id]);
  return tried.length ? tried.filter(id => record[id].ok).length + '/' + ids.length : '';
}

function renderSets() {
  const nav = document.getElementById('sets');
  nav.innerHTML = '';
  const row = (lab) => { const r = el('div', 'row'); r.appendChild(el('span', 'lab', lab)); nav.appendChild(r); return r; };
  const add = (parent, key, no, text, sc, disabled) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.id = 'chip-' + key;
    b.setAttribute('aria-pressed', state && state.key === key ? 'true' : 'false');
    b.disabled = !!disabled;
    b.innerHTML = (no ? '<span class="no">' + no + '</span>' : '') + '<span>' + text + '</span>' + (sc ? '<span class="sc">' + sc + '</span>' : '');
    b.addEventListener('click', () => start(key));
    parent.appendChild(b);
  };
  const short = t => t.replace(/（.*?）/, '');
  const r1 = row('学科');
  SETS.filter(s => s.kind === '学科').forEach(s => add(r1, s.id, s.id, short(s.topic), setScore(s)));
  const r2 = row('実技');
  SETS.filter(s => s.kind === '実技').forEach(s => add(r2, s.id, s.id, s.topic.replace(/^実技 /, ''), setScore(s)));
  const r3 = row('演習');
  add(r3, 'mock', '', '学科 模擬試験 30問', '');
  add(r3, 'mix', '', '全セットから 10 問', '');
  const m = missedIds().length;
  add(r3, 'missed', '', 'まちがえた問題', m ? m + ' 問' : '', m === 0);
}

function renderBar() {
  const total = state.order.length;
  const answered = Object.keys(state.picked).length;
  document.getElementById('mode').textContent = state.label;
  document.getElementById('count').textContent = state.done ? '結果' : (Math.min(state.idx + 1, total) + ' / ' + total);
  document.getElementById('meter').style.width = (total ? answered / total * 100 : 0) + '%';
}

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

function renderQuestion() {
  const id = state.order[state.idx];
  const q = byId[id];
  const s = setById[q.set];
  const picked = state.picked[id];
  const card = el('section', 'card');
  card.setAttribute('aria-labelledby', 'qno');

  const head = el('div', 'qhead');
  head.appendChild(el('span', 'qno', '問 ' + q.n)).id = 'qno';
  head.appendChild(el('span', 'qtopic', q.topic));
  const src = el('a', 'qsrc', 'セット ' + q.set);
  src.href = q.setUrl; src.target = '_blank'; src.rel = 'noopener';
  head.appendChild(src);
  card.appendChild(head);

  const pr = el('details', 'box', '<summary>この分野の原理</summary>' + s.principle);
  pr.id = 'principle';
  card.appendChild(pr);
  if (q.scenario) {
    const sc = el('details', 'box', '<summary>事例</summary>' + q.scenario);
    sc.open = true;
    card.appendChild(sc);
  }
  card.appendChild(el('p', 'ask', q.ask));

  const ox = q.choices.length === 2;
  const ch = el('div', 'choices' + (ox ? ' ox' : ''));
  ch.setAttribute('role', 'group'); ch.setAttribute('aria-label', '選択肢');
  q.choices.forEach((c, i) => {
    const n = i + 1;
    const b = el('button', 'opt', ox ? '<span class="t">' + c + '</span>' : '<span class="k">' + KANA[i] + '</span><span class="t">' + c + '</span>');
    b.type = 'button'; b.id = 'opt-' + n;
    if (picked) {
      b.disabled = true;
      if (n === q.answer) b.classList.add('right');
      else if (n === picked) b.classList.add('wrong');
      else b.classList.add('dim');
    } else {
      b.addEventListener('click', () => answer(id, n));
    }
    ch.appendChild(b);
  });
  card.appendChild(ch);

  if (picked) {
    const ok = picked === q.answer;
    const v = el('div', 'verdict ' + (ok ? 'ok' : 'ng'), '<span class="mark" aria-hidden="true">' + (ok ? '○' : '×') + '</span>' + (ok ? '正解' : '不正解　正解は ' + label(q, q.answer - 1)));
    v.setAttribute('role', 'status');
    card.appendChild(v);
    card.appendChild(el('div', 'explain', q.explain));
    const act = el('div', 'actions');
    const last = state.idx === state.order.length - 1;
    const nx = el('button', 'btn', last ? '結果を見る' : '次の問題');
    nx.type = 'button'; nx.id = 'next';
    nx.addEventListener('click', () => { if (last) state.done = true; else state.idx++; render(); window.scrollTo({ top: 0 }); });
    act.appendChild(nx);
    card.appendChild(act);
  }
  return card;
}

function renderResult() {
  const ids = state.order;
  const right = ids.filter(id => state.picked[id] === byId[id].answer).length;
  const card = el('section', 'card result');
  card.appendChild(el('div', 'score', right + '<small> / ' + ids.length + ' 問</small>'));
  const rate = ids.length ? right / ids.length : 0;
  const pass = rate >= PASS;
  card.appendChild(el('p', 'pass', '正答率 ' + Math.round(rate * 100) + '%　<b class="' + (pass ? '' : 'ng') + '">' + (pass ? '合格ライン（70%）到達' : '合格ライン（70%）まであと ' + Math.max(0, Math.ceil(ids.length * PASS) - right) + ' 問') + '</b>'));
  const miss = ids.filter(id => state.picked[id] !== byId[id].answer);
  if (miss.length) {
    const ul = el('ul', 'missed');
    miss.forEach(id => { const q = byId[id]; ul.appendChild(el('li', '', '<span class="k">セット' + q.set + ' 問' + q.n + '</span>' + q.topic + '　正解 ' + label(q, q.answer - 1))); });
    card.appendChild(ul);
  }
  const act = el('div', 'actions');
  act.style.justifyContent = 'center';
  const again = el('button', 'btn ghost', 'もう一度');
  again.type = 'button'; again.addEventListener('click', () => start(state.key));
  act.appendChild(again);
  if (missedIds().length) {
    const mb = el('button', 'btn', 'まちがえた問題を解く');
    mb.type = 'button'; mb.addEventListener('click', () => start('missed'));
    act.appendChild(mb);
  }
  card.appendChild(act);
  return card;
}

function answer(id, n) {
  state.picked[id] = n;
  record[id] = { ok: n === byId[id].answer, at: Date.now() };
  save(record);
  render();
}

function render() {
  renderSets();
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  if (!state.order.length) {
    stage.appendChild(el('section', 'card', '<p class="ask">まちがえた問題はありません。セットを選んで解いてください。</p>'));
  } else {
    stage.appendChild(state.done ? renderResult() : renderQuestion());
  }
  renderBar();
}

document.getElementById('reset').addEventListener('click', () => {
  record = {}; save(record);
  document.getElementById('resetMsg').textContent = '成績を消しました';
  render();
});

let first = SETS.length ? SETS[0].id : null;
try { const k = sessionStorage.getItem(KEY + '-set'); if (k && (k === 'mix' || k === 'mock' || setById[k])) first = k; } catch (e) {}
if (first) start(first);
</script>
